<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>BS arcade center</title>
  <meta name="description" content="Des jeux faits maison, à lancer en un clic, sans compte et gratuitement.">
  <meta name="theme-color" content="#F5F5F7">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link id="polices" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Geist:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css?v=21">
</head>
<body>
  <a class="lien-evitement" href="#contenu">Aller au contenu</a>

  <!-- ===== En-tête ===== -->
  <header class="entete" id="entete">
    <div class="entete-int">
      <a class="marque" href="#/" aria-label="Accueil">
        <img id="logoEntete" class="marque-logo" alt="" hidden>
        <span id="nomEntete" class="marque-nom">BS arcade center</span>
      </a>

      <!-- Navigation principale (grand écran) : la pastille suit la page active -->
      <nav class="nav" aria-label="Navigation principale">
        <span class="nav-pastille" id="navPastille" aria-hidden="true"></span>
        <a href="#/" data-page="accueil">Accueil</a>
        <a href="#/jeux" data-page="jeux">Jeux</a>
        <a href="#/a-propos" data-page="a-propos">À propos</a>
        <a href="#/contact" data-page="contact">Contact</a>
      </nav>

      <div class="entete-actions">
        <button class="bouton-rond" type="button" id="btnRecherche" aria-label="Rechercher (raccourci : /)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        </button>
        <a class="btn plein petit entete-cta" href="#/jeux">Jouer</a>
        <button class="burger" id="burger" type="button" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="menu">
          <span></span><span></span>
        </button>
      </div>
    </div>
  </header>

  <!-- ===== Menu à droite ===== -->
  <div class="voile" id="voile" hidden></div>
  <nav class="menu" id="menu" aria-label="Menu" inert>
    <div>
      <p class="etiquette">Menu</p>
      <ul class="menu-liens" id="menuLiens"></ul>
    </div>
    <div class="menu-bas">
      <p class="etiquette">Derniers jeux</p>
      <div class="menu-jeux" id="menuJeux"></div>
      <div class="menu-reseaux" id="menuReseaux"></div>
    </div>
  </nav>

  <!-- ===== Contenu : chaque page s'affiche ici ===== -->
  <main id="contenu" tabindex="-1">
    <div class="vue" id="vue" aria-live="polite"></div>
  </main>

  <!-- ===== Pied de page ===== -->
  <footer class="pied">
    <div class="conteneur">
      <div class="pied-haut">
        <div class="pied-marque">
          <p class="pied-nom" id="piedNom">BS arcade center</p>
          <p class="pied-texte" id="piedAccroche"></p>
        </div>
        <div class="pied-colonnes">
          <div><p class="pied-titre">Le site</p><ul class="pied-liste" id="piedNav"></ul></div>
          <div><p class="pied-titre">Jeux</p><ul class="pied-liste" id="piedJeux"></ul></div>
          <div id="piedReseauxCol" hidden><p class="pied-titre">Réseaux</p><ul class="pied-liste" id="piedReseaux"></ul></div>
        </div>
      </div>
      <div class="pied-bas">
        <p id="pied"></p>
        <button class="lien-haut" type="button" id="btnHaut">Revenir en haut
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
      </div>
    </div>
  </footer>

  <!-- ===== Recherche rapide ===== -->
  <dialog class="palette" id="palette" aria-label="Recherche">
    <label class="palette-champ">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="paletteTexte" placeholder="Chercher un jeu ou une page…" autocomplete="off" aria-label="Rechercher">
      <kbd>Échap</kbd>
    </label>
    <ul class="palette-liste" id="paletteListe" role="listbox"></ul>
  </dialog>

  <!-- ===== Lecteur de jeu ===== -->
  <dialog class="lecteur" id="lecteur" aria-labelledby="lecteurTitre">
    <div class="lecteur-barre">
      <button class="btn petit" type="button" id="btnFermer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18 9 12l6-6"/></svg>Retour</button>
      <div class="lecteur-info"><h2 id="lecteurTitre"></h2><p id="lecteurGenre"></p></div>
      <div class="lecteur-actions">
        <button class="btn petit" type="button" id="btnRejouer">Recommencer</button>
        <button class="btn petit masque-mobile" type="button" id="btnPartager">Partager</button>
        <button class="btn petit" type="button" id="btnSuivant">Jeu suivant</button>
        <button class="bouton-rond" type="button" id="btnPleinEcran" aria-label="Plein écran"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
      </div>
    </div>
    <div class="lecteur-scene" id="scene"><p class="chargement" id="chargement"><span></span>Chargement du jeu…</p></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="script.js?v=21"></script>
</body>
</html>
