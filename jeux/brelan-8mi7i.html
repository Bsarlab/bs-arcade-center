<title>Brelan</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500..800&family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Limelight&display=swap">
<style>
/* Layout: a night salon. The catalogue page scrolls; each table is one full screen —
   opponents along the top rail, the play in the middle of the felt, your cards at the bottom. */
:root{
  --ink:#0f111c; --night:#171a2c; --night2:#1f2339; --line:#2c3150; --line2:#3a4066;
  --felt1:#1d3a5d; --felt2:#10213a;
  --brass:#d9a955; --brass2:#f2d08c;
  --paper:#f6efe1; --paper2:#e4d8c0;
  --red:#c2392d; --black:#1b1a23;
  --back:#2a2e68;
  --fg:#ece6d8; --mut:#9ca3c3;
  --ok:#7fc79b; --bad:#e2715f;
  --sk-n:#30479a; --sk-z:#4aa3d3; --sk-g:#5c9d59; --sk-y:#d6a32a; --sk-r:#c9432f;
  --u0:#c9402f; --u1:#dba62c; --u2:#4f9a5a; --u3:#3769b5;
  --a0:#d9a955; --a1:#d0533f; --a2:#59a9d8; --a3:#78b072; --a4:#a77ad1; --a5:#e08aa8; --a6:#4fb7a6; --a7:#c9b38a;
  --f-disp:"Limelight", "Didot", "Bodoni 72", serif;
  --f-ui:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --f-card:"Bodoni Moda", "Didot", "Bodoni 72", "Times New Roman", serif;
  color-scheme: dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--ink);color:var(--fg);font:15px/1.45 var(--f-ui);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input{font:inherit;color:inherit}
#app{height:100%;overflow-y:auto;overflow-x:hidden}
:focus-visible{outline:2px solid var(--brass2);outline-offset:2px}

.btn{appearance:none;border:1px solid var(--line2);background:var(--night2);padding:.62em 1.15em;border-radius:10px;font-weight:600;letter-spacing:.01em;transition:background .15s,border-color .15s,transform .1s;white-space:nowrap}
.btn:hover{border-color:var(--brass)}
.btn:active{transform:translateY(1px)}
.btn.pri{background:var(--brass);color:var(--ink);border-color:var(--brass)}
.btn.pri:hover{background:var(--brass2);border-color:var(--brass2)}
.btn:disabled{opacity:.42;cursor:not-allowed;transform:none}
.btn.ghost{background:transparent}
.btn.sm{padding:.36em .75em;font-size:13px;border-radius:8px}
.icon-btn{appearance:none;border:1px solid var(--line);background:color-mix(in srgb,var(--ink) 50%,transparent);width:38px;height:38px;border-radius:10px;display:grid;place-items:center;flex:none}
.icon-btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.icon-btn:hover{border-color:var(--brass)}

/* ---------- avatars ---------- */
.av{--c:var(--a0);width:30px;height:30px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-disp);font-size:15px;color:var(--ink);background:var(--c);box-shadow:inset 0 0 0 2px color-mix(in srgb,var(--ink) 18%,transparent)}
.av.lg{width:44px;height:44px;font-size:22px}
.av.c0{--c:var(--a0)}.av.c1{--c:var(--a1)}.av.c2{--c:var(--a2)}.av.c3{--c:var(--a3)}.av.c4{--c:var(--a4)}.av.c5{--c:var(--a5)}.av.c6{--c:var(--a6)}.av.c7{--c:var(--a7)}
.av.bot{background:repeating-linear-gradient(135deg,var(--c) 0 4px,color-mix(in srgb,var(--c) 70%,var(--ink)) 4px 8px)}
.tag{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;padding:2px 6px;border-radius:5px;border:1px solid var(--line2);color:var(--mut);font-weight:600;white-space:nowrap}
.tag.gold{border-color:var(--brass);color:var(--brass2)}
.tag.red{border-color:var(--bad);color:var(--bad)}
.tag.green{border-color:var(--ok);color:var(--ok)}

/* ---------- cards ---------- */
.card{--w:var(--cw,64px);width:var(--w);height:calc(var(--w)*1.42);position:relative;border-radius:calc(var(--w)*.1);flex:none;perspective:700px;user-select:none;-webkit-user-select:none}
.card .cf{position:absolute;inset:0;border-radius:inherit;background:var(--paper);color:var(--black);overflow:hidden;
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--black) 12%,transparent),0 1px 1px color-mix(in srgb,var(--ink) 50%,transparent),0 4px 10px color-mix(in srgb,var(--ink) 40%,transparent);backface-visibility:hidden}
.card.red .cf{color:var(--red)}
.card svg{fill:currentColor;display:block}
.ix{position:absolute;top:5%;left:7%;display:flex;flex-direction:column;align-items:center;line-height:.86;font-family:var(--f-card);font-weight:700;font-size:calc(var(--w)*.235);letter-spacing:-.03em}
.ix svg{width:calc(var(--w)*.15);height:calc(var(--w)*.15);margin-top:calc(var(--w)*.03)}
.ix.br{top:auto;left:auto;bottom:5%;right:7%;transform:rotate(180deg)}
.mid{position:absolute;inset:0;display:grid;place-items:center;align-content:center;justify-items:center}
.mid .big{font-family:var(--f-card);font-weight:800;font-size:calc(var(--w)*.56);line-height:.8;letter-spacing:-.05em;font-variation-settings:"opsz" 96}
.mid .big + svg{width:calc(var(--w)*.2);height:calc(var(--w)*.2);margin-top:calc(var(--w)*.06)}
.mid.ace svg{width:calc(var(--w)*.5);height:calc(var(--w)*.5)}
.mid.ace::before{content:"";position:absolute;width:calc(var(--w)*.72);height:calc(var(--w)*.72);border-radius:50%;border:1px solid currentColor;opacity:.35}
.court{position:absolute;inset:17% 19%;border:1.5px solid currentColor;border-radius:calc(var(--w)*.05);display:grid;place-items:center;align-content:center;
  background:repeating-linear-gradient(45deg,color-mix(in srgb,currentColor 9%,transparent) 0 2px,transparent 2px 6px)}
.court b{font-family:var(--f-disp);font-weight:400;font-size:calc(var(--w)*.4);line-height:1}
.court svg{width:calc(var(--w)*.17);height:calc(var(--w)*.17)}
.court.cat{background:var(--paper2)}
.court.cat svg{width:calc(var(--w)*.46);height:calc(var(--w)*.46)}
.card.back .cf{background-color:var(--back);
  background-image:repeating-linear-gradient(45deg,color-mix(in srgb,var(--brass) 26%,transparent) 0 1px,transparent 1px 6px),repeating-linear-gradient(-45deg,color-mix(in srgb,var(--brass) 26%,transparent) 0 1px,transparent 1px 6px);
  box-shadow:inset 0 0 0 calc(var(--w)*.055) var(--paper),inset 0 0 0 calc(var(--w)*.075) var(--brass),0 1px 1px color-mix(in srgb,var(--ink) 50%,transparent),0 4px 10px color-mix(in srgb,var(--ink) 40%,transparent)}
.card.back .cf::before{content:"";position:absolute;left:50%;top:50%;width:calc(var(--w)*.34);height:calc(var(--w)*.34);translate:-50% -50%;rotate:45deg;background:var(--back);border:1px solid var(--brass2)}
.card.back .cf::after{content:"B";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-disp);font-size:calc(var(--w)*.25);color:var(--brass2)}
.card.xs .cf::after,.card.xs .cf::before{display:none}
.card.hole{background:color-mix(in srgb,var(--ink) 30%,transparent);border:1px dashed color-mix(in srgb,var(--paper) 18%,transparent)}
.card.slotph{background:color-mix(in srgb,var(--ink) 25%,transparent);border:1.5px dashed color-mix(in srgb,var(--brass) 35%,transparent)}
/* small cards: centre only */
.card.xs .ix,.card.sm .ix.br{display:none}
.card.xs .mid .big{font-size:calc(var(--w)*.6)}
.card.xs .mid .big + svg{display:none}

/* Skyjo faces */
.card.sky .cf{color:var(--paper)}
.card.sky.t-n .cf{background:var(--sk-n)}.card.sky.t-z .cf{background:var(--sk-z)}.card.sky.t-g .cf{background:var(--sk-g)}.card.sky.t-y .cf{background:var(--sk-y)}.card.sky.t-r .cf{background:var(--sk-r)}
.card.sky .cf::before{content:"";position:absolute;inset:calc(var(--w)*.07);border-radius:calc(var(--w)*.06);border:1px solid color-mix(in srgb,var(--paper) 55%,transparent)}
.card.sky .sv{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-card);font-weight:800;font-size:calc(var(--w)*.5);letter-spacing:-.04em;text-shadow:0 2px 0 color-mix(in srgb,var(--ink) 35%,transparent)}
.card.sky .sx{position:absolute;top:9%;left:12%;font-family:var(--f-card);font-weight:700;font-size:calc(var(--w)*.17)}
.card.sky .sx.br{top:auto;left:auto;bottom:9%;right:12%;transform:rotate(180deg)}
.card.sky.xs .sx,.card.sky.xs .cf::before{display:none}
.card.sky.xs .sv{font-size:calc(var(--w)*.62);text-shadow:none}

/* Uno faces */
.card.uno .cf{color:var(--paper)}
.card.uno.u0 .cf{background:var(--u0)}.card.uno.u1 .cf{background:var(--u1)}.card.uno.u2 .cf{background:var(--u2)}.card.uno.u3 .cf{background:var(--u3)}
.card.uno.uw .cf{background:var(--black);box-shadow:inset 0 0 0 calc(var(--w)*.05) var(--brass),0 4px 10px color-mix(in srgb,var(--ink) 40%,transparent)}
.card.uno .cf::before{content:"";position:absolute;inset:calc(var(--w)*.07);border-radius:calc(var(--w)*.06);border:1px solid color-mix(in srgb,var(--paper) 50%,transparent)}
.card.uno .ub{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--f-card);font-weight:800;font-size:calc(var(--w)*.56);letter-spacing:-.04em;text-shadow:0 2px 0 color-mix(in srgb,var(--ink) 35%,transparent)}
.card.uno .ub.sm{font-size:calc(var(--w)*.42)}
.card.uno .um{position:absolute;inset:0;display:grid;place-items:center}
.card.uno .um svg{width:56%;height:56%}
.card.uno .um.wild svg{width:66%;height:66%}
.card.uno .um.wild b{position:absolute;font-family:var(--f-card);font-weight:800;font-size:calc(var(--w)*.3);color:var(--paper);text-shadow:0 2px 3px var(--ink)}
.card.uno .ux{position:absolute;top:7%;left:10%;font-family:var(--f-card);font-weight:700;font-size:calc(var(--w)*.17);line-height:1;display:flex}
.card.uno .ux svg{width:calc(var(--w)*.17);height:calc(var(--w)*.17)}
.card.uno .ux.br{top:auto;left:auto;bottom:7%;right:10%;transform:rotate(180deg)}
.card.uno.xs .ux{display:none}
.card.uno.ring.u0 .cf,.card.uno.ring.u1 .cf,.card.uno.ring.u2 .cf,.card.uno.ring.u3 .cf{outline:none}
.card.uno.uw.ring.u0 .cf{box-shadow:inset 0 0 0 calc(var(--w)*.07) var(--u0),0 0 18px color-mix(in srgb,var(--u0) 60%,transparent)}
.card.uno.uw.ring.u1 .cf{box-shadow:inset 0 0 0 calc(var(--w)*.07) var(--u1),0 0 18px color-mix(in srgb,var(--u1) 60%,transparent)}
.card.uno.uw.ring.u2 .cf{box-shadow:inset 0 0 0 calc(var(--w)*.07) var(--u2),0 0 18px color-mix(in srgb,var(--u2) 60%,transparent)}
.card.uno.uw.ring.u3 .cf{box-shadow:inset 0 0 0 calc(var(--w)*.07) var(--u3),0 0 18px color-mix(in srgb,var(--u3) 60%,transparent)}
.udot{display:inline-block;width:11px;height:11px;border-radius:50%;vertical-align:-1px;box-shadow:0 0 0 2px color-mix(in srgb,var(--paper) 25%,transparent)}
.udot.u0{background:var(--u0)}.udot.u1{background:var(--u1)}.udot.u2{background:var(--u2)}.udot.u3{background:var(--u3)}

/* interactive cards */
.can{cursor:pointer}
.card.can .cf{transition:box-shadow .15s}
.card.can:hover .cf,.card.lift .cf{box-shadow:inset 0 0 0 2px var(--brass2),0 0 0 3px color-mix(in srgb,var(--brass) 35%,transparent),0 8px 18px color-mix(in srgb,var(--ink) 55%,transparent)}
.card.dim{opacity:.5}
.card.glow .cf{box-shadow:inset 0 0 0 2px var(--brass2),0 0 18px color-mix(in srgb,var(--brass) 55%,transparent)}
.stack{display:grid}
.stack>*{grid-area:1/1}
.stack>.card:not(:last-child){translate:-2px 2px}

/* ---------- toasts / sheets ---------- */
#toasts{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));translate:-50% 0;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:100;pointer-events:none;width:min(92vw,460px)}
.toast{background:var(--night2);border:1px solid var(--line2);padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px color-mix(in srgb,var(--ink) 60%,transparent);font-weight:500;text-align:center;animation:tin .25s ease-out}
.toast.big{font-family:var(--f-disp);font-size:22px;color:var(--brass2);border-color:var(--brass)}
@keyframes tin{from{opacity:0;translate:0 10px}to{opacity:1;translate:0 0}}
.modal{position:fixed;inset:0;z-index:90;background:color-mix(in srgb,var(--ink) 72%,transparent);display:grid;place-items:center;padding:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sheet{background:var(--night);border:1px solid var(--line2);border-radius:18px;padding:22px;width:min(100%,520px);max-height:calc(100% - 20px);overflow:auto;box-shadow:0 30px 80px color-mix(in srgb,var(--ink) 70%,transparent);animation:tin .25s ease-out}
.sheet h2{font-family:var(--f-disp);font-weight:400;font-size:30px;margin:0 0 4px;color:var(--brass2);text-wrap:balance;line-height:1.05}
.sheet p{color:var(--mut);margin:.4em 0 1em}
.sheet .btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;margin-top:18px}
.rules{color:var(--fg);line-height:1.6}
.rules li{margin:.35em 0}
.score{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
.score th{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);font-weight:600;text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.score td{padding:9px 8px;border-bottom:1px solid var(--line)}
.score td.n{text-align:right;font-family:var(--f-card);font-weight:700;font-size:17px}
.score th.n{text-align:right}
.score .pn{display:flex;align-items:center;gap:10px}
.score tr.lead td{color:var(--brass2)}

/* ---------- home ---------- */
.home{max-width:1120px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:30px 56px;display:flex;flex-direction:column;gap:44px}
.hero{display:grid;grid-template-columns:1fr minmax(260px,340px);gap:28px;align-items:end}
@media (max-width:780px){.hero{grid-template-columns:1fr}}
.brand{display:flex;gap:18px;align-items:center;min-width:0}
.logo-fan{position:relative;width:118px;height:112px;flex:none;--cw:58px}
.logo-fan .card{position:absolute;left:30px;top:16px;transform-origin:50% 115%}
.logo-fan .card:nth-child(1){rotate:-18deg}.logo-fan .card:nth-child(3){rotate:18deg}
.brand h1{font-family:var(--f-disp);font-weight:400;font-size:clamp(54px,10vw,104px);line-height:.85;margin:0;color:var(--brass2)}
.brand p{margin:.7em 0 0;color:var(--mut);max-width:40ch;font-size:16px}
.me-card{display:flex;flex-direction:column;gap:12px;padding:16px;border:1px solid var(--line);border-radius:16px;background:var(--night)}
.me-card label{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--mut);font-weight:600}
.me-row{display:flex;gap:10px;align-items:center}
.me-row input{flex:1;min-width:0;background:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:.6em .8em;font-weight:600}
.me-row input:focus{border-color:var(--brass);outline:none}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.swatches button{appearance:none;border:none;padding:0;background:none;border-radius:50%}
.swatches button[aria-pressed="true"] .av{box-shadow:0 0 0 2px var(--ink),0 0 0 4px var(--brass2)}
.sec{display:flex;flex-direction:column;gap:16px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap}
.sec-h h2{font-family:var(--f-disp);font-weight:400;font-size:28px;margin:0;color:var(--fg)}
.status{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--mut)}
.status i{width:8px;height:8px;border-radius:50%;background:var(--mut)}
.status.on i{background:var(--ok);box-shadow:0 0 0 3px color-mix(in srgb,var(--ok) 25%,transparent)}
.status.off i{background:var(--bad)}
.tables{display:flex;flex-direction:column;gap:10px}
.trow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;background:var(--night);border:1px solid var(--line);border-radius:14px}
.trow .gname{font-family:var(--f-disp);font-size:20px;color:var(--brass2)}
.trow .meta{color:var(--mut);font-size:13px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.trow .avs{display:flex}
.trow .avs .av{width:24px;height:24px;font-size:12px;margin-left:-6px}
.trow .avs .av:first-child{margin-left:0}
.tcode{font-family:var(--f-card);font-weight:800;letter-spacing:.12em;font-size:15px;color:var(--fg);background:var(--ink);border:1px solid var(--line2);padding:6px 10px;border-radius:8px}
.empty{padding:22px;border:1px dashed var(--line2);border-radius:14px;color:var(--mut);text-align:center}
.joincode{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.joincode input{width:120px;text-transform:uppercase;letter-spacing:.2em;font-weight:700;background:var(--ink);border:1px solid var(--line2);border-radius:10px;padding:.55em .8em}
.games{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:1000px){.games{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.games{grid-template-columns:1fr}}
.tile{display:flex;flex-direction:column;gap:12px;padding:16px;background:linear-gradient(180deg,var(--night2),var(--night));border:1px solid var(--line);border-radius:18px;min-width:0}
.tile .art{height:128px;display:flex;align-items:center;justify-content:center;--cw:56px;border-radius:12px;background:radial-gradient(90% 90% at 50% 40%,var(--felt1),var(--felt2))}
.art .fan{display:flex}
.art .fan .card{margin-left:calc(var(--cw)*-.38)}
.art .fan .card:first-child{margin-left:0}
.art .fan .card:nth-child(odd){rotate:-6deg}.art .fan .card:nth-child(even){rotate:5deg;translate:0 -4px}
.tile h3{font-family:var(--f-disp);font-weight:400;font-size:26px;margin:0;color:var(--brass2);line-height:1}
.tile p{margin:0;color:var(--mut);font-size:14px;flex:1}
.tile .meta{display:flex;gap:6px;flex-wrap:wrap}
.tile .acts{display:flex;gap:8px;flex-wrap:wrap}
.solo{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:20px;align-items:center;padding:16px 18px;background:var(--night);border:1px solid var(--line);border-radius:18px}
.solo .art{--cw:44px;display:flex;gap:4px}
.solo .art .col{display:flex;flex-direction:column}
.solo .art .col .card+.card{margin-top:calc(var(--cw)*-1.1)}
.solo h3{font-family:var(--f-disp);font-weight:400;font-size:26px;margin:0;color:var(--brass2)}
.solo p{margin:.2em 0 0;color:var(--mut)}
@media (max-width:620px){.solo{grid-template-columns:1fr}}
.note{color:var(--mut);font-size:13.5px;max-width:70ch;line-height:1.6}
.note b{color:var(--fg);font-weight:600}
.banner{padding:12px 14px;border-radius:12px;border:1px solid color-mix(in srgb,var(--bad) 60%,transparent);background:color-mix(in srgb,var(--bad) 10%,var(--night));font-size:14px}

/* ---------- table view ---------- */
.tv{height:100%;display:flex;flex-direction:column;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  background:radial-gradient(120% 75% at 50% 48%,var(--felt1),var(--felt2) 68%,var(--ink));overflow:hidden}
@media (min-width:500px){.tv{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.top{display:flex;align-items:center;gap:10px;padding-block:10px;flex:none}
.top .tt{display:flex;align-items:baseline;gap:10px;min-width:0;flex:1}
.top h1{font-family:var(--f-disp);font-weight:400;font-size:24px;margin:0;color:var(--brass2);white-space:nowrap}
.top .tcode{font-size:13px;padding:4px 8px;cursor:pointer;border-style:dashed}
.top .sub{color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stage{flex:1;min-height:0;display:flex;flex-direction:column;gap:8px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}

<script id="logic">
'use strict';
/* =================== shared card helpers =================== */
const R = c => c % 13, S = c => (c / 13) | 0, red = c => { const s = S(c); return s === 1 || s === 2; };
const RK = ['2','3','4','5','6','7','8','9','10','V','D','R','A'];
const SUIT_NAME = ['pique','cœur','carreau','trèfle'];
const RK_NAME = ['2','3','4','5','6','7','8','9','10','valet','dame','roi','as'];
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr, r){ const a = arr.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); const t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function rng(s){ s.rn = (s.rn || 0) + 1; return mulberry32((s.seed ^ Math.imul(s.rn, 2654435761)) >>> 0); }
const clone = o => JSON.parse(JSON.stringify(o));
const E = m => { const e = new Error(m); e.user = 1; return e; };
function log(s, m){ if (s._new) s.lg[1] += ' ' + m; else { s.lg = [((s.lg && s.lg[0]) || 0) + 1, m]; s._new = 1; } }
const range = n => [...Array(n).keys()];

/* =================== SKYJO =================== */
const SKYJO = (() => {
  const val = id => id < 5 ? -2 : id < 15 ? -1 : id < 30 ? 0 : 1 + ((id - 30) / 10 | 0);
  function deal(s){
    const dk = shuffle(range(150), rng(s));
    s.g = []; s.u = [];
    for (let p = 0; p < s.n; p++) { s.g.push(dk.splice(-12)); s.u.push(Array(12).fill(0)); }
    s.ds = [dk.pop()]; s.dk = dk; s.hv = -1; s.hf = ''; s.ph = 'reveal'; s.fin = -1; s.left = 0; s.turn = 0; s.rs = [];
  }
  function setup(n, seed){ const s = { n, seed, rn: 0, rnd: 1, tot: Array(n).fill(0), st: -1, lg: [0, ''] }; deal(s); return s; }
  function next(s){ s = clone(s); if (s.ph === 'over') { s.tot = s.tot.map(() => 0); s.rnd = 0; s.st = -1; } s.rnd++; deal(s); return s; }
  const nUp = (s, p) => s.u[p].filter(Boolean).length;
  const visible = (s, p) => s.g[p].reduce((a, id, k) => a + (id >= 0 && s.u[p][k] ? val(id) : 0), 0);
  function cols(s, p){
    const g = s.g[p], u = s.u[p];
    for (let c = 0; c < 4; c++) {
      const ks = [c, c + 4, c + 8];
      if (ks.every(k => g[k] >= 0 && u[k]) && ks.every(k => val(g[k]) === val(g[c]))) {
        ks.forEach(k => { s.ds.push(g[k]); g[k] = -1; });
        log(s, `@${p} élimine une colonne de ${val(s.ds[s.ds.length-1])} !`);
      }
    }
  }
  function endRound(s){
    s.u = s.u.map(u => u.map(() => 1));
    const rs = s.g.map(g => g.reduce((a, id) => a + (id >= 0 ? val(id) : 0), 0));
    s.dbl = 0;
    if (s.fin >= 0) {
      const others = rs.filter((_, i) => i !== s.fin);
      if (rs[s.fin] > 0 && others.length && rs[s.fin] >= Math.min(...others)) { rs[s.fin] *= 2; s.dbl = 1; }
    }
    s.rs = rs; s.tot = s.tot.map((t, i) => t + rs[i]);
    s.st = s.fin;
    s.ph = s.tot.some(t => t >= 100) ? 'over' : 'end';
    log(s, s.ph === 'over' ? 'Partie terminée !' : 'Fin de la manche.');
  }
  function endTurn(s, p){
    const done = s.g[p].every((id, k) => id < 0 || s.u[p][k]);
    if (s.ph === 'play' && done) {
      s.fin = p; s.ph = 'last'; s.left = s.n - 1;
      log(s, `@${p} a tout retourné : dernier tour !`);
      if (s.left <= 0) return endRound(s);
      s.turn = (p + 1) % s.n; return;
    }
    if (s.ph === 'last') { s.left--; if (s.left <= 0) return endRound(s); }
    s.turn = (p + 1) % s.n;
  }
  function act(s, p, a){
    s = clone(s);
    const g = s.g[p], u = s.u[p];
    const i = a.i | 0;
    if (a.t === 'flip') {
      if (s.ph !== 'reveal') throw E('Ce n’est plus le moment de retourner des cartes.');
      if (nUp(s, p) >= 2) throw E('Tu as déjà retourné tes 2 cartes.');
      if (i < 0 || i > 11 || u[i]) throw E('Choisis une carte cachée.');
      u[i] = 1;
      if (s.u.every((_, q) => nUp(s, q) >= 2)) {
        let st = s.st;
        if (st < 0) { let best = -99; s.g.forEach((_, q) => { const v = visible(s, q); if (v > best) { best = v; st = q; } }); log(s, `@${st} a la plus grosse main visible et commence.`); }
        else log(s, `@${st} a fini la manche précédente et commence.`);
        s.ph = 'play'; s.turn = st;
      }
      return s;
    }
    if (s.ph !== 'play' && s.ph !== 'last') throw E('La manche est terminée.');
    if (p !== s.turn) throw E('Ce n’est pas ton tour.');
    if (a.t === 'draw') {
      if (s.hv >= 0) throw E('Tu as déjà une carte en main.');
      if (!s.dk.length) { const top = s.ds.pop(); s.dk = shuffle(s.ds, rng(s)); s.ds = [top]; log(s, 'La défausse est remélangée.'); }
      if (!s.dk.length) throw E('La pioche est vide.');
      s.hv = s.dk.pop(); s.hf = 'd'; return s;
    }
    if (a.t === 'take') {
      if (s.hv >= 0) throw E('Tu as déjà une carte en main.');
      if (!s.ds.length) throw E('La défausse est vide.');
      s.hv = s.ds.pop(); s.hf = 'x'; return s;
    }
    if (a.t === 'swap') {
      if (s.hv < 0) throw E('Pioche d’abord une carte.');
      if (i < 0 || i > 11 || g[i] < 0) throw E('Choisis une de tes cartes.');
      const old = g[i]; g[i] = s.hv; u[i] = 1; s.ds.push(old); s.hv = -1; s.hf = '';
      cols(s, p); endTurn(s, p); return s;
    }
    if (a.t === 'drop') {
      if (s.hv < 0 || s.hf !== 'd') throw E('Seule une carte piochée peut être défaussée.');
      if (i < 0 || i > 11 || g[i] < 0 || u[i]) throw E('Choisis une carte encore cachée.');
      s.ds.push(s.hv); s.hv = -1; s.hf = ''; u[i] = 1;
      cols(s, p); endTurn(s, p); return s;
    }
    throw E('Action inconnue.');
  }
  function bot(s, i){
    if (s.ph === 'reveal') {
      if (nUp(s, i) >= 2) return null;
      const hid = range(12).filter(k => !s.u[i][k]);
      return { t: 'flip', i: hid[Math.floor(Math.random() * hid.length)] };
    }
    if ((s.ph !== 'play' && s.ph !== 'last') || s.turn !== i) return null;
    const g = s.g[i], u = s.u[i];
    const hidden = [], ups = [];
    g.forEach((id, k) => { if (id >= 0) (u[k] ? ups : hidden).push(k); });
    const colMatch = v => {
      for (let c = 0; c < 4; c++) {
        const ks = [c, c + 4, c + 8];
        if (ks.some(k => g[k] < 0)) continue;
        const same = ks.filter(k => u[k] && val(g[k]) === v);
        if (same.length === 2) return ks.find(k => !same.includes(k));
      }
      return -1;
    };
    let wk = -1, wv = -99; ups.forEach(k => { const v = val(g[k]); if (v > wv) { wv = v; wk = k; } });
    const rh = () => hidden[Math.floor(Math.random() * hidden.length)];
    if (s.hv < 0) {
      const top = val(s.ds[s.ds.length - 1]);
      if (colMatch(top) >= 0 || top <= 2 || (top <= 5 && wv - top >= 4)) return { t: 'take' };
      return { t: 'draw' };
    }
    const v = val(s.hv);
    const cm = colMatch(v); if (cm >= 0) return { t: 'swap', i: cm };
    if (wk >= 0 && wv >= v + 3) return { t: 'swap', i: wk };
    if (v <= 4 && hidden.length) return { t: 'swap', i: rh() };
    if (s.hf === 'd' && hidden.length) return { t: 'drop', i: rh() };
    if (wk >= 0 && wv > v) return { t: 'swap', i: wk };
    return { t: 'swap', i: hidden.length ? rh() : (wk >= 0 ? wk : g.findIndex(x => x >= 0)) };
  }
  const turns = s => s.ph === 'reveal' ? range(s.n).filter(q => nUp(s, q) < 2) : (s.ph === 'play' || s.ph === 'last') ? [s.turn] : [];
  return { id: 'skyjo', name: 'Skyjo', min: 2, max: 8, setup, next, act, bot, turns, val, visible, nUp };
})();

/* =================== PRÉSIDENT =================== */
const PRES = (() => {
  const pv = c => (R(c) + 12) % 13;
  const DQH = 13 + 10;
  const sortH = h => h.sort((a, b) => pv(a) - pv(b) || S(a) - S(b));
  const ROLE = { '2': 'Président', '1': 'Vice-président', '0': 'Neutre', '-1': 'Vice-trouduc', '-2': 'Trouduc' };
  function deal(s){
    const d = shuffle(range(52), rng(s));
    s.h = range(s.n).map(() => []);
    d.forEach((c, i) => s.h[i % s.n].push(c));
    s.h.forEach(sortH);
    s.pile = []; s.un = []; s.pb = -1; s.passed = Array(s.n).fill(0); s.out = []; s.ph = 'play';
    if (s.roles && s.roles.length === s.n) {
      const P = s.roles.indexOf(2), T = s.roles.indexOf(-2), V = s.roles.indexOf(1), VT = s.roles.indexOf(-1);
      const ex = (a, b, k) => {
        const best = s.h[b].slice(-k), worst = s.h[a].slice(0, k);
        s.h[b] = s.h[b].slice(0, -k).concat(worst); s.h[a] = s.h[a].slice(k).concat(best);
        sortH(s.h[a]); sortH(s.h[b]);
      };
      if (P >= 0 && T >= 0) ex(P, T, 2);
      if (V >= 0 && VT >= 0) ex(V, VT, 1);
      s.turn = T >= 0 ? T : 0;
      log(s, `Échange fait : @${T} donne ses 2 meilleures cartes à @${P}. @${s.turn} commence.`);
    } else {
      s.turn = s.h.findIndex(h => h.includes(DQH));
      log(s, `@${s.turn} a la dame de cœur et commence.`);
    }
  }
  function setup(n, seed){ const s = { n, seed, rn: 0, rnd: 1, pts: Array(n).fill(0), roles: [], lg: [0, ''] }; deal(s); return s; }
  function next(s){ s = clone(s); s.rnd++; deal(s); return s; }
  const active = (s, i) => !s.out.includes(i);
  function nextExcl(s, p){ for (let k = 1; k < s.n; k++) { const j = (p + k) % s.n; if (active(s, j) && !s.passed[j]) return j; } return -1; }
  function nextAct(s, p){ for (let k = 1; k <= s.n; k++) { const j = (p + k) % s.n; if (active(s, j)) return j; } return -1; }
  function close(s, w){ s.un = s.pile; s.pile = []; s.passed = s.passed.map(() => 0); s.pb = -1; s.turn = active(s, w) ? w : nextAct(s, w); }
  function finish(s){
    const n = s.n, roles = Array(n).fill(0);
    s.out.forEach((p, k) => {
      if (k === 0) roles[p] = 2; else if (k === n - 1) roles[p] = -2;
      else if (n >= 4 && k === 1) roles[p] = 1; else if (n >= 4 && k === n - 2) roles[p] = -1;
    });
    s.roles = roles; roles.forEach((r, i) => s.pts[i] += r);
    s.ph = 'end'; if (s.pile.length) s.un = s.pile; s.pile = [];
    log(s, `@${s.out[0]} devient Président !`);
  }
  function checkEnd(s){
    const left = range(s.n).filter(i => active(s, i));
    if (left.length <= 1) { if (left.length) s.out.push(left[0]); finish(s); return true; }
    return false;
  }
  function act(s, p, a){
    s = clone(s);
    if (s.ph !== 'play') throw E('La manche est terminée.');
    if (p !== s.turn) throw E('Ce n’est pas ton tour.');
    if (a.t === 'play') {
      const cs = Array.isArray(a.cs) ? a.cs.map(Number) : [];
      if (!cs.length || cs.length > 4) throw E('Choisis 1 à 4 cartes.');
      if (new Set(cs).size !== cs.length || !cs.every(c => s.h[p].includes(c))) throw E('Carte invalide.');
      if (!cs.every(c => R(c) === R(cs[0]))) throw E('Les cartes doivent avoir la même valeur.');
      if (s.pile.length) {
        if (cs.length !== s.pile.length) throw E(`Il faut poser ${s.pile.length} carte${s.pile.length > 1 ? 's' : ''}.`);
        if (pv(cs[0]) <= pv(s.pile[0])) throw E('Il faut une valeur plus forte.');
      }
      s.h[p] = s.h[p].filter(c => !cs.includes(c));
      s.un = s.pile; s.pile = cs; s.pb = p;
      if (!s.h[p].length) { s.out.push(p); log(s, `@${p} a vidé sa main (${s.out.length === 1 ? '1er' : s.out.length + 'e'}).`); }
      if (checkEnd(s)) return s;
      if (pv(cs[0]) === 12) { log(s, `@${p} ferme le pli.`); close(s, p); return s; }
      const nx = nextExcl(s, p);
      if (nx < 0) close(s, p); else s.turn = nx;
      return s;
    }
    if (a.t === 'pass') {
      if (!s.pile.length) throw E('Tu ouvres le pli : pose au moins une carte.');
      s.passed[p] = 1;
      const nx = nextExcl(s, p);
      if (nx < 0 || nx === s.pb) close(s, s.pb); else s.turn = nx;
      return s;
    }
    throw E('Action inconnue.');
  }
  function bot(s, i){
    if (s.ph !== 'play' || s.turn !== i) return null;
    const h = s.h[i], groups = {};
    h.forEach(c => (groups[R(c)] = groups[R(c)] || []).push(c));
    const gs = Object.values(groups).sort((a, b) => pv(a[0]) - pv(b[0]));
    if (!s.pile.length) { const g = gs.find(g => pv(g[0]) < 12) || gs[0]; return { t: 'play', cs: g }; }
    const k = s.pile.length, top = pv(s.pile[0]);
    const opts = gs.filter(g => g.length >= k && pv(g[0]) > top);
    const pick = opts.find(g => g.length === k && pv(g[0]) < 12) || opts.find(g => pv(g[0]) < 12) || (h.length <= 5 ? opts[0] : null);
    if (!pick) return { t: 'pass' };
    return { t: 'play', cs: pick.slice(0, k) };
  }
  const turns = s => s.ph === 'play' ? [s.turn] : [];
  return { id: 'president', name: 'Président', min: 3, max: 8, setup, next, act, bot, turns, pv, ROLE };
})();

/* =================== MISTIGRI =================== */
const MIST = (() => {
  const CAT = 9; // valet de pique
  const DECK = range(52).filter(c => R(c) >= 5 && c !== 3 * 13 + 9);
  const mate = (h, c) => h.findIndex(x => x !== c && R(x) === R(c) && red(x) === red(c));
  function strip(h){
    h = h.slice(); let n = 0;
    for (let i = 0; i < h.length; i++) { const m = mate(h, h[i]); if (m >= 0) { const a = h[i], b = h[m]; h = h.filter(x => x !== a && x !== b); n++; i = -1; } }
    return [h, n];
  }
  const activeL = s => range(s.n).filter(i => !s.out[i]);
  function nextAct(s, p){ for (let k = 1; k < s.n; k++) { const j = (p + k) % s.n; if (!s.out[j]) return j; } return -1; }
  function deal(s){
    const d = shuffle(DECK, rng(s));
    const hs = range(s.n).map(() => []);
    d.forEach((c, i) => hs[i % s.n].push(c));
    s.pr = Array(s.n).fill(0);
    s.h = hs.map((h, i) => { const r = strip(h); s.pr[i] = r[1]; return shuffle(r[0], rng(s)); });
    s.out = s.h.map(h => h.length ? 0 : 1);
    s.ph = 'play'; s.last = { n: 0 }; s.lp = []; s.loser = -1;
    let t = s.st >= 0 ? s.st : 0; if (s.out[t]) t = nextAct(s, t);
    s.turn = t;
    log(s, `Les paires sont défaussées. @${t} commence.`);
    if (activeL(s).length <= 1) endR(s);
  }
  function endR(s){ const l = activeL(s)[0]; s.ph = 'end'; s.loser = l == null ? -1 : l; if (l != null) { s.ls[l]++; s.st = l; log(s, `@${l} garde le Mistigri !`); } }
  function setup(n, seed){ const s = { n, seed, rn: 0, rnd: 1, ls: Array(n).fill(0), st: -1, lg: [0, ''] }; deal(s); return s; }
  function next(s){ s = clone(s); s.rnd++; deal(s); return s; }
  const target = (s, p) => nextAct(s, p);
  function act(s, p, a){
    s = clone(s);
    if (a.t === 'shuf') {
      if (s.ph !== 'play' || s.out[p]) throw E('Tu n’as plus de cartes.');
      s.h[p] = shuffle(s.h[p], rng(s)); return s;
    }
    if (a.t !== 'draw') throw E('Action inconnue.');
    if (s.ph !== 'play') throw E('La manche est terminée.');
    if (p !== s.turn) throw E('Ce n’est pas ton tour.');
    const t = target(s, p), k = a.k | 0;
    if (t < 0 || k < 0 || k >= s.h[t].length) throw E('Carte invalide.');
    const c = s.h[t].splice(k, 1)[0];
    const m = mate(s.h[p], c);
    if (m >= 0) { const c2 = s.h[p].splice(m, 1)[0]; s.lp = [c2, c]; s.pr[p]++; log(s, `@${p} fait une paire de ${RK_NAME[R(c)]}${R(c) >= 9 ? 's' : ''}.`); }
    else { const pos = Math.floor(rng(s)() * (s.h[p].length + 1)); s.h[p].splice(pos, 0, c); }
    s.last = { n: (s.last.n || 0) + 1, f: t, to: p, c, pr: m >= 0 ? 1 : 0 };
    if (!s.h[t].length) { s.out[t] = 1; log(s, `@${t} n’a plus de cartes.`); }
    if (!s.h[p].length) { s.out[p] = 1; log(s, `@${p} n’a plus de cartes.`); }
    if (activeL(s).length <= 1) { endR(s); return s; }
    s.turn = nextAct(s, p);
    return s;
  }
  function bot(s, i){
    if (s.ph !== 'play' || s.turn !== i) return null;
    const t = target(s, i); if (t < 0) return null;
    return { t: 'draw', k: Math.floor(Math.random() * s.h[t].length) };
  }
  const turns = s => s.ph === 'play' ? [s.turn] : [];
  return { id: 'mistigri', name: 'Mistigri', min: 2, max: 8, setup, next, act, bot, turns, target, CAT };
})();

/* =================== UNO =================== */
const UNO = (() => {
  const COL = ['rouge', 'jaune', 'vert', 'bleu'];
  const col = c => c < 100 ? (c / 25) | 0 : -1;
  const sym = c => { if (c >= 104) return 'w4'; if (c >= 100) return 'w'; const k = c % 25; return k === 0 ? '0' : k <= 18 ? String(1 + ((k - 1) >> 1)) : k <= 20 ? 'd2' : k <= 22 ? 'rv' : 'sk'; };
  const pts = c => { const y = sym(c); return (y === 'w' || y === 'w4') ? 50 : (y === 'd2' || y === 'rv' || y === 'sk') ? 20 : +y; };
  const NAME = { d2: '+2', rv: 'Inversion', sk: 'Passe', w: 'Joker', w4: '+4' };
  const step = (s, i) => (i + s.dir + s.n) % s.n;
  const top = s => s.ds[s.ds.length - 1];
  const playable = (s, c) => c >= 100 || col(c) === s.su || sym(c) === sym(top(s));
  function deal(s){
    const d = shuffle(range(108), rng(s));
    s.h = range(s.n).map(() => d.splice(-7));
    const ti = d.findIndex(c => c < 100 && /^\d$/.test(sym(c)));
    const t = d.splice(ti, 1)[0];
    s.ds = [t]; s.dk = d; s.su = col(t); s.dir = 1; s.dr = 0; s.turn = s.st % s.n; s.ph = 'play'; s.win = -1; s.rp = []; s.uno = Array(s.n).fill(0);
    log(s, `@${s.turn} commence.`);
  }
  function setup(n, seed){ const s = { n, seed, rn: 0, rnd: 1, sc: Array(n).fill(0), st: 0, lg: [0, ''] }; deal(s); return s; }
  function next(s){ s = clone(s); if (s.ph === 'over') { s.sc = s.sc.map(() => 0); s.rnd = 0; } s.rnd++; s.st = (s.st + 1) % s.n; deal(s); return s; }
  function drawOne(s){
    if (!s.dk.length) { if (s.ds.length <= 1) return -1; const t = s.ds.pop(); s.dk = shuffle(s.ds, rng(s)); s.ds = [t]; }
    return s.dk.pop();
  }
  function give(s, p, k){ for (let i = 0; i < k; i++) { const d = drawOne(s); if (d >= 0) s.h[p].push(d); } s.uno[p] = 0; }
  function act(s, p, a){
    s = clone(s);
    if (s.ph !== 'play') throw E('La manche est terminée.');
    if (a.t === 'uno') {
      if (s.h[p].length > 2) throw E('Tu as encore trop de cartes pour crier UNO.');
      if (!s.uno[p]) { s.uno[p] = 1; log(s, `@${p} crie UNO !`); }
      return s;
    }
    if (a.t === 'catch') {
      const i = a.i | 0;
      if (i === p || !s.h[i] || s.h[i].length !== 1 || s.uno[i]) throw E('Trop tard !');
      give(s, i, 2); log(s, `Contre-UNO ! @${i} a oublié de crier et pioche 2 cartes.`);
      return s;
    }
    if (p !== s.turn) throw E('Ce n’est pas ton tour.');
    if (a.t === 'play') {
      const c = a.c | 0;
      if (!s.h[p].includes(c)) throw E('Carte invalide.');
      if (!playable(s, c)) throw E(`Il faut du ${COL[s.su]} ou le même symbole.`);
      if (c >= 100 && !(a.su >= 0 && a.su <= 3)) throw E('Choisis une couleur.');
      s.h[p] = s.h[p].filter(x => x !== c); s.ds.push(c);
      s.su = c >= 100 ? (a.su | 0) : col(c); s.dr = 0;
      if (s.h[p].length > 1) s.uno[p] = 0;
      if (!s.h[p].length) {
        s.rp = s.h.map(h => h.reduce((t, x) => t + pts(x), 0));
        const gain = s.rp.reduce((a2, b) => a2 + b, 0);
        s.sc[p] += gain; s.win = p;
        s.ph = s.sc[p] >= 500 ? 'over' : 'end';
        log(s, `@${p} pose sa dernière carte et marque ${gain} points !`);
        return s;
      }
      const y = sym(c); let nx = step(s, p);
      if (y === 'd2') { give(s, nx, 2); log(s, `@${nx} pioche 2 cartes et passe son tour.`); nx = step(s, nx); }
      else if (y === 'w4') { give(s, nx, 4); log(s, `@${nx} pioche 4 cartes et passe son tour. Couleur : ${COL[s.su]}.`); nx = step(s, nx); }
      else if (y === 'sk') { log(s, `@${nx} passe son tour.`); nx = step(s, nx); }
      else if (y === 'rv') { if (s.n === 2) { nx = p; log(s, `@${p} rejoue.`); } else { s.dir *= -1; nx = step(s, p); log(s, 'Changement de sens !'); } }
      else if (y === 'w') log(s, `@${p} choisit le ${COL[s.su]}.`);
      s.turn = nx; return s;
    }
    if (a.t === 'draw') {
      if (s.dr) throw E('Tu as déjà pioché.');
      const c = drawOne(s); s.dr = 1; s.uno[p] = 0;
      if (c >= 0) s.h[p].push(c);
      return s;
    }
    if (a.t === 'pass') {
      if (!s.dr) throw E('Pioche d’abord une carte.');
      s.dr = 0; s.turn = step(s, p); return s;
    }
    throw E('Action inconnue.');
  }
  function bot(s, i){
    if (s.ph !== 'play' || s.turn !== i) return null;
    const victim = range(s.n).find(j => j !== i && s.h[j].length === 1 && !s.uno[j]);
    if (victim != null && Math.random() < .7) return { t: 'catch', i: victim };
    const h = s.h[i], ok = h.filter(c => playable(s, c));
    if (h.length === 2 && !s.uno[i] && ok.length && Math.random() < .85) return { t: 'uno' };
    const plain = ok.filter(c => c < 100);
    const nx = step(s, i);
    if (plain.length) {
      const attack = s.h[nx].length <= 2 ? plain.filter(c => ['d2', 'sk', 'rv'].includes(sym(c))) : [];
      if (attack.length) return { t: 'play', c: attack[0] };
      plain.sort((a, b) => pts(b) - pts(a)); return { t: 'play', c: plain[0] };
    }
    if (ok.length) {
      const cnt = [0, 0, 0, 0]; h.forEach(c => { if (c < 100) cnt[col(c)]++; });
      const pick = ok.find(c => sym(c) === 'w') ?? ok[0];
      return { t: 'play', c: pick, su: cnt.indexOf(Math.max(...cnt)) };
    }
    if (!s.dr) return { t: 'draw' };
    return { t: 'pass' };
  }
  const turns = s => s.ph === 'play' ? [s.turn] : [];
  return { id: 'uno', name: 'Uno', min: 2, max: 10, setup, next, act, bot, turns, playable, pts, col, sym, COL, NAME };
})();

const LOGIC = { skyjo: SKYJO, president: PRES, mistigri: MIST, uno: UNO };
for (const g of Object.values(LOGIC)) { const f = g.act; g.act = (s, p, a) => { const r = f(s, p, a); delete r._new; return r; }; for (const k of ['setup','next']) { const h = g[k]; g[k] = (...x) => { const r = h(...x); delete r._new; return r; }; } }
</script>

<script>

  if (RM.matches || !prev.size) return 0;
  let moved = 0;
  root.querySelectorAll('[data-k]').forEach(el => {
    const p = prev.get(el.dataset.k), r = el.getBoundingClientRect();
    if (!p) { el.animate([{ opacity: 0, scale: '.85' }, { opacity: 1, scale: '1' }], { duration: 240, easing: 'ease-out' }); return; }
    const dx = (p.r.left + p.r.width / 2) - (r.left + r.width / 2), dy = (p.r.top + p.r.height / 2) - (r.top + r.height / 2);
    const sc = r.width ? p.r.width / r.width : 1;
    if (Math.abs(dx) > 1 || Math.abs(dy) > 1 || Math.abs(sc - 1) > .03) {
      moved++;
      el.animate([{ translate: `${dx}px ${dy}px`, scale: `${sc}`, zIndex: 40 }, { translate: '0px 0px', scale: '1', zIndex: 40 }], { duration: 400, easing: 'cubic-bezier(.2,.75,.25,1)' });
    }
    if (p.b && el.dataset.b !== '1' && el.firstElementChild) el.firstElementChild.animate([{ transform: 'rotateY(90deg)' }, { transform: 'rotateY(0deg)' }], { duration: 260, delay: 140, easing: 'ease-out', fill: 'backwards' });
  });
  return moved;
}

/* =================== network (room presence) =================== */
const Net = {
  room: null, peers: [], pres: {}, state: 'connecting',
  async init(){
    let room = null;
    try { if (window.claude && typeof window.claude.use === 'function') room = await window.claude.use('room'); } catch {}
    if (!room) { this.state = 'offline'; onNet(); return; }
    this.room = room;
    room.onConnection(c => { if (!this.room) return; this.state = c ? 'online' : 'connecting'; onNet(); }, () => this.dead());
    room.onPeers(ch => { if (!this.room) return; this.peers = ch.peers; onNet(); }, () => this.dead());
    room.presence({ ...this.pres }).catch(() => {});
  },
  dead(){ this.room = null; this.state = 'offline'; this.peers = []; onNet(); },
  set(patch){
    const out = {};
    for (const k in patch) { const v = patch[k]; if (v == null) { delete this.pres[k]; out[k] = null; } else { this.pres[k] = v; out[k] = v; } }
    if (this.room) this.room.presence(out).catch(e => console.warn('presence', e && e.code, e && e.message));
  }
};
Net.set({ id: Me.id, n: Me.name, av: Me.av });

/* =================== app state =================== */
const App = { view: 'home', code: null, T: null, pending: [], seq: Date.now(), hostId: null, ui: {}, logSeen: null, enterAt: 0, sitTried: 0, sig: '', botT: null, lastTurnSig: '' };

function tablePeers(){
  return Net.peers.filter(p => !p.sameTab && p.presence && p.presence.t === App.code && typeof p.presence.id === 'string' && p.presence.id !== Me.id);
}
function computeHost(){
  const T = App.T;
  const sIdx = id => { if (!T) return 99; const i = T.seats.findIndex(x => x.id === id); return i < 0 ? 99 : i; };
  const c = tablePeers().map(p => ({ id: p.presence.id, hv: +p.presence.hv || 0, p }));
  c.push({ id: Me.id, hv: T ? T.v : 0, p: null });
  c.sort((a, b) => b.hv - a.hv || sIdx(a.id) - sIdx(b.id) || (a.id < b.id ? -1 : 1));
  return c[0];
}
const amHost = () => App.hostId === Me.id;
function presentIds(){ const s = new Set(tablePeers().map(p => p.presence.id)); s.add(Me.id); return s; }

function onNet(){
  renderStatus();
  if (App.view === 'home') renderTables();
  else if (App.view === 'table') sync();
}

function sync(){
  if (App.view !== 'table') return;
  const h = computeHost();
  App.hostId = h.id;
  if (h.id !== Me.id) {
    const g = h.p && h.p.presence && h.p.presence.g;
    if (g && g.code === App.code && LOGIC[g.gm] && (!App.T || g.v !== App.T.v)) { App.T = clone(g); onState(); }
    if (Net.pres.g) Net.set({ g: null });
    if (App.T && Net.pres.hv !== App.T.v) Net.set({ hv: App.T.v });
  } else if (App.T) {
    hostProcess();
    if (!Net.pres.g || Net.pres.g.v !== App.T.v) publish();
    scheduleBots();
  }
  renderTable();
}

function publish(){
  const g = clone(App.T);
  const size = JSON.stringify(g).length;
  if (size > 3900) console.warn('state size', size);
  Net.set({ g, hv: App.T.v });
}
function commit(){ App.T.v++; publish(); onState(); scheduleBots(); }

function hostProcess(){
  const T = App.T; let changed = false;
  for (const p of tablePeers()) {
    const id = p.presence.id, q = p.presence.q;
    if (!Array.isArray(q)) continue;
    const items = q.filter(x => x && typeof x.s === 'number').slice().sort((a, b) => a.s - b.s);
    for (const it of items) {
      if (it.s <= (T.ack[id] || 0)) continue;
      try { applyAction(T, id, it.a || {}); } catch (e) { if (!e.user) console.warn(e); }
      T.ack[id] = it.s; changed = true;
    }
  }
  if (changed) {
    const keep = new Set(T.seats.map(s => s.id)); for (const p of tablePeers()) keep.add(p.presence.id);
    for (const k of Object.keys(T.ack)) if (!keep.has(k)) delete T.ack[k];
    T.v++; publish(); onState();
  }
}

function applyAction(T, pid, a){
  const g = LOGIC[T.gm];
  const si = T.seats.findIndex(x => x.id === pid);
  const isH = pid === Me.id && amHost();
  switch (a.t) {
    case 'sit': {
      const n = cleanName(a.n), av = (a.av | 0) % 8;
      if (si >= 0) { const st = T.seats[si]; st.n = n; st.av = av; if (st.bot) { delete st.bot; delete st.rb; } return; }
      if (T.ph !== 'lobby') throw E('La partie a déjà commencé.');
      if (T.seats.length >= g.max) throw E('La table est complète.');
      T.seats.push({ id: pid, n, av }); return;
    }
    case 'stand': if (T.ph === 'lobby' && si >= 0) T.seats.splice(si, 1); return;
    case 'bot+': {
      if (!isH || T.ph !== 'lobby') throw E('Seul l’hôte peut ajouter des bots.');
      if (T.seats.length >= g.max) throw E('La table est complète.');
      const used = new Set(T.seats.map(s => s.n)); const n = BOTS.find(b => !used.has(b)) || 'Bot';
      T.seats.push({ id: 'b' + Math.random().toString(36).slice(2, 8), n, av: Math.floor(Math.random() * 8), bot: 1 }); return;
    }
    case 'kick': if (!isH || T.ph !== 'lobby') return; if (T.seats[a.i] && T.seats[a.i].id !== Me.id) T.seats.splice(a.i, 1); return;
    case 'takeover': if (!isH || T.ph !== 'play') return; if (T.seats[a.i] && !T.seats[a.i].bot) { T.seats[a.i].bot = 1; T.seats[a.i].rb = 1; } return;
    case 'start':
      if (!isH || T.ph !== 'lobby') return;
      if (T.seats.length < g.min) throw E(`Il faut au moins ${g.min} joueurs.`);
      T.s = g.setup(T.seats.length, seed()); T.ph = 'play'; return;
    case 'next': if (!isH || T.ph !== 'play') return; T.s = g.next(T.s, seed()); return;
    case 'lobby': if (!isH) return; T.ph = 'lobby'; T.s = {}; T.seats = T.seats.filter(s => !s.rb); return;
    case 'g':
      if (T.ph !== 'play') throw E('La partie n’a pas commencé.');
      if (si < 0) throw E('Tu regardes cette partie.');
      T.s = g.act(T.s, si, a.a || {}); return;
  }
  throw E('Action inconnue.');
}

function send(a){
  if (!App.T) return;
  if (amHost()) {
    try { applyAction(App.T, Me.id, a); commit(); } catch (e) { if (e.user) toast(e.message); else console.error(e); }
    return;
  }
  if (a.t === 'g') { try { applyAction(clone(viewT()), Me.id, a); } catch (e) { if (e.user) toast(e.message); return; } }
  const s = ++App.seq;
  App.pending.push({ s, a });
  App.pending = App.pending.slice(-8);
  Net.set({ q: App.pending.map(p => ({ s: p.s, a: p.a })) });
  renderTable();
}

function viewT(){
  const T = App.T; if (!T) return null;
  const ack = T.ack[Me.id] || 0;
  const before = App.pending.length;
  App.pending = App.pending.filter(p => p.s > ack);
  if (before && !App.pending.length) Net.set({ q: null });
  const g = App.pending.filter(p => p.a.t === 'g');
  if (!g.length) return T;
  const t = clone(T);
  for (const p of g) { try { applyAction(t, Me.id, p.a); } catch {} }
  return t;
}

function scheduleBots(){
  if (App.botT || !amHost() || !App.T || App.T.ph !== 'play') return;
  const pick = () => { const T = App.T, g = LOGIC[T.gm]; for (let i = 0; i < T.seats.length; i++) { if (!T.seats[i].bot) continue; const a = g.bot(T.s, i); if (a) return { i, a }; } return null; };
  if (!pick()) return;
  App.botT = setTimeout(() => {
    App.botT = null;
    if (!amHost() || !App.T || App.T.ph !== 'play' || App.view !== 'table') return;
    const p = pick(); if (!p) return;
    try { App.T.s = LOGIC[App.T.gm].act(App.T.s, p.i, p.a); commit(); } catch (e) { console.warn('bot', e); }
  }, 600 + Math.random() * 650);
}

function onState(){
  const T = App.T; if (!T) return;
  const lg = T.ph === 'play' && T.s && T.s.lg;
  if (lg) {
    if (App.logSeen == null || App.logSeen > lg[0]) App.logSeen = lg[0];
    else if (lg[0] > App.logSeen) { App.logSeen = lg[0]; if (lg[1]) toast(fmt(T, lg[1])); }
  } else App.logSeen = 0;
  // personal notices
  const me = T.seats.findIndex(s => s.id === Me.id);
  if (T.gm === 'mistigri' && T.ph === 'play' && T.s.last && me >= 0) {
    const L = T.s.last;
    if (L.n && L.n !== App.ui.mLast) {
      if (App.ui.mLast != null) {
        if (L.to === me && !L.pr) toast(L.c === MIST.CAT ? 'Tu as pioché le Mistigri !' : `Tu as pioché : ${RK_NAME[R(L.c)]} de ${SUIT_NAME[S(L.c)]}`, L.c === MIST.CAT);
        if (L.f === me && !L.pr && L.c === MIST.CAT) toast('Ouf, le Mistigri est parti !', true);
      }
      App.ui.mLast = L.n;
    }
  }
  if (T.ph === 'play' && me >= 0) {
    const mine = LOGIC[T.gm].turns(T.s).includes(me);
    if (mine && !App.wasMine) Snd.play('turn');
    App.wasMine = mine;
  }
  // auto-sit / reclaim
  if (me < 0 && T.ph === 'lobby' && T.seats.length < LOGIC[T.gm].max && Date.now() - App.sitTried > 3000) { App.sitTried = Date.now(); send({ t: 'sit', n: Me.name, av: Me.av }); }
  if (me >= 0) {
    const st = T.seats[me];
    if ((st.bot || st.n !== Me.name || st.av !== Me.av) && Date.now() - App.sitTried > 3000) { App.sitTried = Date.now(); send({ t: 'sit', n: Me.name, av: Me.av }); }
  }
}
function fmt(T, m){ return m.replace(/@(-?\d+)/g, (_, i) => { const s = T.seats[+i]; return s ? (s.id === Me.id ? Me.name : s.n) : '?'; }); }

/* =================== table lifecycle =================== */
function createTable(gm){
  const code = randCode();
  const T = { v: 1, code, gm, ph: 'lobby', seats: [{ id: Me.id, n: Me.name, av: Me.av }], ack: {}, s: {} };
  enterTable(code, T);
}
function enterTable(code, T){
  App.view = 'table'; App.code = code; App.T = T || null; App.pending = []; App.ui = {}; App.logSeen = null; App.enterAt = Date.now(); App.sitTried = 0; App.sig = ''; App.lastTurnSig = '';
  App.hostId = T ? Me.id : null;
  Net.set({ t: code, q: null, g: T ? clone(T) : null, hv: T ? T.v : 0 });

function leaveTable(){

  if (App.T && App.T.ph === 'lobby' && App.T.seats.some(s => s.id === Me.id) && !amHost()) send({ t: 'stand' });
  App.view = 'home'; App.code = null; App.T = null; App.pending = [];
  setTimeout(() => Net.set({ t: null, g: null, hv: null, q: null }), 250);
  render();
}
