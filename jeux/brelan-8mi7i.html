  const freeRows = range(Math.min(free, seats.length % 2 ? 1 : 2)).map(() => `<div class="seat free">Place libre</div>`).join('');
  const can = seats.length >= g.min;
  const acts = ctx.host
    ? `<div class="btns" style="justify-content:flex-start"><button class="btn" data-a="bot+" ${free ? '' : 'disabled'}>Ajouter un bot</button><button class="btn pri" data-a="start" ${can ? '' : 'disabled'}>Lancer la partie</button></div>
       ${can ? '' : `<p class="note">Il faut au moins ${g.min} joueurs. Ajoute des bots ou attends tes amis.</p>`}`
    : ctx.me >= 0 ? `<p class="prompt">${hostSeat ? esc(hostSeat.n) : 'L’hôte'} lancera la partie quand tout le monde sera là.</p>`
    : `<p class="prompt">${free ? 'Installation…' : 'La table est complète, tu regardes.'}</p>`;
  return `<div class="lobby"><div class="lobby-in">
    <div><p class="gtitle">${g.name}</p><p class="note">${GAMES_UI[g.id].blurb}</p></div>
    <div class="panel"><h3>Joueurs · ${seats.length}/${g.max}</h3><div class="seats">${rows}${freeRows}</div></div>
    <div class="panel"><h3>Lancer</h3>${acts}</div>
    <div class="panel"><h3>Inviter</h3>
      <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap"><span class="codebig">${esc(T.code)}</span><button class="btn sm" data-a="copycode">Copier le code</button></div>
      <p class="note">Tes amis ouvrent ce même lien Brelan : la table apparaît dans leur salon, ou ils tapent ce code.</p></div>
  </div></div>`;
}

function renderTable(force){
  if (App.view !== 'table') return;
  const T = viewT();
  const sigParts = [T ? T.v : 'x', App.pending.length, JSON.stringify(App.ui), [...presentIds()].sort().join(), App.hostId, Net.state];
  const sig = sigParts.join('|');
  if (!force && sig === App.sig && $('.tv')) return;
  App.sig = sig;
  const root = $('#app');
  let body;
  if (!T) {
    const late = Date.now() - App.enterAt > 4500;
    body = `<div class="waiting"><div><h2>${late ? 'Table introuvable' : 'Recherche de la table…'}</h2><p>${late ? `Personne n’héberge la table ${esc(App.code)} en ce moment.` : 'Connexion à l’hôte.'}</p>${late ? '<button class="btn" data-a="leave">Retour au salon</button>' : ''}</div></div>`;
  } else {
    const ctx = mkCtx(T);
    if (T.ph === 'lobby') body = lobbyHTML(ctx);
    else {
      const v = VIEWS[T.gm](ctx);
      body = `<div class="stage">
        <div class="opps">${v.opps}</div>
        <div class="center">${v.center}</div>
        ${v.mine ? `<div class="mine ${v.mineCls || ''}">${v.mine}</div>` : ''}
        <div class="bar">${v.bar}</div>
      </div>`;
      const end = T.s.ph === 'end' || T.s.ph === 'over';
      if (end && !App.ui.hideOver) modal(overSheet(ctx, v.over));
      else if (!end && $('#modal [data-over]')) modal('');
      if (end && App.ui.hideOver) body = body.replace('<div class="bar">', `<div class="bar"><button class="btn pri" data-a="showover">Voir les scores</button>`);
    }
    if (T.ph === 'lobby' && $('#modal [data-over]')) modal('');
  }
  const opps = $('.opps'), sl = opps ? opps.scrollLeft : 0;
  const prev = snap(root);
  root.innerHTML = `<div class="tv">${topBar(T)}${body}</div>`;
  const o2 = $('.opps'); if (o2) o2.scrollLeft = sl;
  if (flip(root, prev)) Snd.play('card');
}
function overSheet(ctx, inner){
  const T = ctx.T, s = T.s;
  const btn = ctx.host
    ? `<button class="btn ghost" data-a="lobbyback">Changer de joueurs</button><button class="btn pri" data-a="next">${s.ph === 'over' ? 'Nouvelle partie' : 'Manche suivante'}</button>`
    : `<span class="note">L’hôte lance la suite.</span>`;
  return `<div data-over>${inner}<div class="btns"><button class="btn ghost" data-a="hideover">Voir la table</button>${btn}</div></div>`;
}

/* ---------- game views ---------- */
const VIEWS = {};

VIEWS.skyjo = ctx => {
  const s = ctx.s, me = ctx.me, val = SKYJO.val;
  const playing = s.ph === 'play' || s.ph === 'last';
  const myTurn = me >= 0 && playing && s.turn === me;
  const holding = myTurn && s.hv >= 0;
  const drop = holding && s.hf === 'd' && App.ui.drop;
  const cell = (p, k, cls) => {
    const id = s.g[p][k];
    if (id < 0) return `<div class="card hole ${cls}"></div>`;
    return s.u[p][k] ? sky(id, { cls }) : back('k' + id, { cls });
  };
  const opps = ctx.others.map(i => pod(ctx, i, `<div class="mg">${range(12).map(k => cell(i, k, 'xs')).join('')}</div>`,
    `${SKYJO.visible(s, i)} visibles · total ${s.tot[i]}`, s.fin === i ? '<span class="tag gold">a fini</span>' : '')).join('');
  const top = s.ds[s.ds.length - 1], under = s.ds[s.ds.length - 2];
  const canDraw = myTurn && s.hv < 0, canTake = myTurn && s.hv < 0 && s.ds.length, canDropZone = holding && s.hf === 'd';
  const deckTop = s.dk.length ? back('k' + s.dk[s.dk.length - 1], { cls: canDraw ? 'can' : '', attr: canDraw ? 'data-a="sky-draw" role="button" tabindex="0" aria-label="Piocher"' : '' }) : '<div class="card slotph"></div>';
  const disc = (under != null ? sky(under) : '') + (top != null ? sky(top, { cls: canTake || canDropZone ? 'can' + (drop ? ' glow' : '') : '', attr: canTake ? 'data-a="sky-take" role="button" tabindex="0" aria-label="Prendre la défausse"' : canDropZone ? 'data-a="sky-dropmode" role="button" tabindex="0" aria-label="Défausser"' : '' }) : '<div class="card slotph"></div>');
  const heldBy = playing && s.hv >= 0 ? s.turn : -1;
  const center = `
    <div class="pilebox"><span class="lbl">Pioche · ${s.dk.length}</span><div class="stack">${s.dk.length > 1 ? back('', {}) : ''}${deckTop}</div></div>
    <div class="pilebox"><span class="lbl">${heldBy >= 0 ? `En main · <b>${ctx.name(heldBy)}</b>` : playing ? `Au tour de <b>${ctx.name(s.turn)}</b>` : 'Manche ' + s.rnd}</span>${heldBy >= 0 ? sky(s.hv, { cls: 'glow' }) : '<div class="card slotph"></div>'}</div>
    <div class="pilebox"><span class="lbl">Défausse</span><div class="stack">${disc}</div></div>`;
  let mine = '', bar = '';
  if (me >= 0) {
    const cells = range(12).map(k => {
      const id = s.g[me][k];
      if (id < 0) return `<div class="card hole"></div>`;
      const up = s.u[me][k];
      let can = false, act = '';
      if (s.ph === 'reveal' && !up && SKYJO.nUp(s, me) < 2) { can = true; act = 'sky-cell'; }
      else if (holding && (!drop || !up)) { can = true; act = 'sky-cell'; }
      const attr = can ? `data-a="${act}" data-i="${k}" role="button" tabindex="0"` : '';
      return up ? sky(id, { cls: can ? 'can' : '', attr }) : back('k' + id, { cls: can ? 'can' : '', attr });
    }).join('');
    mine = `<div class="grid12">${cells}</div><div class="who" style="max-width:none">${avatar(ctx.T.seats[me])}<div class="nm"><span>Toi · ${SKYJO.visible(s, me)} visibles</span><small>Total ${s.tot[me]}${s.fin === me ? ' · tu as fini' : ''}</small></div></div>`;
    let p;
    if (s.ph === 'reveal') p = SKYJO.nUp(s, me) < 2 ? `<p class="prompt me">Retourne ${2 - SKYJO.nUp(s, me)} carte${SKYJO.nUp(s, me) ? '' : 's'} de ta grille</p>` : `<p class="prompt">Les autres retournent leurs cartes…</p>`;
    else if (!playing) p = `<p class="prompt">Manche terminée</p>`;
    else if (!myTurn) p = `<p class="prompt">${ctx.name(s.turn)} joue${s.ph === 'last' ? ' · dernier tour' : ''}…</p>`;
    else if (s.hv < 0) p = `<p class="prompt me">À toi : pioche, ou prends la défausse${s.ph === 'last' ? ' (dernier tour)' : ''}</p>`;
    else if (drop) p = `<p class="prompt me">Choisis une carte cachée à retourner</p>`;
    else if (s.hf === 'd') p = `<p class="prompt me">Échange-la avec une de tes cartes, ou touche la défausse pour la jeter</p>`;
    else p = `<p class="prompt me">Échange-la avec une de tes cartes</p>`;
    bar = p + (drop ? `<div class="btns"><button class="btn" data-a="sky-cancel">Annuler</button></div>` : '');
  } else bar = `<p class="prompt">Tu regardes la partie · au tour de ${ctx.name(s.turn)}</p>`;
  const order = range(ctx.n).sort((a, b) => s.tot[a] - s.tot[b]);
  const over = `<h2>${s.ph === 'over' ? `${ctx.subj(order[0])} ${order[0] === me ? 'gagnes' : 'gagne'} la partie !` : `Fin de la manche ${s.rnd}`}</h2>
    <p>${s.fin >= 0 ? `${s.fin === me ? 'Tu as' : ctx.name(s.fin) + ' a'} fini en premier${s.dbl ? ' mais n’avait pas le plus petit score : points doublés.' : '.'}` : ''} La partie s’arrête quand quelqu’un atteint 100 points.</p>
    <table class="score"><thead><tr><th>Joueur</th><th class="n">Manche</th><th class="n">Total</th></tr></thead><tbody>
    ${order.map((i, k) => `<tr class="${k === 0 ? 'lead' : ''}"><td><span class="pn">${avatar(ctx.T.seats[i])}${ctx.name(i)}</span></td><td class="n">${s.rs[i] != null ? (s.rs[i] > 0 ? '+' : '') + s.rs[i] : ''}${s.dbl && i === s.fin ? ' ×2' : ''}</td><td class="n">${s.tot[i]}</td></tr>`).join('')}
    </tbody></table>`;
  return { opps, center, mine, mineCls: 'sky', bar, over };
};

VIEWS.president = ctx => {
  const s = ctx.s, me = ctx.me, pv = PRES.pv;
  const roleTag = i => { const r = s.roles && s.roles.length === ctx.n ? s.roles[i] : null; return r ? `<span class="tag ${r > 0 ? 'gold' : 'red'}">${PRES.ROLE[r]}</span>` : ''; };
  const outRank = i => { const k = s.out.indexOf(i); return k >= 0 ? `<span class="tag green">sorti ${k + 1}${k ? 'e' : 'er'}</span>` : ''; };
  const opps = ctx.others.map(i => pod(ctx, i, miniBacks(s.h[i], 9), `${s.h[i].length} carte${s.h[i].length > 1 ? 's' : ''} · ${s.pts[i] > 0 ? '+' : ''}${s.pts[i]} pts`,
    (s.ph === 'play' ? roleTag(i) : '') + outRank(i) + (s.passed[i] ? '<span class="tag">passe</span>' : ''))).join('');
  const pileHTML = s.pile.length ? `<div class="fanpile" style="display:flex">${s.pile.map((c, k) => `<div style="margin-left:${k ? 'calc(var(--cw)*-.55)' : 0};rotate:${(k - (s.pile.length - 1) / 2) * 6}deg">${face(c)}</div>`).join('')}</div>` : '<div class="card slotph"></div>';
  const underHTML = s.un && s.un.length ? `<div style="display:flex;opacity:.45">${s.un.map((c, k) => `<div style="margin-left:${k ? 'calc(var(--cw)*-.7)' : 0}">${face(c, { cls: 'sm' })}</div>`).join('')}</div>` : '';
  const need = s.pile.length ? `${s.pile.length} × plus fort que ${RK[R(s.pile[0])]}` : 'Pli libre';
  const center = `${underHTML ? `<div class="pilebox under"><span class="lbl">Avant</span>${underHTML}</div>` : ''}
    <div class="pilebox"><span class="lbl">${s.pb >= 0 ? `Posé par <b>${ctx.name(s.pb)}</b>` : s.ph === 'play' ? `<b>${ctx.name(s.turn)}</b> ouvre` : 'Fin de manche'}</span>${pileHTML}<span class="lbl">${s.ph === 'play' ? need : ''}</span></div>`;
  let mine = '', bar = '';
  if (me >= 0) {
    const myTurn = s.ph === 'play' && s.turn === me;
    let sel = (App.ui.sel || []).filter(c => s.h[me].includes(c));
    const okSel = sel.length && (!s.pile.length ? sel.length <= 4 : sel.length === s.pile.length && pv(sel[0]) > pv(s.pile[0]));
    const playableRank = c => !s.pile.length || (pv(c) > pv(s.pile[0]) && s.h[me].filter(x => R(x) === R(c)).length >= s.pile.length);
    mine = handHTML(s.h[me], { card: c => face(c, { cls: `can ${sel.includes(c) ? 'sel' : ''} ${myTurn && !playableRank(c) ? 'no' : ''}`, attr: `data-a="pr-sel" data-c="${c}" role="button" tabindex="0"` }) });
    let p;
    if (s.ph !== 'play') p = `<p class="prompt">Manche terminée</p>`;
    else if (s.out.includes(me)) p = `<p class="prompt">Tu es sorti${s.out.indexOf(me) === 0 ? ' en premier !' : '.'} Les autres continuent.</p>`;
    else if (!myTurn) p = `<p class="prompt">${ctx.name(s.turn)} réfléchit…${s.passed[me] ? ' (tu as passé)' : ''}</p>`;
    else p = `<p class="prompt me">${s.pile.length ? `À toi : ${s.pile.length} carte${s.pile.length > 1 ? 's' : ''} plus forte${s.pile.length > 1 ? 's' : ''} que ${RK[R(s.pile[0])]}, ou passe` : 'À toi d’ouvrir : pose 1 à 4 cartes identiques'}</p>`;
    bar = p + (myTurn ? `<div class="btns">${s.pile.length ? '<button class="btn" data-a="pr-pass">Passer</button>' : ''}<button class="btn pri" data-a="pr-play" ${okSel ? '' : 'disabled'}>Jouer${sel.length ? ' ' + sel.length : ''}</button></div>` : '');
  } else bar = `<p class="prompt">Tu regardes la partie</p>`;
  const order = s.out.length ? s.out : range(ctx.n);
  const over = `<h2>${ctx.subj(s.out[0])} ${s.out[0] === me ? 'deviens' : 'devient'} Président</h2><p>Manche ${s.rnd}. Le Trouduc donnera ses 2 meilleures cartes au Président à la prochaine donne.</p>
    <table class="score"><thead><tr><th>Ordre</th><th>Rôle</th><th class="n">Points</th></tr></thead><tbody>
    ${order.map((i, k) => `<tr class="${k === 0 ? 'lead' : ''}"><td><span class="pn">${avatar(ctx.T.seats[i])}${ctx.name(i)}</span></td><td>${PRES.ROLE[s.roles[i] || 0]}</td><td class="n">${s.pts[i] > 0 ? '+' : ''}${s.pts[i]}</td></tr>`).join('')}
    </tbody></table>`;
  return { opps, center, mine, bar, over };
};

VIEWS.mistigri = ctx => {
  const s = ctx.s, me = ctx.me;
  const fanOf = s.ph === 'play' ? MIST.target(s, s.turn) : -1;
  const opps = ctx.others.map(i => pod(ctx, i, s.out[i] ? '' : miniBacks(s.h[i], 9, i !== fanOf || fanOf === me), `${s.h[i].length} carte${s.h[i].length > 1 ? 's' : ''} · ${s.pr[i]} paire${s.pr[i] > 1 ? 's' : ''}`,
    (s.out[i] && s.ph === 'play' ? '<span class="tag green">sorti</span>' : '') + (s.ls[i] ? `<span class="tag red">${s.ls[i]} défaite${s.ls[i] > 1 ? 's' : ''}</span>` : ''))).join('');
  let center = '', tgt = -1;
  if (s.ph === 'play') {
    tgt = MIST.target(s, s.turn);
    const mine = s.turn === me;
    const cards = s.h[tgt] || [];
    center = `<div class="pilebox" style="max-width:100%"><span class="lbl">${mine ? `Tire une carte chez <b>${ctx.name(tgt)}</b>` : `<b>${ctx.name(s.turn)}</b> tire chez <b>${ctx.name(tgt)}</b>`}</span>
      ${tgt === me ? `<p class="note" style="margin:0">Il pioche dans ta main, en bas.</p>`
        : `<div class="hand" style="--n:${cards.length}">${cards.map((c, k) => `<div class="slot" style="--d:${(k - (cards.length - 1) / 2).toFixed(2)}">${back('c' + c, { cls: mine ? 'can' : '', attr: mine ? `data-a="mi-draw" data-ix="${k}" role="button" tabindex="0" aria-label="Carte ${k + 1}"` : '' })}</div>`).join('')}</div>`}</div>`;
    center += `<div class="pilebox"><span class="lbl">Dernière paire</span>${s.lp.length ? `<div style="display:flex">${s.lp.map((c, k) => `<div style="margin-left:${k ? 'calc(var(--cw)*-.5)' : 0}">${face(c, { cat: 1, cls: 'sm' })}</div>`).join('')}</div>` : '<div class="card slotph"></div>'}</div>`;
  } else center = `<div class="pilebox"><span class="lbl">Le Mistigri</span>${face(MIST.CAT, { cat: 1, k: 'catx' })}</div>`;
  let mine = '', bar = '';
  if (me >= 0) {
    const myCards = s.h[me];
    mine = myCards.length ? handHTML(myCards, { card: c => face(c, { cat: 1 }) }) : '';
    let p;
    if (s.ph !== 'play') p = `<p class="prompt">Manche terminée</p>`;
    else if (s.out[me]) p = `<p class="prompt">Tu n’as plus de cartes, tu es tranquille.</p>`;
    else if (s.turn === me) p = `<p class="prompt me">À toi : touche une carte de ${ctx.name(tgt)}</p>`;
    else if (tgt === me) p = `<p class="prompt">${ctx.name(s.turn)} pioche dans ta main…</p>`;
    else p = `<p class="prompt">${ctx.name(s.turn)} pioche chez ${ctx.name(tgt)}</p>`;
    bar = p + (s.ph === 'play' && !s.out[me] && myCards.length > 1 ? `<div class="btns"><button class="btn sm" data-a="mi-shuf">Mélanger ma main</button></div>` : '');
  } else bar = `<p class="prompt">Tu regardes la partie</p>`;
  const order = range(ctx.n).sort((a, b) => s.ls[a] - s.ls[b]);
  const over = `<h2>${s.loser >= 0 ? `${ctx.subj(s.loser)} ${s.loser === me ? 'gardes' : 'garde'} le Mistigri !` : 'Manche terminée'}</h2><p>Manche ${s.rnd}. Le perdant commence la manche suivante.</p>
    <table class="score"><thead><tr><th>Joueur</th><th class="n">Paires</th><th class="n">Défaites</th></tr></thead><tbody>
    ${order.map((i, k) => `<tr class="${k === 0 ? 'lead' : ''}"><td><span class="pn">${avatar(ctx.T.seats[i])}${ctx.name(i)}</span></td><td class="n">${s.pr[i]}</td><td class="n">${s.ls[i]}</td></tr>`).join('')}
    </tbody></table>`;
  return { opps, center, mine, bar, over };
};

VIEWS.uno = ctx => {
  const s = ctx.s, me = ctx.me;
  const opps = ctx.others.map(i => {
    const one = s.h[i].length === 1 && s.ph === 'play';
    const b = (s.uno[i] && s.h[i].length <= 2 && s.ph === 'play' ? '<span class="tag gold">UNO</span>' : '')
      + (one && !s.uno[i] && me >= 0 ? `<button class="btn sm pri" data-a="un-catch" data-i="${i}">Contre-UNO</button>` : '');
    return pod(ctx, i, miniBacks(s.h[i], 9), `${s.h[i].length} carte${s.h[i].length > 1 ? 's' : ''} · ${s.sc[i]} pts`, b);
  }).join('');
  const myTurn = me >= 0 && s.ph === 'play' && s.turn === me;
  const top = s.ds[s.ds.length - 1], under = s.ds[s.ds.length - 2];
  const canDraw = myTurn && !s.dr;
  const center = `
    <div class="pilebox"><span class="lbl">Pioche · ${s.dk.length}</span><div class="stack">${s.dk.length > 1 ? back('') : ''}${s.dk.length ? back('u' + s.dk[s.dk.length - 1], { cls: canDraw ? 'can' : '', attr: canDraw ? 'data-a="un-draw" role="button" tabindex="0" aria-label="Piocher"' : '' }) : '<div class="card slotph"></div>'}</div></div>
    <div class="pilebox"><span class="lbl"><span class="udot u${s.su}"></span> ${UNO.COL[s.su]} · sens ${s.dir > 0 ? '↻' : '↺'}</span><div class="stack">${under != null ? uno(under) : ''}${uno(top, { cls: 'ring u' + s.su })}</div></div>`;
  let mine = '', bar = '';
  if (me >= 0) {
    mine = handHTML(s.h[me], { card: c => { const ok = myTurn && UNO.playable(s, c); return uno(c, { cls: ok ? 'can' : myTurn ? 'no' : '', attr: ok ? `data-a="un-play" data-c="${c}" role="button" tabindex="0"` : '' }); } });
    let p;
    const t = UNO.sym(top);
    const what = /^\d$/.test(t) ? `un ${t}` : t === 'w' || t === 'w4' ? 'un joker' : `un ${UNO.NAME[t]}`;
    if (s.ph !== 'play') p = `<p class="prompt">Manche terminée</p>`;
    else if (!myTurn) p = `<p class="prompt">${ctx.name(s.turn)} joue…</p>`;
    else if (s.h[me].some(c => UNO.playable(s, c))) p = `<p class="prompt me">À toi : du ${UNO.COL[s.su]}, ${what} ou un joker${s.dr ? ', ou passe' : ''}</p>`;
    else p = s.dr ? `<p class="prompt me">Toujours rien à poser : passe</p>` : `<p class="prompt me">Rien à poser : pioche une carte</p>`;
    const unoBtn = s.ph === 'play' && s.h[me].length <= 2 && !s.uno[me] ? `<button class="btn pri" data-a="un-uno">UNO !</button>` : '';
    bar = p + `<div class="btns">${unoBtn}${myTurn ? (!s.dr ? `<button class="btn" data-a="un-draw">Piocher</button>` : `<button class="btn pri" data-a="un-pass">Passer</button>`) : ''}</div>`;
  } else bar = `<p class="prompt">Tu regardes la partie</p>`;
  if (App.ui.pickW != null && myTurn) {
    bar = `<p class="prompt me">Quelle couleur choisis-tu ?</p><div class="btns">${[0, 1, 2, 3].map(k => `<button class="btn" data-a="un-col" data-su="${k}" style="display:inline-flex;gap:8px;align-items:center"><span class="udot u${k}"></span>${UNO.COL[k]}</button>`).join('')}<button class="btn ghost" data-a="un-cancel">Annuler</button></div>`;
  }
  const order = range(ctx.n).sort((a, b) => s.sc[b] - s.sc[a]);
  const gain = (s.rp || []).reduce((a, b) => a + b, 0);
  const over = `<h2>${s.ph === 'over' ? `${ctx.subj(s.win)} ${s.win === me ? 'gagnes' : 'gagne'} la partie !` : `${ctx.subj(s.win)} ${s.win === me ? 'remportes' : 'remporte'} la manche`}</h2>
    <p>${s.win === me ? 'Tu marques' : ctx.name(s.win) + ' marque'} ${gain} points avec les cartes restées dans les mains : chiffres à leur valeur, +2, Inversion et Passe = 20, jokers = 50. Premier à 500.</p>
    <table class="score"><thead><tr><th>Joueur</th><th class="n">Cartes</th><th class="n">Total</th></tr></thead><tbody>
    ${order.map((i, k) => `<tr class="${k === 0 ? 'lead' : ''}"><td><span class="pn">${avatar(ctx.T.seats[i])}${ctx.name(i)}</span></td><td class="n">${s.h[i].length}</td><td class="n">${s.sc[i]}</td></tr>`).join('')}
    </tbody></table>`;
  return { opps, center, mine, bar, over };
};

/* =================== SOLITAIRE =================== */
const SOL = {
  st: null, hist: [], drag: null, tick: null, auto: null,
  sv: c => (R(c) + 1) % 13,
  newGame(){
    const d = shuffle(range(52), mulberry32(seed()));
    const t = []; for (let i = 0; i < 7; i++) t.push(d.splice(-(i + 1)).map((c, j) => ({ c, u: j === i ? 1 : 0 })));
    this.st = { stock: d, waste: [], f: [[], [], [], []], t, mv: 0, t0: Date.now(), el: 0, draw: LS.get('brelan.sol.draw', 1), won: 0 };
    this.hist = []; this.save();
  },
  load(){ const s = LS.get('brelan.sol', null); if (s && s.t && !s.won) { this.st = s; this.st.t0 = Date.now() - (s.el || 0); } else this.newGame(); },
  save(){ if (this.st) { this.st.el = Date.now() - this.st.t0; LS.set('brelan.sol', this.st); } },
  push(){ this.hist.push(JSON.stringify(this.st)); if (this.hist.length > 300) this.hist.shift(); },
  undo(){ const h = this.hist.pop(); if (!h) return; const t0 = this.st.t0; this.st = JSON.parse(h); this.st.t0 = t0; this.st.mv++; this.save(); renderSol(); },
  cards(src){ const s = this.st; if (src.z === 'w') return s.waste.length ? [s.waste[s.waste.length - 1]] : []; if (src.z === 'f') { const f = s.f[src.i]; return f.length ? [f[f.length - 1]] : []; } return s.t[src.i].slice(src.j).map(x => x.c); },
  canDrop(cards, dst){
    const s = this.st, c = cards[0];
    if (dst.z === 'f') { if (cards.length !== 1) return false; const f = s.f[dst.i]; if (!f.length) return this.sv(c) === 0; const tp = f[f.length - 1]; return S(tp) === S(c) && this.sv(c) === this.sv(tp) + 1; }
    const col = s.t[dst.i]; if (!col.length) return this.sv(c) === 12;
    const tp = col[col.length - 1]; return tp.u && red(tp.c) !== red(c) && this.sv(tp.c) === this.sv(c) + 1;
  },
  move(src, dst){
    const s = this.st, cards = this.cards(src);
    if (!cards.length || !this.canDrop(cards, dst)) return false;
    if (src.z === 't' && dst.z === 't' && src.i === dst.i) return false;
    this.push();
    if (src.z === 'w') s.waste.pop(); else if (src.z === 'f') s.f[src.i].pop();
    else { s.t[src.i].splice(src.j); const col = s.t[src.i]; if (col.length && !col[col.length - 1].u) col[col.length - 1].u = 1; }
    if (dst.z === 'f') s.f[dst.i].push(cards[0]); else s.t[dst.i].push(...cards.map(c => ({ c, u: 1 })));
    s.mv++;
    if (s.f.every(f => f.length === 13)) { s.won = 1; s.el = Date.now() - s.t0; }
    this.save(); return true;
  },
  drawStock(){
    const s = this.st; this.push();
    if (!s.stock.length) { if (!s.waste.length) { this.hist.pop(); return; } s.stock = s.waste.reverse(); s.waste = []; }
    else { for (let k = 0; k < s.draw && s.stock.length; k++) s.waste.push(s.stock.pop()); }
    s.mv++; this.save();
  },
  autoFor(src){
    const s = this.st, cards = this.cards(src); if (!cards.length) return null;
    if (cards.length === 1 && src.z !== 'f') for (let i = 0; i < 4; i++) if (this.canDrop(cards, { z: 'f', i })) return { z: 'f', i };
    const cols = range(7).filter(i => !(src.z === 't' && src.i === i));
    for (const i of cols) if (s.t[i].length && this.canDrop(cards, { z: 't', i })) return { z: 't', i };
    if (!(src.z === 't' && src.j === 0)) for (const i of cols) if (!s.t[i].length && this.canDrop(cards, { z: 't', i })) return { z: 't', i };
    return null;
  },
  canFinish(){ const s = this.st; return !s.won && !s.stock.length && !s.waste.length && s.t.every(c => c.every(x => x.u)); },
  finishStep(){
    const s = this.st;
    for (let i = 0; i < 7; i++) { const col = s.t[i]; if (!col.length) continue; for (let f = 0; f < 4; f++) if (this.move({ z: 't', i, j: col.length - 1 }, { z: 'f', i: f })) return true; }
    return false;
  }
};
function solHTML(){
  const s = SOL.st;
  const stockTop = s.stock.length ? back('c' + s.stock[s.stock.length - 1]) : '';
  const wShow = s.waste.slice(-(s.draw === 3 ? 3 : 2));
  const wHTML = wShow.map((c, k) => { const top = k === wShow.length - 1; const off = s.draw === 3 ? k : 0; return face(c, { attr: `style="left:calc(var(--cw)*${(off * .22).toFixed(2)})" ${top ? 'data-src="w"' : ''}` }); }).join('');
  const found = s.f.map((f, i) => `<div class="spot found" data-drop="f${i}">${f.length > 1 ? face(f[f.length - 2]) : ''}${f.length ? face(f[f.length - 1], { attr: `data-src="f${i}"` }) : `<svg viewBox="0 0 100 100"><use href="#su-${SUIT_ID[i]}"/></svg>`}</div>`).join('');
  const cols = s.t.map((col, i) => `<div class="col" data-drop="t${i}">${col.length ? '' : '<div class="spot"></div>'}${col.map((x, j) => x.u ? face(x.c, { attr: `data-src="t${i}:${j}"` }) : back('c' + x.c)).join('')}</div>`).join('');
  const el = s.won ? s.el : Date.now() - s.t0;
  return `<div class="sol">
    <div class="solbar">
      <button class="icon-btn" data-a="leave" aria-label="Retour au salon">${svgI.back}</button>
      <h1 style="font-family:var(--f-disp);font-weight:400;font-size:24px;margin:0;color:var(--brass2)">Solitaire</h1>
      <div class="seg hide-s" role="group" aria-label="Pioche"><button data-a="sol-draw" data-n="1" aria-pressed="${s.draw === 1}">1 carte</button><button data-a="sol-draw" data-n="3" aria-pressed="${s.draw === 3}">3 cartes</button></div>
      <div class="stats"><span>Coups <b>${s.mv}</b></span><span>Temps <b id="soltime">${fmtTime(el)}</b></span></div>
      <button class="icon-btn" data-a="sol-undo" aria-label="Annuler le dernier coup" ${SOL.hist.length ? '' : 'disabled'}>${svgI.undo}</button>
      <button class="btn sm" data-a="sol-new">Nouvelle</button>
    </div>
    <div class="sol-row">
      <div class="spot stock" data-a="sol-stock" role="button" tabindex="0" aria-label="Pioche">${stockTop || '<svg viewBox="0 0 24 24" style="fill:none;stroke:currentColor;stroke-width:2"><path d="M4 12a8 8 0 1 0 3-6.2M4 4v4h4"/></svg>'}</div>
      <div class="waste" style="grid-column:span 2">${wHTML}</div>
      ${found}
    </div>
    <div class="sol-tab"><div class="sol-row">${cols}</div></div>
    ${SOL.canFinish() ? '' : ''}
  </div>`;
}
const fmtTime = ms => { const t = Math.floor(ms / 1000); return `${Math.floor(t / 60)}:${String(t % 60).padStart(2, '0')}`; };
function layoutSol(){
  const tab = $('.sol-tab'); if (!tab) return;
  const H = tab.clientHeight - 8;
  tab.querySelectorAll('.col').forEach(col => {
    const cards = [...col.querySelectorAll(':scope > .card')]; if (!cards.length) return;
    const ch = cards[0].offsetHeight;
    let bd = ch * .12, bu = ch * .27;
    const nd = cards.filter(c => c.dataset.b === '1').length, nu = cards.length - nd;
    const need = nd * bd + Math.max(0, nu - 1) * bu + ch;
    if (need > H && cards.length > 1) { const k = Math.max(.25, (H - ch) / (nd * bd + Math.max(0, nu - 1) * bu)); bd *= k; bu *= k; }
    let y = 0; cards.forEach(c => { c.style.top = y + 'px'; y += c.dataset.b === '1' ? bd : bu; });
  });
}
function renderSol(){
  const root = $('#app'); const prev = snap(root);
  root.innerHTML = solHTML(); layoutSol();
  if (flip(root, prev)) Snd.play('card');
  if (SOL.st.won && !$('#modal .sheet')) {
    modal(`<h2>Gagné !</h2><p>${SOL.st.mv} coups en ${fmtTime(SOL.st.el)}.</p><div class="btns"><button class="btn ghost" data-a="leave">Retour au salon</button><button class="btn pri" data-a="sol-new">Nouvelle donne</button></div>`);
  }
  if (SOL.canFinish() && !SOL.auto) {
    SOL.auto = setInterval(() => { if (App.view !== 'sol' || !SOL.finishStep()) { clearInterval(SOL.auto); SOL.auto = null; } if (App.view === 'sol') renderSol(); }, 110);
  }
}
function parseSrc(v){ if (v === 'w') return { z: 'w' }; if (v[0] === 'f') return { z: 'f', i: +v[1] }; const [i, j] = v.slice(1).split(':').map(Number); return { z: 't', i, j }; }
function parseDst(v){ return { z: v[0], i: +v.slice(1) }; }

function solPointerDown(e){
  const el = e.target.closest('[data-src]'); if (!el || App.view !== 'sol' || SOL.st.won) return;
  const src = parseSrc(el.dataset.src);
  let els = [el];
  if (src.z === 't') els = [...el.parentElement.querySelectorAll(':scope > .card')].slice(src.j);
  SOL.drag = { src, els, x0: e.clientX, y0: e.clientY, on: false, id: e.pointerId };
  try { el.setPointerCapture(e.pointerId); } catch {}
}
function solPointerMove(e){
  const d = SOL.drag; if (!d || e.pointerId !== d.id) return;
  const dx = e.clientX - d.x0, dy = e.clientY - d.y0;
  if (!d.on && Math.hypot(dx, dy) < 6) return;
  d.on = true;
  d.els.forEach(el => { el.classList.add('dragging'); el.style.translate = `${dx}px ${dy}px`; });
}
function solPointerUp(e){
  const d = SOL.drag; if (!d || e.pointerId !== d.id) return;
  SOL.drag = null;
  if (!d.on) { const dst = SOL.autoFor(d.src); if (dst) SOL.move(d.src, dst); renderSol(); return; }
  let dst = null;
  const cx = e.clientX, cy = e.clientY;
  let best = 1e9;
  document.querySelectorAll('[data-drop]').forEach(z => {
    const r = z.getBoundingClientRect();
    const bottom = z.classList.contains('col') ? Math.max(r.bottom, r.top + 40) : r.bottom;
    const inX = cx >= r.left - 10 && cx <= r.right + 10;
    if (inX && cy >= r.top - 20 && cy <= bottom + 30) { const dist = Math.abs(cx - (r.left + r.width / 2)); if (dist < best) { best = dist; dst = parseDst(z.dataset.drop); } }
  });
  if (dst) SOL.move(d.src, dst);
  renderSol();
}
document.addEventListener('pointerdown', e => { if (App.view === 'sol') solPointerDown(e); });
document.addEventListener('pointermove', e => { if (App.view === 'sol') solPointerMove(e); });
document.addEventListener('pointerup', e => { if (App.view === 'sol') solPointerUp(e); });
document.addEventListener('pointercancel', () => { if (SOL.drag) { SOL.drag = null; renderSol(); } });

/* =================== rules =================== */
const RULES = {
  skyjo: ['Chaque joueur a 12 cartes face cachée en grille de 4 × 3 et en retourne 2 au départ.', 'À ton tour : pioche une carte ou prends celle de la défausse.', 'Une carte piochée peut remplacer une de tes cartes, ou être jetée : tu retournes alors une de tes cartes cachées.', 'Une carte prise dans la défausse doit remplacer une de tes cartes.', 'Trois cartes identiques dans une colonne disparaissent.', 'Quand quelqu’un a tout retourné, chacun joue un dernier tour. S’il n’a pas le plus petit score de la manche, ses points sont doublés.', 'La partie s’arrête quand un joueur atteint 100 points. Le plus petit total gagne.'],
  president: ['Ordre des cartes : 3, 4, 5 … roi, as, et le 2 au sommet.', 'Le premier joueur pose 1 à 4 cartes de même valeur.', 'Les suivants posent le même nombre de cartes, de valeur plus forte, ou passent. Qui passe ne rejoue pas dans ce pli.', 'Un 2 ferme le pli. Quand tout le monde passe, le dernier à avoir posé relance.', 'Le premier à vider sa main devient Président, le dernier Trouduc (et Vice-président, Vice-trouduc dès 4 joueurs).', 'Donne suivante : le Trouduc donne ses 2 meilleures cartes au Président qui lui rend ses 2 plus faibles, 1 carte entre les vices. Le Trouduc commence.'],
  mistigri: ['31 cartes du 7 à l’as : le valet de trèfle est retiré, le valet de pique devient le Mistigri.', 'Les paires (même valeur et même teinte, rouge ou noire) sont défaussées automatiquement.', 'À ton tour, tire une carte au hasard dans la main du joueur suivant. Si elle forme une paire, elle part.', 'Celui qui n’a plus de cartes sort. Le dernier joueur garde le Mistigri et perd la manche.', 'Tu peux mélanger ta main à tout moment pour brouiller les pistes.'],
  uno: ['7 cartes chacun. Pose une carte de la même couleur ou du même chiffre ou symbole que la défausse.', '+2 : le suivant pioche 2 cartes et passe son tour. Passe : le suivant saute son tour. Inversion : le sens change (à deux, tu rejoues).', 'Joker : se pose sur tout, tu choisis la couleur. Joker +4 : pareil, et le suivant pioche 4 cartes et passe son tour.', 'Rien à poser : pioche une carte, pose-la si elle va, sinon passe.', 'Quand il te reste 2 cartes, appuie sur « UNO ! ». Si tu oublies et qu’on te prend avec « Contre-UNO », tu pioches 2 cartes.', 'Le premier sans carte marque les cartes des autres : chiffres à leur valeur, +2, Inversion et Passe = 20, jokers = 50. Premier à 500 points.'],
  sol: ['Range toutes les cartes sur les quatre piles, de l’as au roi, par couleur.', 'Dans les colonnes, empile en descendant et en alternant rouge et noir. Seul un roi va sur une colonne vide.', 'Touche la pioche pour retourner 1 ou 3 cartes.', 'Touche une carte pour qu’elle se range toute seule, ou fais-la glisser où tu veux.', 'Quand tout est découvert, la fin se joue automatiquement.']
};
function showRules(g){
  const name = g === 'sol' ? 'Solitaire' : LOGIC[g].name;
  modal(`<h2>${name}</h2><ul class="rules">${RULES[g].map(r => `<li>${r}</li>`).join('')}</ul><div class="btns"><button class="btn pri" data-a="modal-close">Compris</button></div>`);
}

/* =================== main render + events =================== */
function render(){
  const root = $('#app');
  if (App.view === 'home') { modal(''); root.innerHTML = homeHTML(); renderStatus(); renderTables(); root.scrollTop = 0; }
  else if (App.view === 'table') { modal(''); App.sig = ''; renderTable(true); }
  else if (App.view === 'sol') { modal(''); renderSol(); }
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-a]'); if (!el) return;
  const a = el.dataset.a;
  if (a === 'modal-bg') { if (e.target === el && !$('#modal [data-over]')) modal(''); return; }
  const T = App.T, me = T ? T.seats.findIndex(s => s.id === Me.id) : -1;
  const g = x => send({ t: 'g', a: x });
  switch (a) {
    case 'av': Me.av = +el.dataset.i; LS.set('brelan.av', Me.av); Net.set({ av: Me.av }); document.querySelectorAll('.swatches button').forEach(b => b.setAttribute('aria-pressed', b === el)); $('#meav').innerHTML = avatar(Me, 'lg'); break;
    case 'create': createTable(el.dataset.g); break;
    case 'join': enterTable(el.dataset.code); break;
    case 'rules': showRules(el.dataset.g); break;
    case 'modal-close': modal(''); break;
    case 'sol': App.view = 'sol'; SOL.load(); render(); break;
    case 'leave': modal(''); if (App.view === 'table') leaveTable(); else { App.view = 'home'; render(); } break;
    case 'copycode': copy(App.code, 'Code de table copié'); break;
    case 'sound': Snd.on = !Snd.on; LS.set('brelan.snd', Snd.on); Snd.ensure(); el.innerHTML = Snd.on ? svgI.snd : svgI.mute; break;
    case 'bot+': send({ t: 'bot+' }); break;
    case 'kick': send({ t: 'kick', i: +el.dataset.i }); break;
    case 'takeover': send({ t: 'takeover', i: +el.dataset.i }); break;
    case 'start': send({ t: 'start' }); break;
    case 'next': App.ui.hideOver = false; modal(''); send({ t: 'next' }); break;
    case 'lobbyback': App.ui.hideOver = false; modal(''); send({ t: 'lobby' }); break;
    case 'hideover': App.ui.hideOver = true; modal(''); renderTable(true); break;
    case 'showover': App.ui.hideOver = false; renderTable(true); break;
    // skyjo
    case 'sky-draw': g({ t: 'draw' }); break;
    case 'sky-take': g({ t: 'take' }); break;
    case 'sky-dropmode': App.ui.drop = !App.ui.drop; renderTable(); break;
    case 'sky-cancel': App.ui.drop = false; renderTable(); break;
    case 'sky-cell': {
      const s = viewT().s, i = +el.dataset.i;
      if (s.ph === 'reveal') g({ t: 'flip', i });
      else if (App.ui.drop) { App.ui.drop = false; g({ t: 'drop', i }); }
      else g({ t: 'swap', i });
      break;
    }
    // président
    case 'pr-sel': {
      const c = +el.dataset.c, s = viewT().s; let sel = (App.ui.sel || []).filter(x => s.h[me].includes(x));
      if (sel.includes(c)) sel = sel.filter(x => x !== c);
      else if (sel.length && R(sel[0]) === R(c)) sel = [...sel, c];
      else {
        sel = [c];
        const k = s.pile.length;
        if (k > 1) { const same = s.h[me].filter(x => R(x) === R(c) && x !== c); while (sel.length < k && same.length) sel.push(same.shift()); }
      }
      App.ui.sel = sel; renderTable(); break;
    }
    case 'pr-play': { const cs = App.ui.sel || []; App.ui.sel = []; g({ t: 'play', cs }); break; }
    case 'pr-pass': App.ui.sel = []; g({ t: 'pass' }); break;
    // mistigri
    case 'mi-draw': g({ t: 'draw', k: +el.dataset.ix }); break;
    case 'mi-shuf': g({ t: 'shuf' }); break;
    // uno
    case 'un-draw': g({ t: 'draw' }); break;
    case 'un-pass': g({ t: 'pass' }); break;
    case 'un-uno': g({ t: 'uno' }); break;
    case 'un-catch': send({ t: 'g', a: { t: 'catch', i: +el.dataset.i } }); break;
    case 'un-play': { const c = +el.dataset.c; if (c >= 100) { App.ui.pickW = c; renderTable(); } else g({ t: 'play', c }); break; }
    case 'un-col': { const c = App.ui.pickW; App.ui.pickW = null; g({ t: 'play', c, su: +el.dataset.su }); break; }
    case 'un-cancel': App.ui.pickW = null; renderTable(); break;
    // solitaire
    case 'sol-stock': SOL.drawStock(); renderSol(); break;
    case 'sol-undo': SOL.undo(); break;
    case 'sol-new': modal(''); SOL.newGame(); renderSol(); break;
    case 'sol-draw': SOL.st.draw = +el.dataset.n; LS.set('brelan.sol.draw', SOL.st.draw); SOL.save(); renderSol(); break;
  }
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('[role="button"][data-a]')) { e.preventDefault(); e.target.click(); }
  if (e.key === 'Escape' && $('#modal .sheet') && !$('#modal [data-over]')) modal('');
});
document.addEventListener('input', e => {
  if (e.target.id === 'nm') { Me.name = cleanName(e.target.value); LS.set('brelan.name', Me.name); Net.set({ n: Me.name }); $('#meav').innerHTML = avatar(Me, 'lg'); }
  if (e.target.id === 'jc') e.target.value = e.target.value.toUpperCase().replace(/[^A-Z]/g, '');
});
document.addEventListener('submit', e => {
  if (e.target.id === 'joinform') { e.preventDefault(); const c = $('#jc').value.trim().toUpperCase(); if (c.length === 4) enterTable(c); else toast('Le code fait 4 lettres.'); }
});
let rsT; addEventListener('resize', () => { clearTimeout(rsT); rsT = setTimeout(() => { if (App.view === 'sol') layoutSol(); else if (App.view === 'table') renderTable(true); }, 120); });
setInterval(() => { if (App.view === 'sol' && SOL.st && !SOL.st.won) { const t = $('#soltime'); if (t) t.textContent = fmtTime(Date.now() - SOL.st.t0); } }, 1000);
setInterval(() => { if (App.view === 'sol') SOL.save(); }, 5000);

function boot(data){
  if (data && data.view === 'sol') { App.view = 'sol'; SOL.load(); }
  render();
  Net.init();
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ view: App.view === 'sol' ? 'sol' : 'home' })); } catch {}
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot((window.claude && window.claude.hot && window.claude.hot.data) || {});
