<script>
"use strict";
const cv = document.getElementById('c');
let W, H, DPR, S, renderer=null, camera=null;
// qualité graphique : baisse automatiquement si l'ordinateur n'arrive pas à suivre
const QUAL={pr:1,level:0,frames:0,acc:0};
function resize(){ DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; S = H/720;
  if(renderer){ renderer.setPixelRatio(Math.min(DPR,QUAL.pr)); renderer.setSize(W,H,false); camera.aspect=W/H; camera.updateProjectionMatrix(); } }
addEventListener('resize', resize); resize();

/* ---------- Réglages physiques ---------- */
const G = 2200, BODY_R = 26, HEAD_R = 11, MIN_L = 35, MAX_L = 150;
const PIV = {x:0, y:-22}, SUB = 12, MU = 1.15, BODY_FR = 0.93, MAXD = 2600;
let VMAX = 1500; let HVMAX = 900, PUSHMAX = 750;
/* Force de la pioche : part de la poussée transmise en élan (0.1 = mou, 1 = très fort). Réglable en jeu avec + et - */
let FORCE = 0.55, SENS = 1;
let START = {x:-150, y:-30}, GOAL = {x:0, y:-1000}, FLAG_Y = -974, GOAL_ALT = 100;
let GAMEMODE = 'climb', MAP = 0;     // GAMEMODE : 'climb' (la montée) ou 'arena' (la bagarre)

/* ---------- Niveaux : 5 montagnes (tirées au sort) + l'arène de bagarre ---------- */
const rect=(x0,y0,x1,y1)=>[[x0,y0],[x1,y0],[x1,y1],[x0,y1]];
const rrect=(x0,y0,x1,y1,r)=>[[x0+r,y0],[x1-r,y0],[x1,y0+r],[x1,y1-r],[x1-r,y1],[x0+r,y1],[x0,y1-r],[x0,y0+r]];
const circ=(cx,cy,r,n=8)=>[...Array(n)].map((_,i)=>[cx+Math.cos(i/n*Math.PI*2)*r, cy+Math.sin(i/n*Math.PI*2)*r]);
const BOOKS=[{x:0,y:0,w:54,h:9},{x:3,y:-9,w:48,h:10},{x:-2,y:-19,w:50,h:8},{x:4,y:-27,w:44,h:10},{x:-1,y:-37,w:46,h:8}];
const COLL={
  bench:()=>[rect(-75,-46,75,-39),rect(-68,-39,-60,0),rect(60,-39,68,0)],
  suitcase:()=>[rrect(-35,-48,35,0,6)],
  car:()=>[[[-210,-28],[-208,-72],[-160,-82],[-100,-128],[55,-130],[115,-85],[200,-78],[210,-30]],circ(-130,-28,28,10),circ(130,-28,28,10)],
  table:()=>[rect(-80,-78,80,-70),rect(-72,-70,-64,0),rect(64,-70,72,0)],
  chair:()=>[rect(-22,-46,22,-40),rect(16,-100,22,-46),rect(-22,-40,-17,0),rect(17,-40,22,0)],
  tires:()=>[rrect(-50,-78,50,0,8)],
  fridge:()=>[rrect(-36,-175,36,0,8)],
  washer:()=>[rrect(-31,-85,31,0,5)],
  sofa:()=>[rect(-100,-40,100,0),rect(-110,-68,-88,0),rect(88,-68,110,0)],
  toilet:()=>[[[-30,-42],[22,-42],[18,-14],[10,0],[-14,0],[-22,-14]],rect(20,-90,36,-40)],
  bookshelf:()=>[rect(39,-220,45,0),rect(-45,-220,45,-214),rect(-45,-6,39,0),rect(-45,-63,39,-57),rect(-45,-115,39,-109),rect(-45,-167,39,-161)],
  bathtub:()=>[[[-90,-55],[-78,-55],[-70,-18],[70,-18],[78,-55],[90,-55],[80,-8],[-80,-8]],rect(-76,-8,-66,0),rect(66,-8,76,0)],
  piano:()=>[rect(-75,-130,75,0)],
  lamp:()=>[rect(-6,-380,6,0),rect(0,-382,64,-374)],
  boat:()=>[[[-140,-55],[-128,-55],[-108,-20],[-85,-10],[85,-10],[110,-20],[136,-60],[150,-60],[120,-15],[90,0],[-90,0],[-120,-15]]],
  wardrobe:()=>[rrect(-55,-170,55,0,3)],
  books:()=>BOOKS.map(b=>rect(b.x-b.w/2,b.y-b.h,b.x+b.w/2,b.y)),
  barrel:()=>[rect(-28,-85,28,0)],
  wheel:()=>[circ(0,-38,38,14)],
  post:()=>[rect(-6,-210,6,0),rect(0,-212,64,-204)],
  ladder:(o)=>{const L=o.L,r=[rect(-4,-L,4,0)];for(let y=26;y<L-8;y+=30)r.push(circ(o.nub,-y,5,6));return r;}
};
const GRIP={wheel:.9,post:.6,fridge:.55,washer:.55,car:.6,barrel:.6,bathtub:.5,piano:.5,toilet:.55,ladder:.8,chair:.9,table:.9,bench:.9,bookshelf:.9,wardrobe:.8,books:1,tires:1.4,sofa:1.4,suitcase:.9,lamp:.6,boat:.8};
const C={red:0xa61b1b,blue:0x2c5a85,rust:0x8f2f22,green:0x2d5b3a,ochre:0x8a6d2b,teal:0x2f5d62,grey:0x5a5a5a};
const MAP_NAMES=['La Montagne','La Casse','La Forêt','L’Usine','Le Glacier'];

/* les éléments du parcours (zone : 1 pierrier, 2 tuyauterie, 3 dépotoir, 4 forêt, 5 glace, 6 roche rouge, 7 usine, 8 basalte) */
const PIECES=[], PLACE=[], LEVEL=[], OBJS=[], ROUTE=[];
let FORKS=false, PROFILE=[], SEED=1, BGROCK=false, ZONE_OF=()=>1, THEME='mountain', ARENA=null;
function rock(cx,top,w,h,zone,mu){const x0=cx-w/2,x1=cx+w/2,s=(SEED++)*1.7;
  const p=[[x0+16,top],[cx,top+2],[x1-16,top],[x1-3,top+16],[x1,top+h*.45],[x1-w*.18,top+h],[x0+w*.22,top+h-6],[x0,top+h*.5],[x0+3,top+16]];
  PIECES.push({kind:'rock',zone,poly:p,x0,x1,top,h,cx,w,seed:s,mu,bg:BGROCK});}
// une falaise : un gros bloc aux flancs bien droits
function block(x0,x1,top,bottom,zone,mu){const h=bottom-top,cx=(x0+x1)/2,w=x1-x0,s=(SEED++)*1.7;
  const p=[[x0+7,top],[x0+w*.3,top+2],[x0+w*.62,top-1],[x1-7,top],[x1,top+9],[x1,bottom-20],[x1-w*.12,bottom],[x0+w*.15,bottom-4],[x0,bottom-24],[x0,top+9]];
  PIECES.push({kind:'rock',zone,poly:p,x0,x1,top,h,cx,w,seed:s,mu,bg:true,cliff:true});}
function pipeH(x0,x1,top,d,mu){PIECES.push({kind:'pipeH',poly:rrect(x0,top,x1,top+d,6),x0,x1,top,d,mu:mu||.5});}
function pipeV(x,top,bottom,d,stubs){const p={kind:'pipeV',poly:rect(x-d/2,top,x+d/2,bottom),x,top,bottom,d,mu:.5,stubs:[]};PIECES.push(p);
  for(const [side,y,len] of stubs){const sx0=side>0?x+d/2:x-d/2-len, sx1=side>0?x+d/2+len:x-d/2;PIECES.push({kind:'stub',poly:rrect(sx0,y,sx1,y+24,4),x0:sx0,x1:sx1,top:y,d:24,side,mu:.9});}}
function tank(cx,top,w,h){const x0=cx-w/2,x1=cx+w/2,p=[];for(let i=0;i<=10;i++){const a=Math.PI*i/10;p.push([cx-Math.cos(a)*w/2, top+40-Math.sin(a)*40]);}p.push([x1,top+h],[x0,top+h]);
  PIECES.push({kind:'tank',poly:p,cx,top,w,h,mu:.45});}
// la fourche au sommet du tronc déborde du côté opposé aux branches (pour ne pas faire de plafond au-dessus d'elles)
function tree(x,base,height,branches,fs){const top=base-height;PIECES.push({kind:'trunk',poly:rect(x-15,top,x+15,base),x,top,base,mu:.95,metal:JUNKSKIN&&THEME!=='foret'});
  const f0=x-34, f1=x+34;
  if(FORKS) PIECES.push({kind:'fork',poly:rrect(f0,top,f1,top+10,3),x0:f0,x1:f1,top,tx:x,mu:.95});
  for(const [side,y,len] of branches){const bx0=side>0?x+15:x-15-len,bx1=side>0?x+15+len:x-15;PIECES.push({kind:'branch',poly:rrect(bx0,y,bx1,y+18,4),x0:bx0,x1:bx1,top:y,side,len,tx:x,mu:.95,metal:JUNKSKIN&&THEME!=='foret'});}}
function log(x0,y0,x1,y1,r){const dx=x1-x0,dy=y1-y0,l=Math.hypot(dx,dy),nx=-dy/l*r,ny=dx/l*r;
  PIECES.push({kind:'log',poly:[[x0-nx,y0-ny],[x1-nx,y1-ny],[x1+nx,y1+ny],[x0+nx,y0+ny]],x0,y0,x1,y1,r,mu:.95});}
/* ---------- Le tas de débris : les marches du chemin sont des objets, et tout repose sur un amas d'objets ---------- */
/* ---------- Mécaniques : trampolines, tapis roulants, colonnes d'air, ascenseurs, navettes, planches qui s'effondrent, bulles d'apesanteur ---------- */
const MECH=[], DYN=[], ZONES=[]; let SIMT=0, CARRY=null, carryT=0;
function mkTramp(x0,x1,top){ const p={t:'tramp',p:rect(x0,top,x1,top+26),mu:1,sp:1,bounce:1080,lastB:-9}; LEVEL.push(p); MECH.push({k:'tramp',x0,x1,top,poly:p}); }
function mkBelt(x0,x1,top,speed){ const p={t:'belt',p:rect(x0,top,x1,top+28),mu:1.1,sp:1,belt:speed}; LEVEL.push(p); MECH.push({k:'belt',x0,x1,top,speed}); }
function mkFan(x0,x1,base,h){ LEVEL.push({t:'fan',p:rect(x0,base,x1,base+42),mu:1}); const z={x0:x0+8,x1:x1-8,y0:base-h,y1:base-40,up:470}; ZONES.push(z); MECH.push({k:'fan',x0,x1,base,h,z}); }
function mkLow(x0,x1,y0,y1){ const z={x0,x1,y0,y1,g:.3}; ZONES.push(z); MECH.push({k:'low',x0,x1,y0,y1}); }
function mkMover(k,x0,x1,top,h,o){ const base=rect(x0,top,x1,top+h);
  const q=Object.assign({t:k,k,base,p:base.map(v=>v.slice()),mu:1,sp:1,dyn:1,ox:0,oy:0,ddx:0,ddy:0,active:true,x0,x1,top,h,tT:0,rise:0,run:0,per:8,ph:0,crumble:k==='crumble'},o||{});
  DYN.push(q); MECH.push({k,dyn:q}); return q; }
const ease=u=>u*u*(3-2*u);
function updateDyn(){
  for(const q of DYN){ let ox=0, oy=0, act=true;
    if(q.k==='lift'||q.k==='shuttle'){ const ph=((SIMT+q.ph)%q.per)/q.per; const u=ph<.25?0:ph<.5?ease((ph-.25)/.25):ph<.75?1:1-ease((ph-.75)/.25); ox=q.run*u; oy=-q.rise*u; }
    else if(q.crumble&&q.tT){ const e=SIMT-q.tT; if(e<1.5){ ox=Math.sin(e*95)*1.2*e; } else if(e<4.7){ const f=e-1.5; oy=900*f*f; act=oy<700; } else q.tT=0; }
    q.ddx=ox-q.ox; q.ddy=oy-q.oy; q.ox=ox; q.oy=oy; q.active=act;
    let mnx=1e9,mxx=-1e9,mny=1e9,mxy=-1e9;
    for(let i=0;i<q.base.length;i++){ const x=q.base[i][0]+ox, y=q.base[i][1]+oy; q.p[i][0]=x; q.p[i][1]=y; if(x<mnx)mnx=x; if(x>mxx)mxx=x; if(y<mny)mny=y; if(y>mxy)mxy=y; }
    q.minx=mnx; q.maxx=mxx; q.miny=mny; q.maxy=mxy; }
}
function zoneAt(x,y){ for(const z of ZONES) if(x>=z.x0&&x<=z.x1&&y>=z.y0&&y<=z.y1) return z; return null; }
const DEB=[];   // débris décoratifs (rendus en instances) : [forme, x, y, z, sx, sy, sz, rotation, couleur]
const JUNK={crate:[80,105,1],container:[95,105,.9],fridge:[70,74,.55],wardrobe:[58,64,.8],mattress:[28,34,1.3],pallet:[20,24,1],pipe:[44,48,.5],bookshelf:[42,48,.9],plank:[14,18,.95],oven:[70,80,.7]};
const JUNK_COLS=[0xb5452e,0x2f6a8f,0x3f7a45,0xc98b2a,0x7a3f8a,0x8f8f8f,0xa8322b,0x2a5a6a,0xd8d0c0,0x5a4a3a];
let JUNKSKIN=false;
function junkPlat(a,b,t,sub,rnd){ const [h0,h1,mu]=JUNK[sub], h=h0+(h1-h0)*rnd(), x0=Math.min(a,b), x1=Math.max(a,b);
  PIECES.push({kind:'junk',sub,poly:rect(x0,t,x1,t+h),x0,x1,top:t,h,cx:(x0+x1)/2,w:x1-x0,mu,seed:(SEED++)*1.7,col:JUNK_COLS[(rnd()*JUNK_COLS.length)|0]});
  // un amas d'objets en dessous et derrière, pour que rien ne flotte
  const n=4+((rnd()*4)|0);
  for(let i=0;i<n;i++){ const sh=rnd()<.45?'box':rnd()<.6?'cyl':'tire', sz=50+rnd()*140;
    const e=[sh,x0+rnd()*(x1-x0),t+h+sz*.4+rnd()*380,-150-rnd()*260,sz*(.8+rnd()*.8),sz*(.6+rnd()*.6),sz*(.7+rnd()*.7),rnd()*6.28,JUNK_COLS[(rnd()*JUNK_COLS.length)|0]];
    if(i%2===0) DEB.push(e); }   // un objet sur deux seulement : décor plus aéré
}
function prng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)>>>0;let t=a;t=Math.imul(t^(t>>>15),t|1);t^=t+Math.imul(t^(t>>>7),t|61);return((t^(t>>>14))>>>0)/4294967296;};}

/* Le parcours est assemblé à partir de passages éprouvés (tous franchissables) :
   step/wide/ice/snow = rocher, pipe = tuyau, tree = arbre, turn = arbre puis demi-tour,
   cliff_* = falaise avec son accroche (arbre, tuyaux, rochers, glace, colonne à piquages, électroménager, casse auto),
   obj:x = objet à escalader, d:x = objet de décor, summit = sommet + drapeau */
function course(L,d,plan,th){
  const rnd=prng(th.seed), R=(a,b)=>a+(b-a)*rnd(), RI=(a,b)=>Math.floor(R(a,b+1));
  const wp=(a,b,t,n,q)=>ROUTE.push(q?[Math.min(a,b),Math.max(a,b),t,n,q]:[Math.min(a,b),Math.max(a,b),t,n]);
  const fx=()=>d>0?L.x1:L.x0;
  const span=(n,w)=>d>0?[n,n+w]:[n-w,n];
  const setL=(a,b,t)=>{L={x0:Math.min(a,b),x1:Math.max(a,b),top:t};};
  const JK=!!th.junk, jsub=()=>th.junk[(rnd()*th.junk.length)|0];
  const stepRock=(w,g,r,h,zone,mu,name)=>{
    const [a,b]=span(fx()+d*g,w),t=L.top-r; if(JK&&mu!==.35) junkPlat(a,b,t,jsub(),rnd); else rock((a+b)/2,t,w,h,zone,mu); wp(a,b,t,JK&&name==='rocher'?'débris':name); setL(a,b,t); };
  const ensure=need=>{ if(L.x1-L.x0<need) stepRock(need+R(25,50),R(32,45),R(95,104),R(100,130),th.zone(L.top),th.mu,'replat'); };
  const cliff=(H,w,zone,mu)=>{ const face=fx(),t=L.top-H; const [a,b]=span(face,w); block(a,b,t,L.top+140,zone,mu); if(JK){ const pc=PIECES[PIECES.length-1]; pc.kind='junk'; pc.sub='stack'; pc.col=JUNK_COLS[(rnd()*JUNK_COLS.length)|0]; } return {face,t,a,b}; };
  const at=(face,xl)=>face-d*xl;
  const put=(type,x,y,opt)=>PLACE.push([type,x,y,Object.assign({flip:d<0},opt||{})]);
  BGROCK=true; JUNKSKIN=JK;
  wp(L.x0,L.x1,L.top,'départ');
  for(const tok of plan.trim().split(/\s+/)){
    const y=L.top, Z=th.zone(y);
    if(tok==='step') stepRock(R(170,240),R(40,58),R(94,106),R(90,110),Z,th.mu,'rocher');
    else if(tok==='big') stepRock(R(460,600),R(32,45),R(95,104),R(110,140),Z,th.mu,'grand plateau');
    else if(tok==='wide') stepRock(R(310,350),R(32,45),R(95,104),R(100,130),Z,th.mu,'grand rocher');
    else if(tok==='ice') stepRock(R(155,180),R(32,45),100,R(92,100),5,.35,'glace');
    else if(tok==='snow') stepRock(R(150,200),R(32,48),R(95,104),R(92,105),5,.8,'neige');
    else if(tok==='pipe'){ const g=R(28,42); const [a,b]=span(fx()+d*g,R(150,175)),t=y-100; pipeH(a,b,t,40,.85); wp(a,b,t,'tuyau'); setL(a,b,t); }
    else if(tok==='tree'||tok==='turn'){
      // l'arbre : deux branches du côté où l'on arrive ; on en sort par un rocher posé à hauteur de la fourche
      const turn=tok==='turn', tx = turn ? (L.x0+L.x1)/2 + d*25 : fx()-d*45;
      tree(tx,y,turn?300:255,[[-d,y-95,70],[-d,y-195,60]]);
      const b1=-d>0?[tx+15,tx+85]:[tx-85,tx-15], b2=-d>0?[tx+15,tx+75]:[tx-75,tx-15];
      wp(b1[0],b1[1],y-95,'branche'); wp(b2[0],b2[1],y-195,'branche');
      if(turn){ d=-d; const [a,b]=span(tx+d*R(93,99),R(150,190)),t=y-300; rock((a+b)/2,t,b-a,62,Z,th.mu); wp(a,b,t,'rocher'); setL(a,b,t); }
      else { const [a,b]=span(tx+d*(15+R(26,34)),R(150,200)),t=y-300; rock((a+b)/2,t,b-a,R(90,105),Z,th.mu); wp(a,b,t,'rocher'); setL(a,b,t); }
    }
    else if(tok==='cliff_tree'){ ensure(150); const y=L.top, c=cliff(290,R(230,320),th.zone(y-150),th.mu), tx=at(c.face,40);
      tree(tx,y,290,[[-d,y-90,65],[-d,y-190,55]]);
      const b1=[tx-d*15,tx-d*80], b2=[tx-d*15,tx-d*70];
      wp(b1[0],b1[1],y-90,'branche'); wp(b2[0],b2[1],y-190,'branche'); wp(c.a,c.b,c.t,'falaise'); setL(c.a,c.b,c.t); }
    else if(tok==='cliff_pipes'){ ensure(190); const y=L.top, c=cliff(305,R(230,320),th.zone(y-150),th.mu);
      pipeH(Math.min(at(c.face,115),c.face),Math.max(at(c.face,115),c.face),y-110,40,.5);
      pipeH(Math.min(at(c.face,60),c.face),Math.max(at(c.face,60),c.face),y-200,40,.85);
      wp(at(c.face,115),c.face,y-110,'tuyau'); wp(at(c.face,60),c.face,y-200,'tuyau'); wp(c.a,c.b,c.t,'falaise'); setL(c.a,c.b,c.t); }
    else if(tok==='cliff_rocks'){ ensure(150); const y=L.top, Zr=th.zone(y-100), c=cliff(305,R(230,320),th.zone(y-150),th.mu);
      rock(at(c.face,55),y-95,110,95,Zr,th.mu); rock(at(c.face,30),y-195,60,100,Zr,th.mu);
      wp(at(c.face,110),c.face,y-95,'rocher'); wp(at(c.face,60),c.face,y-195,'rocher'); wp(c.a,c.b,c.t,'falaise'); setL(c.a,c.b,c.t); }
    else if(tok==='cliff_ice'){ ensure(170); const y=L.top, c=cliff(300,R(230,320),5,th.mu);
      rock(at(c.face,70),y-95,140,95,5,.35); rock(at(c.face,35),y-195,70,100,5,.35);
      wp(at(c.face,140),c.face,y-95,'glace'); wp(at(c.face,70),c.face,y-195,'glace'); wp(c.a,c.b,c.t,'falaise'); setL(c.a,c.b,c.t); }
    else if(tok==='cliff_stubs'){ ensure(220); const y=L.top, c=cliff(315,R(230,320),th.zone(y-150),th.mu);
      pipeV(at(c.face,35),y-315,y,50,[[-d,y-85,85],[-d,y-175,85],[-d,y-265,85]]);
      for(const k of[85,175,265]) wp(at(c.face,145),at(c.face,60),y-k,'piquage');
      wp(c.a,c.b,c.t,'falaise'); setL(c.a,c.b,c.t); }
    else if(tok==='cliff_objs'){ ensure(270); const y=L.top, c=cliff(260,R(230,320),th.zone(y-150),th.mu);
      put('washer',at(c.face,160),y); put('wardrobe',at(c.face,58),y);
      wp(at(c.face,191),at(c.face,129),y-85,'lave-linge'); wp(at(c.face,113),at(c.face,3),y-170,'armoire'); wp(c.a,c.b,c.t,'falaise'); setL(c.a,c.b,c.t); }
    else if(tok==='cliff_junk'){ ensure(800); const y=L.top, c=cliff(300,R(230,320),th.zone(y-150),th.mu);
      put('car',at(c.face,445),y,{col:[C.red,C.blue,C.green,C.ochre][(rnd()*4)|0]}); put('tires',at(c.face,165),y); put('bookshelf',at(c.face,60),y);
      wp(at(c.face,545),at(c.face,390),y-130,'voiture'); wp(at(c.face,205),at(c.face,125),y-78,'pneus'); wp(at(c.face,105),at(c.face,15),y-220,'étagère'); wp(c.a,c.b,c.t,'falaise'); setL(c.a,c.b,c.t); }
    else if(tok.startsWith('obj:')){ const ty=tok.slice(4), hw={washer:31,barrel:28,tires:50,suitcase:35}[ty], hh={washer:85,barrel:85,tires:78,suitcase:48}[ty];
      ensure(hw*2+70); const x=fx()-d*(hw+14); put(ty,x,L.top,ty==='barrel'?{col:[C.blue,C.rust,C.green][(rnd()*3)|0]}:{});
      wp(x-hw,x+hw,L.top-hh,ty); setL(x-hw,x+hw,L.top-hh); }
    else if(tok.startsWith('d:')){ put(tok.slice(2),(L.x0+L.x1)/2+R(-20,20),L.top,{deco:true,z:-230-R(0,40)}); }
    else if(tok.startsWith('sp:')){
      // passage difficile fait d'objets (souvent suspendus dans le vide)
      const name=tok.slice(3), id=SPN++, tag='P'+id+':';
      if(SP_SKIP_CUR.includes(id)){ stepRock(R(150,230),R(32,50),R(94,106),R(90,110),Z,th.mu,tag+'remplacé'); stepRock(R(150,230),R(32,50),R(94,106),R(90,110),Z,th.mu,tag+'remplacé'); continue; }
      if(L.x1-L.x0<110 && /pile|barils/.test(name)) stepRock(R(170,220),R(32,45),R(95,104),R(95,110),Z,th.mu,tag+'appui');
      const f0=fx(), y0=L.top, U=u=>f0+d*u, span2=(a,b)=>[Math.min(U(a),U(b)),Math.max(U(a),U(b))];
      const ob=(type,u,v,opt)=>PLACE.push([type,U(u),y0-v,Object.assign({flip:d<0,col:[C.red,C.blue,C.green,C.ochre,C.teal,C.rust][(rnd()*6)|0]},opt||{})]);
      const W=(a,b,v,n,dq)=>{ const [p,q]=span2(a,b); wp(p,q,y0-v,tag+n,dq); };
      const pad=(a,w,v,n)=>{ const [p,q]=span2(a,a+w); if(JK) junkPlat(p,q,y0-v,'pallet',rnd); else rock((p+q)/2,y0-v,w,R(40,50),Z,th.mu); wp(p,q,y0-v,tag+n); };
      const exit=(u,v)=>{ const w=R(180,230), [p,q]=span2(u,u+w); if(JK) junkPlat(p,q,y0-v,jsub(),rnd); else rock((p+q)/2,y0-v,w,R(95,115),Z,th.mu); wp(p,q,y0-v,tag+'sortie'); setL(p,q,y0-v); };
      let u=0, v=0;
      if(name==='bancs'){ u=R(35,50); const n=RI(3,4); for(let k=0;k<n;k++){ v+=R(78,92); const c=u+75; ob('bench',c,v-46); W(c-70,c+70,v,'banc'); u=c+75+R(35,55); } exit(u,v+R(80,92)); }
      else if(name==='roues'){ u=R(30,42); const n=RI(3,4); for(let k=0;k<n;k++){ v+=R(68,80); const c=u+38; ob('wheel',c,v-76); W(c-16,c+16,v,'roue'); u=c+38+R(28,40); } exit(u,v+R(72,85)); }
      else if(name==='echelle'){ const run=R(270,310), rise=R(115,140); PLACE.push(['ladder',U(15),y0+10,{bx:U(15),by:y0+10,tx:U(15+run),ty:y0-rise}]); exit(15+run-10,rise+R(8,16)); }
      else if(name==='lampe'){ const g=R(140,165); ob('post',R(65,85),-170,{flip:d<0}); exit(g,R(35,55)); }
      else if(name==='bain'){ const vr=R(85,95), c=R(130,145); ob('bathtub',c,vr-55); W(c-60,c+60,vr-37,'baignoire'); exit(c+90+R(35,45),vr+R(80,92)); }
      else if(name==='chaises'){ u=R(35,50); for(let k=0;k<3;k++){ v+=R(72,84); const c=u+22; ob('chair',c,v-46,{flip:d<0}); W(c-20,c+14,v,'chaise'); u=c+22+R(45,58); } exit(u,v+R(80,90)); }
      else if(name==='piano'){ const vt=R(88,98), c=R(112,125); ob('piano',c,vt-130); W(c-72,c+72,vt,'piano'); exit(c+75+R(35,45),vt+R(85,95)); }
      else if(name==='table'){ const vt=R(85,95), c=R(115,128); ob('table',c,vt-78); W(c-78,c-25,vt,'table'); ob('chair',c+42,vt,{flip:d>0}); W(c+22,c+60,vt+46,'chaise'); exit(c+80+R(35,45),vt+46+R(80,90)); }
      else if(name==='pile'){ const c=-45; ob('washer',c,0); ob('barrel',c+R(-6,6),85); W(c-26,c+26,170,'bidon'); exit(c+28+R(40,52),170+R(85,95)); }

    else throw new Error('module inconnu : '+tok);
  }
  BGROCK=false; JUNKSKIN=false;

}

  PROFILE=[

  tree(560,-190,290,[[-1,-280,65],[-1,-380,55]]);

  rock(1270,-1540,60,100,2);
  tree(1650,-1780,305,[[-1,-1875,70],[-1,-1975,60]]);
  pipeV(1870,-2400,-2085,50,[[-1,-2170,85],[-1,-2260,85],[-1,-2350,85]]);
  rock(2690,-2795,140,95,5,.35);
  rock(2725,-2895,70,100,5,.35);
  rock(918,-830,135,90,1);
  rock(950,-935,70,105,1);
  tree(2925,-3000,300,[[-1,-3095,70],[-1,-3195,60]]);
  PLACE.push(
    ['bench',-300,0],['boat',150,0,{deco:true,z:-110}],['lamp',-480,0,{deco:true,z:-80}],['barrel',230,0,{deco:true,z:-60,col:C.rust}],
    ['washer',640,-481],['wardrobe',742,-484],
    ['books',1440,-1777],['sofa',1480,-1780,{deco:true,z:-250,col:C.teal}],

  // décalage : tout ce qui est au-delà de x=1000 est poussé de 60 vers la droite (plus de place sur les replats)
  {const SX=x=>x>=1000?x+60:x;
   for(const p of PROFILE) p[0]=SX(p[0]);
   for(const pc of PIECES){ pc.poly=pc.poly.map(([x,y])=>[SX(x),y]); for(const k of['x0','x1','cx','x','tx']) if(typeof pc[k]==='number') pc[k]=SX(pc[k]); }
   for(const o of PLACE){ o[1]=SX(o[1]); }}
  // ---- la suite : on continue dans la même direction, comme une vraie ascension ----
  stairsCourse({seed:131,dir:1,ox:3660,oy:-3450,cont:true,mu:undefined,zone:y=>ZONE_OF(y),plan:`

/* Les 4 autres montagnes : une seule grande masse en escalier (comme la première montée),
   avec des obstacles semés le long du chemin.
   stairs = quelques marches irrégulières, wall = mur nu, overhang = surplomb, gap = crevasse,
   ice = marches verglacées, block:x = gros objet à franchir sur un replat,
   cliff_* = falaise avec son accroche, summit = sommet + drapeau */
const CLIFF_NEED={tree:200,pipes:190,rocks:180,ice:200,stubs:230,objs:270,junk:700};

  let d=th.dir, ox=th.ox||0; const d0=d, ox0=ox, cont=!!th.cont, rnd=prng(th.seed), R=(a,b)=>a+(b-a)*rnd(), RI=(a,b)=>Math.floor(R(a,b+1));

  const JK=THEME==='casse'||THEME==='usine', jc=()=>JUNK_COLS[(rnd()*JUNK_COLS.length)|0];
  const put=(type,xl,y,opt)=>PLACE.push([type,X(xl),y,Object.assign({flip:d<0},opt||{})]);

  // posée bien au-dessus (assez haut pour qu'on ait toujours de la place en dessous)
  const T=230; let legStart=0, legGround=true;
  const closeLeg=()=>{ let pts=PROFILE.slice(legStart);
    // une bande posée sur la précédente commence en haut de sa première paroi : rien en dessous (pas de mur invisible)
    if(!legGround){ const k=pts.findIndex(p=>p[1]<pts[0][1]-50); if(k>0) pts=pts.slice(k); }
    if(legGround){ LEVEL.push({t:'mount',p:[...pts,[pts[pts.length-1][0],400],[pts[0][0],400]]}); return; }
    // dessous de la bande : épais, sauf au début (là où l'on passe dessous pour aller grimper sa face) où elle est très fine
    const i1=0;
    const under=[]; let lx=null; for(let i=pts.length-1;i>=0;i--){ const p=pts[i]; if(lx===null||(d>0?p[0]<=lx+.5:p[0]>=lx-.5)){ under.push([p[0],p[1]+(i<=i1+1?60:T)]); lx=p[0]; } }
    LEVEL.push({t:'mount',p:[...pts,...under]}); };
  // une fosse : si on tombe dedans, des rochers permettent de remonter du côté du départ
  const pit=(f,u,D,yTop)=>{ Pt(f,cy); Pt(f+4,cy+D); rock(X(f+70),cy+D-R(92,100),R(105,120),110,Z(cy),th.mu); Pt(u-4,cy+D); Pt(u,yTop); };

  const plan=th.plan.trim().split(/\s+/).flatMap(t=>t.startsWith('turn:')?['__top:'+t.slice(5),'flip','cliff_'+t.slice(5)]:t.startsWith('turnc:')?['__topc','flip','chim'+t.slice(6)]:[t]);

      for(let k=0;k<n;k++){ const L=ice?R(120,165):R(60,115), H=ice?R(66,90):R(75,112), f=ledge(L,ice?'glace':'marche');
        if(ice){ rock(X((cx+f)/2),cy-14,f-cx-6,30,5,.4); ROUTE[ROUTE.length-1][2]=cy-14; }
        riser(f,H+(ice?14:0),R(0,10)); }
    }
    else if(tok==='big'){ const f=ledge(R(460,600),'plateau'); riser(f,R(80,105),R(0,8)); }
    else if(tok==='wall'){ const f=ledge(R(110,190),'replat'); riser(f,R(150,175),R(0,4)); }
    else if(tok==='overhang'){ const f=ledge(R(320,360),'replat');
      Pt(f,cy); Pt(f+10,cy-80); Pt(f-170,cy-85); Pt(f-175,cy-125); if(THEME==='glacier') DECOR.push({t:'icicles',a:X(f-168),b:X(f+5),y:cy-80}); cx=f-175; cy-=125; minL=260; }
    else if(tok==='gap'){ const f=ledge(R(110,170),'bord'), W=R(100,135);

    else if(tok.startsWith('block:')){
      const ty=tok.slice(6), sz={car:[210,130],piano:[75,130],fridge:[36,175],sofa:[110,68],washer:[31,85],wardrobe:[55,170],tires:[50,78],barrel:[28,85],bathtub:[90,55],table:[80,78]}[ty];
      const before=R(85,130), f=cx+before+sz[0], o={};
      if(ty==='car') o.col=[C.red,C.blue,C.green,C.ochre][(rnd()*4)|0]; if(ty==='barrel') o.col=[C.blue,C.rust,C.green][(rnd()*3)|0]; if(ty==='sofa') o.col=[C.teal,C.red,C.ochre][(rnd()*3)|0];

      if(k==='tree'){ const tx=at(45); tree(X(tx),y,290,[[-d,y-95,100],[-d,y-195,45]]); wp(at(160),at(112),y-95,'branche'); wp(at(105),at(62),y-195,'branche'); }

      else if(k==='stubs'){ pipeV(X(at(25)),y-280,y,50,[]); pipeH(lo(at(190),at(110)),hi(at(190),at(110)),y-90,36,.85); pipeH(lo(at(125),at(48)),hi(at(125),at(48)),y-185,36,.85);
        wp(at(190),at(126),y-90,'piquage'); wp(at(125),at(51),y-185,'piquage'); wp(at(50),face,y-280,'piquage'); }
      else if(k==='objs'){ put('washer',at(160),y); put('wardrobe',at(58),y); wp(at(191),at(129),y-85,'lave-linge'); wp(at(113),at(3),y-170,'armoire'); }
      else if(k==='junk'){ put('car',at(445),y,{col:[C.red,C.blue,C.green,C.ochre][(rnd()*4)|0]}); put('tires',at(165),y); put('bookshelf',at(60),y);
        wp(at(545),at(390),y-130,'voiture'); wp(at(205),at(125),y-78,'pneus'); wp(at(105),at(15),y-220,'étagère'); }
      riser(face,H,R(2,6)); minL=200;
    }
    else if(tok.startsWith('__top:')){ const k=tok.slice(6); forceFL=CLIFF_NEED[k]+R(10,50); const f=ledge(forceFL+R(150,180),'replat du haut'); Pt(f,cy); cx=f; minL=0; }
    else if(tok==='__topc'){ forceL0=-150; const f=ledge(412+R(125,150),'replat du haut'); Pt(f,cy); cx=f; minL=0; }
    else if(tok==='top'||tok==='topc'){ const f=ledge(tok==='top'?R(470,510):R(690,730),'replat du haut'); Pt(f,cy); cx=f; minL=0; }

        const ax=X(x0), bx=X(x1), l=Math.hypot(bx-ax,y1-y0), nx=-(y1-y0)/l*6*(d>0?1:-1), ny=(bx-ax)/l*6*(d>0?1:-1);

/* ---------- Les 4 autres cartes : chacune son chemin, ses objets et son ambiance ---------- */
const DECOR=[];   // décor 3D sans collision (grue, poteaux, troncs de fond, bâtiments…)
function mkGen(th,L,d){
  const rnd=prng(th.seed), R=(a,b)=>a+(b-a)*rnd(), RI=(a,b)=>Math.floor(R(a,b+1));
  const g={rnd,R,RI,L,d,mu:th.mu,
    fx(){ return g.d>0?g.L.x1:g.L.x0; },
    span(n,w){ return g.d>0?[n,n+w]:[n-w,n]; },
    wp(a,b,t,n){ ROUTE.push([Math.min(a,b),Math.max(a,b),t,n]); },
    setL(a,b,t){ g.L={x0:Math.min(a,b),x1:Math.max(a,b),top:t}; },
    plat(kind,a,b,top,h,mu,ex){ const x0=Math.min(a,b),x1=Math.max(a,b);
      PIECES.push(Object.assign({kind,poly:rrect(x0,top,x1,top+h,Math.min(5,h/3)),x0,x1,top,h,cx:(x0+x1)/2,w:x1-x0,mu,seed:(SEED++)*1.7},ex||{})); },
    // une marche : g = écart avant (négatif = la pièce chevauche la précédente), r = montée, h = épaisseur (0 = jusqu'au sol)
    step(kind,w,gap,r,h,mu,name,ex){ const [a,b]=g.span(g.fx()+g.d*gap,w), t=g.L.top-r; g.plat(kind,a,b,t,h||(-t),mu,ex); g.wp(a,b,t,name); g.setL(a,b,t); return [Math.min(a,b),Math.max(a,b),t]; },
    put(type,x,y,opt){ PLACE.push([type,x,y,Object.assign({flip:g.d<0},opt||{})]); },
    deco(o){ DECOR.push(o); }
  };
  return g;
}
// les accroches d'un mur (mêmes réglages que sur la première montagne, tous franchissables)
function aid(g,k,face){
  const d=g.d,y=g.L.top,at=xl=>face-d*xl,mn=Math.min,mx=Math.max;
  if(k==='tree'){ const tx=at(40); tree(tx,y,290,[[-d,y-90,65],[-d,y-190,55]]); g.wp(at(120),at(55),y-90,'branche'); g.wp(at(110),at(55),y-190,'branche'); return 290; }
  if(k==='pipes'){ pipeH(mn(at(115),face),mx(at(115),face),y-110,40,.5); pipeH(mn(at(60),face),mx(at(60),face),y-200,40,.85); g.wp(at(115),face,y-110,'tuyau'); g.wp(at(60),face,y-200,'tuyau'); return 305; }
  if(k==='ice'){ rock(at(70),y-95,140,95,5,.35); rock(at(35),y-195,70,100,5,.35); g.wp(at(140),face,y-95,'glace'); g.wp(at(70),face,y-195,'glace'); return 300; }
  if(k==='stubs'){ pipeV(at(35),y-315,y,50,[[-d,y-85,85],[-d,y-175,85],[-d,y-265,85]]); for(const h of[85,175,265]) g.wp(at(145),at(60),y-h,'piquage'); return 315; }
  if(k==='objs'){ g.put('washer',at(160),y); g.put('wardrobe',at(58),y); g.wp(at(191),at(129),y-85,'lave-linge'); g.wp(at(113),at(3),y-170,'armoire'); return 260; }
  if(k==='junk'){ g.put('car',at(445),y,{col:[C.red,C.blue,C.green,C.ochre][(g.rnd()*4)|0]}); g.put('tires',at(165),y); g.put('bookshelf',at(60),y);
    g.wp(at(545),at(390),y-130,'voiture'); g.wp(at(205),at(125),y-78,'pneus'); g.wp(at(105),at(15),y-220,'étagère'); return 300; }
  if(k==='crates'){ g.plat('crate',at(175),at(90),y-85,85,1); g.plat('crate',at(90),at(5),y-170,170,1,{stack:2});
    g.wp(at(175),at(90),y-85,'caisse'); g.wp(at(90),at(5),y-170,'caisses'); return 255; }
  throw new Error('accroche inconnue '+k);
}
const AID_NEED={tree:150,pipes:190,ice:170,stubs:220,objs:270,junk:700,crates:200};

/* La Casse : des piles de conteneurs et d'épaves compressées, des bidons, une grue */
function buildCasse(){
  const g=mkGen({seed:211},{x0:-520,x1:-120,top:0},1); THEME='casse'; ZONE_OF=()=>3;
  const COLS=[0xb5452e,0x2f6a8f,0x3f7a45,0xc98b2a,0x7a3f8a,0x8f8f8f,0xa8322b,0x2a5a6a];
  g.wp(-520,-120,0,'départ');
  const expo=a=>(g.L.x1-g.L.x0)-a;
  const cont=(w,ex,name)=>{ if(g.L.big) ex=(g.L.x1-g.L.x0)-g.R(60,95); return g.step('cont',w,g.L.noOv?g.R(32,44):-expo(ex),100,0,1,name||'conteneur',{col:COLS[(g.rnd()*COLS.length)|0]}); };
  const plan=`
    cont cont cont big crush cont drum big cont cont wall:junk big
    crush crush cont big crane cont cont big tires cont wall:objs big
    cont crush cont big crane cont car big cont cont drum big
    cont wall:pipes cont big crush cont crane big cont cont tires big
    cont wall:junk crush big cont cont drum big cont crane cont big
    cont wall:objs cont big crush cont car big cont crane cont big
    cont drum wall:pipes big cont crush cont big crane cont cont big
    tires cont wall:junk big cont crush cont big cont drum cont big
    crane cont summit`;
  for(const tok of plan.trim().split(/\s+/)){
    if(tok==='cont') cont(g.R(185,235),g.R(95,130));
    else if(tok==='big'){ cont(g.R(460,600),g.R(95,130),'aire'); g.L.big=true; }
    else if(tok==='crush'){ const n=g.RI(3,4); for(let i=0;i<n;i++) g.step('crush',g.R(160,190),g.L.noOv?g.R(32,44):-expo(g.L.big?(g.L.x1-g.L.x0)-g.R(60,95):g.R(80,105)),g.R(52,62),0,1,'épaves',{col:COLS[(g.rnd()*COLS.length)|0]}); }
    else if(tok==='drum'||tok==='tires'){ const t=tok==='drum'?'barrel':'tires', hw=t==='barrel'?28:50, hh=t==='barrel'?85:78, x=g.fx()-g.d*(hw+20);
      g.put(t,x,g.L.top,t==='barrel'?{col:[C.blue,C.rust,C.green][(g.rnd()*3)|0]}:{}); g.wp(x-hw,x+hw,g.L.top-hh,t); g.setL(x-hw,x+hw,g.L.top-hh); g.L.noOv=true; }
    else if(tok==='crane'){ const [a,b,t]=g.step('girder',g.R(280,340),g.R(34,44),100,26,.9,'flèche de grue'); g.deco({t:'crane',x:g.d>0?b:a,top:t,len:b-a,d:g.d}); g.L.noOv=true; }
    else if(tok==='car'){ const [a,b,t]=cont(g.R(300,360),g.R(95,130),'conteneur large'); g.put('car',(a+b)/2,t,{deco:true,z:-175,col:[C.red,C.blue,C.green,C.ochre][(g.rnd()*4)|0]}); }
    else if(tok.startsWith('wall:')){ const k=tok.slice(5); cont(AID_NEED[k]+g.R(60,110),g.R(95,130),'conteneur large'); const face=g.fx(); const H=aid(g,k,face);
      const [a,b]=g.span(face,g.R(220,260)); g.plat('cont',a,b,g.L.top-H,H-g.L.top+0,1,{col:COLS[(g.rnd()*COLS.length)|0]}); g.wp(a,b,g.L.top-H,'pile'); g.setL(a,b,g.L.top-H); }
    else if(tok==='summit'){ const [a,b,t]=cont(420,g.R(95,130),'sommet'); g.L.noOv=false; const cx=(a+b)/2; GOAL={x:cx,y:t-26}; FLAG_Y=t; g.put('bench',cx-95,t,{deco:true,z:-60}); }
    else throw new Error(tok);
    if(tok!=='drum'&&tok!=='tires'&&tok!=='crane') g.L.noOv=false;
  }
  // une pile n'a pas de « trou » : le plan de pile s'appuie toujours sur la précédente ou sur le sol
  LEVEL.push({t:'ground',p:[[-9000,0],[20000,0],[20000,400],[-9000,400]]});
  START={x:-300,y:-30};
  PLACE.push(['car',-700,0,{deco:true,z:-160,col:C.blue}],['tires',-420,0,{deco:true,z:-100}],['barrel',-920,0,{deco:true,z:-60,col:C.rust}]);
}

  for(const tok of plan.trim().split(/\s+/)){

  const slab=(w,name)=>g.step('concrete',w,g.R(34,44),g.R(95,104),0,1,name||'dalle');
  const plan=`

    beam crates beam big beam wall:stubs catwalk big beam beam crates big
    tank beam wall:crates big beam beam catwalk big beam wall:pipes beam big

const OBST={washer:[31,85,26],barrel:[28,85,24],tires:[50,78,40],suitcase:[35,48,28],toilet:[34,90,22],sofa:[110,68,95],car:[210,130,70],

const OBST_NOT=/^P\d|haut|fosse|pont|quai|bord|prise|pente|cheminée|corniche|rocher|pierrier|îlot|étoiles|devant|tapis|trampoline|ventilateur|ascenseur|navette|planche|îlot|départ|sommet|canopée|toit|branche|piquage|tuyau|fourche|lave-linge|armoire|voiture|pneus|étagère|glace|barrel|tires|sérac|champignon|caisse|entre les troncs|haut du tronc|cuve|flèche|pile|mur|falaise/;

let OBST_N=0;
function addObstacles(){
  OBST_N=0;
  if(GAMEMODE!=='climb') return;
  if(HANDMADE){ const c=ROUTE.splice(0); for(const w of MOUNT_WPS_BASE) ROUTE.push([w[0],w[1],w[2],'replat']); for(const w of c) ROUTE.push(w); return; }
  return;   // montagnes générées : les prises sont déjà des objets
  const pool=OBST_POOL[THEME].split(' '), R=ROUTE.splice(0), skip=[];
  const blocked=(x0,x1,y0,y1)=>{ for(let x=x0;x<=x1;x+=9) for(let y=y0;y<=y1;y+=9) if(solidPt(x,y)) return true; return false; };
  const solidPt=(x,y)=>{ for(const p of candidates(x,y,2)){ if(x<p.minx||x>p.maxx||y<p.miny||y>p.maxy) continue; if(inside(p.p,x,y)) return true; } return false; };
  for(let i=0;i<R.length;i++){
    let w=R[i]; const nx=R[i+1];
    if(!nx||i===0||OBST_NOT.test(w[3])||/branche|tuyau|piquage|armoire|étagère|glace|rocher|corniche|champignon|prise|îlot|planche|navette|voiture|pneus|lave-linge|sérac/.test(R[i-1][3])||/branche|tuyau|piquage|rocher|glace|lave-linge|armoire|voiture|pneus|étagère|planche|navette|cheminée|bord|quai|îlot|pente|prise|sérac|pont/.test(nx[3])){ ROUTE.push(w); continue; }

        else { const o={type:ty,x:cx,y:top,flip:rnd()<.5,col:[C.red,C.blue,C.green,C.ochre,C.teal,C.rust][(rnd()*6)|0],z:0,deco:false,rot:0};
          PLACE.push([ty,cx,top,{flip:o.flip,col:o.col}]); OBJS.push(o); for(const p of COLL[ty](o)) LEVEL.push({t:'obj',p:xf(o,p),mu:GRIP[ty]}); }
        indexLevel();
        const back=dn>0?[w[0],cx-hw]:[cx+hw,w[1]], front=dn>0?[cx+hw,w[1]]:[w[0],cx-hw];
        if(back[1]-back[0]>=110) ROUTE.push([back[0],back[1],top,'avant:'+k]);
        ROUTE.push([cx-tw,cx+tw,top-h,'obstacle:'+k]);
        w=[front[0],front[1],top,(wide?'large après:':'après:')+k]; done=true;
      }

  }
}

function finishLevel(){
  for(const pc of PIECES) LEVEL.push({t:pc.kind,p:pc.poly,mu:pc.mu});
  for(const [type,x,y,opt={}] of PLACE){
    const o={type,x,y,flip:!!opt.flip,col:opt.col,z:opt.z||0,deco:!!opt.deco,rot:opt.rot||0};
    if(type==='ladder'){ const run=opt.tx-opt.bx, rise=opt.by-opt.ty; o.x=opt.bx; o.y=opt.by; o.rot=Math.atan2(run,rise); o.L=Math.hypot(run,rise)+15; o.nub=run<0?6:-6; o.flip=false; }
    OBJS.push(o);
    if(!o.deco) for(const p of COLL[type](o)) LEVEL.push({t:'obj',p:xf(o,p),mu:GRIP[type]});
  }
  updateDyn(); indexLevel(); addObstacles();
  GOAL_ALT=Math.max(1,Math.round((START.y-GOAL.y)/10));
}
function indexLevel(){
  for (const poly of LEVEL){
    if(poly._ix) continue; poly._ix=1;
    let a=0; poly.minx=poly.miny=1e9; poly.maxx=poly.maxy=-1e9;
    const p=poly.p;
    for (let i=0,j=p.length-1;i<p.length;j=i++){
      a += p[j][0]*p[i][1]-p[i][0]*p[j][1];
      poly.minx=Math.min(poly.minx,p[i][0]); poly.maxx=Math.max(poly.maxx,p[i][0]);
      poly.miny=Math.min(poly.miny,p[i][1]); poly.maxy=Math.max(poly.maxy,p[i][1]);
    }
    poly.cw = a>0; poly._s=0;
  }
  GRID=new Map();
  for(const poly of LEVEL){
    for(let gx=Math.floor(poly.minx/GCELL); gx<=Math.floor(poly.maxx/GCELL); gx++)
      for(let gy=Math.floor(poly.miny/GCELL); gy<=Math.floor(poly.maxy/GCELL); gy++){
        const k=gx*65536+gy; let c=GRID.get(k); if(!c){c=[];GRID.set(k,c);} c.push(poly); }
  }
}
function xf(o,pts){const c=Math.cos(o.rot),s=Math.sin(o.rot),f=o.flip?-1:1;

function buildLevel(mode,m){
  // une montagne trop large est retirée (toujours de la même façon pour une même graine)
  for(let k=0;k<6;k++){ buildLevelOnce(mode,m,k); if(mode!=='climb'||HANDMADE) return; let a=1e9,b=-1e9; for(const w of ROUTE){ if(w[0]<a)a=w[0]; if(w[1]>b)b=w[1]; } if(b-a<=3600&&GOAL_ALT>=720) return; }
}
function buildLevelOnce(mode,m,k){
  MECH.length=0; DYN.length=0; ZONES.length=0; SIMT=0; CARRY=null; PIECES.length=0; PLACE.length=0; DECOR.length=0; DEB.length=0; JUNKSKIN=false; LEVEL.length=0; OBJS.length=0; ROUTE.length=0; PROFILE=[]; SEED=1; BGROCK=false; ARENA=null;

/* ---------- Collisions ---------- */
function closestOnSeg(px,py,ax,ay,bx,by){
  const dx=bx-ax, dy=by-ay, l=dx*dx+dy*dy;
  let t = l ? ((px-ax)*dx+(py-ay)*dy)/l : 0; t = t<0?0:t>1?1:t;
  return [ax+dx*t, ay+dy*t];
}
function inside(p,x,y){
  let c=false;
  for (let i=0,j=p.length-1;i<p.length;j=i++){
    const xi=p[i][0],yi=p[i][1],xj=p[j][0],yj=p[j][1];
    if (((yi>y)!==(yj>y)) && (x < (xj-xi)*(y-yi)/(yj-yi)+xi)) c=!c;
  }
  return c;
}
const CAND=[];
function candidates(x,y,r){
  CAND.length=0; const st=++gridStamp;
  const gx0=Math.floor((x-r)/GCELL), gx1=Math.floor((x+r)/GCELL), gy0=Math.floor((y-r)/GCELL), gy1=Math.floor((y+r)/GCELL);
  for(let gx=gx0;gx<=gx1;gx++) for(let gy=gy0;gy<=gy1;gy++){ const c=GRID.get(gx*65536+gy); if(!c) continue;
    for(const p of c){ if(p._s!==st){ p._s=st; CAND.push(p); } } }
  for(const q of DYN){ if(q.active&&x+r>=q.minx&&x-r<=q.maxx&&y+r>=q.miny&&y-r<=q.maxy) CAND.push(q); }
  return CAND;
}
function collide(x,y,r,solo,qx,qy){
  let cx=x, cy=y, hit=false, nx=0, ny=0, mu=9, sp=null;
  const cands=candidates(x,y,r+40);
  for (let it=0; it<3; it++){
    let any=false;
    for (const poly of cands){
      if (cx+r<poly.minx||cx-r>poly.maxx||cy+r<poly.miny||cy-r>poly.maxy) continue;
      const p=poly.p; let bd=1e18, bx=0, by=0;
      for (let i=0,j=p.length-1;i<p.length;j=i++){
        const q=closestOnSeg(cx,cy,p[j][0],p[j][1],p[i][0],p[i][1]);
        const d=(q[0]-cx)**2+(q[1]-cy)**2;
        if (d<bd){bd=d;bx=q[0];by=q[1];}
      }
      const d=Math.sqrt(bd), ins=inside(p,cx,cy);
      let ux,uy,pen;
      if (ins){ if(d<1e-6) continue;
        if(qx!==undefined && !inside(p,qx,qy)){ let bq=1e18, ex=0, ey=0;
          for (let i=0,j=p.length-1;i<p.length;j=i++){ const q=closestOnSeg(qx,qy,p[j][0],p[j][1],p[i][0],p[i][1]); const dd=(q[0]-qx)**2+(q[1]-qy)**2; if(dd<bq){bq=dd;ex=q[0];ey=q[1];} }
          let vx=qx-ex, vy=qy-ey; const vl=Math.hypot(vx,vy)||1; vx/=vl; vy/=vl; const tx=ex+vx*r, ty=ey+vy*r;
          const ddx=tx-cx, ddy=ty-cy, pl=Math.hypot(ddx,ddy); if(pl>1e-6){ ux=ddx/pl; uy=ddy/pl; pen=pl; } else continue; }
        else { ux=(bx-cx)/d; uy=(by-cy)/d; pen=d+r; } }
      else if (d<r){ if(d<1e-6) continue; ux=(cx-bx)/d; uy=(cy-by)/d; pen=r-d; }
      else continue;
      cx+=ux*pen; cy+=uy*pen; nx+=ux*pen; ny+=uy*pen; hit=true; any=true; mu=Math.min(mu, poly.mu ?? MU); if(poly.sp) sp=poly;
    }
    if (!any) break;
  }
  if(!solo && r>HEAD_R) for(const c of REMOTE){ if(!c.body) continue; const dx=cx-c.x, dy=cy-c.y, d=Math.hypot(dx,dy), m=r+c.r;
    if(d<m && d>1e-6){ const pen=(m-d)*.35; cx+=dx/d*pen; cy+=dy/d*pen; } }
  const nl=Math.hypot(nx,ny);
  return {dx:cx-x, dy:cy-y, hit, nx:nl?nx/nl:0, ny:nl?ny/nl:0, pen:nl, mu: mu===9?MU:mu, sp};
}

function heart(g,x,y,s){ g.beginPath(); g.moveTo(x,y+s*.9); g.bezierCurveTo(x-s*1.4,y-s*.1,x-s*.7,y-s*1.1,x,y-s*.35); g.bezierCurveTo(x+s*.7,y-s*1.1,x+s*1.4,y-s*.1,x,y+s*.9); g.fill(); }
function star(g,x,y,s){ g.beginPath(); for(let i=0;i<10;i++){ const r=i%2?s*.45:s, a=-Math.PI/2+i*Math.PI/5; g.lineTo(x+Math.cos(a)*r,y+Math.sin(a)*r); } g.closePath(); g.fill(); }
function drawPattern(g,pat,col,w,h){
  g.fillStyle=col; g.strokeStyle=col; g.lineCap='round'; g.lineJoin='round';
  if(pat==='stripes'){ for(let y=12;y<h;y+=34) g.fillRect(0,y,w,13); }
  else if(pat==='vstripes'){ for(let x=10;x<w;x+=36) g.fillRect(x,0,15,h); }
  else if(pat==='dots'){ for(let y=18,r=0;y<h;y+=32,r++) for(let x=(r%2?34:16);x<w;x+=36){ g.beginPath(); g.arc(x,y,8.5,0,7); g.fill(); } }
  else if(pat==='checker'){ const s=32; for(let y=0;y<h;y+=s) for(let x=0;x<w;x+=s) if(((x+y)/s)%2===0) g.fillRect(x,y,s,s); }
  else if(pat==='zigzag'){ g.lineWidth=10; for(const y0 of [36,92]){ g.beginPath(); for(let x=-12;x<=w+24;x+=24) g.lineTo(x,y0+((x/24)%2?-13:13)); g.stroke(); } }
  else if(pat==='hearts'){ for(let y=30,r=0;y<h+10;y+=46,r++) for(let x=(r%2?48:22);x<w+20;x+=52) heart(g,x,y,13); }
  else if(pat==='stars'){ for(let y=28,r=0;y<h+10;y+=44,r++) for(let x=(r%2?46:20);x<w+20;x+=52) star(g,x,y,15); }
  else if(pat==='flames'){ for(let x=-10;x<w+30;x+=34){ const t=50+((x*7)%23); g.beginPath(); g.moveTo(x-17,h); g.bezierCurveTo(x-20,h-t*.6,x-4,h-t*.7,x,h-t); g.bezierCurveTo(x+4,h-t*.6,x+20,h-t*.5,x+17,h); g.fill(); } }
  else if(pat==='waves'){ g.lineWidth=9; for(const y0 of [28,64,100]){ g.beginPath(); for(let x=0;x<=w;x+=4) g.lineTo(x,y0+Math.sin(x/61*Math.PI*2)*8); g.stroke(); } }
}
function buildPotCanvas(l,cnv){

  if(l.base==='terra'){ let s=7; const r=()=>(s=(s*16807)%2147483647)/2147483647; for(let i=0;i<900;i++){ g.fillStyle=r()<.5?'rgba(0,0,0,.07)':'rgba(255,220,180,.08)'; g.fillRect(r()*POT_TW,r()*POT_TH,1+r()*3,1+r()*2); } }

}

function maskedFace(img){

function onLook(pid,d){

let NOISE_BUF=null;
function noiseBuf(){ if(!NOISE_BUF){ NOISE_BUF=AC.createBuffer(1,AC.sampleRate*.5,AC.sampleRate); const d=NOISE_BUF.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1; } return NOISE_BUF; }
function laughSyllable(out,t,f0,len,amp){
  const o=AC.createOscillator(); o.type='sawtooth';
  o.frequency.setValueAtTime(f0*1.15,t); o.frequency.exponentialRampToValueAtTime(f0*.82,t+len);
  const env=AC.createGain(); env.gain.setValueAtTime(.0001,t); env.gain.exponentialRampToValueAtTime(amp,t+.03); env.gain.exponentialRampToValueAtTime(.0001,t+len);
  o.connect(env);
  for(const [f,q,g] of [[780,7,1],[1180,9,.55],[2600,12,.18]]){ const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=f*(f0>250?1.12:1); bp.Q.value=q; const gg=AC.createGain(); gg.gain.value=g*2.2; env.connect(bp).connect(gg).connect(out); }
  // le « h » soufflé au début de chaque « ha »
  const n=AC.createBufferSource(); n.buffer=noiseBuf(); const hp=AC.createBiquadFilter(); hp.type='bandpass'; hp.frequency.value=1600; hp.Q.value=.8;
  const ng=AC.createGain(); ng.gain.setValueAtTime(.0001,t); ng.gain.exponentialRampToValueAtTime(amp*.5,t+.012); ng.gain.exponentialRampToValueAtTime(.0001,t+.07);
  n.connect(hp).connect(ng).connect(out); n.start(t,Math.random()*.4); n.stop(t+.08);
  o.start(t); o.stop(t+len+.02);
}
let lastLaugh=0;
function laugh(){ return;
  if(!AC) return; if(AC.state==='suspended') AC.resume(); const now=performance.now(); if(now-lastLaugh<1200) return; lastLaugh=now;
  const out=AC.createGain(); out.gain.value=.34; out.connect(AC.destination);
  const t0=AC.currentTime+.08;
  const voices=[{f:210,n:7,dt:.16,d:0,a:.5},{f:150,n:6,dt:.19,d:.1,a:.45},{f:290,n:8,dt:.135,d:.22,a:.35}];
  for(const v of voices) for(let i=0;i<v.n;i++){
    const t=t0+v.d+i*v.dt*(1+i*.05), f=v.f*(1-i*.03)*(1+Math.random()*.06);
    laughSyllable(out,t,f,v.dt*.72,v.a*(1-i/v.n*.55));
  }
  setTimeout(()=>{ try{out.disconnect();}catch(e){} },4000);
}

/* musique de la danse de victoire : un petit groove composé pour le jeu */
const DMUS={on:false,timer:0,next:0,step:0,out:null};
function startDanceMusic(delay){
  if(!AC) return; stopDanceMusic();
  DMUS.on=true; DMUS.step=0; DMUS.next=AC.currentTime+(delay||0);
  DMUS.out=AC.createGain(); DMUS.out.gain.value=.3; DMUS.out.connect(AC.destination);
  DMUS.timer=setInterval(schedDance,40);
}
function stopDanceMusic(){
  if(!DMUS.on) return; DMUS.on=false; clearInterval(DMUS.timer);
  const o=DMUS.out; if(o){ try{ o.gain.setTargetAtTime(0,AC.currentTime,.06); }catch(e){} setTimeout(()=>{ try{o.disconnect();}catch(e){} },500); }
}
function schedDance(){
  if(!DMUS.on||!AC) return; const s16=60/124/4;
  while(DMUS.next<AC.currentTime+.15){ danceStep(DMUS.step,DMUS.next); DMUS.next+=s16; DMUS.step++; }
  if(DMUS.step>=16*32) stopDanceMusic();
}
const DM_ROOTS=[110,87.31,130.81,98];          // la, fa, do, sol
const DM_BASS=[0,null,null,0,null,null,12,null,0,null,7,null,null,10,12,null];
function danceStep(i,t){
  const o=DMUS.out, p=i%16, bar=Math.floor(i/16), root=DM_ROOTS[bar%4];
  const tone=(f,type,len,vol,cut)=>{ const x=AC.createOscillator(); x.type=type; x.frequency.value=f; const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+len);
    if(cut){ const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=cut; x.connect(lp).connect(g); } else x.connect(g); g.connect(o); x.start(t); x.stop(t+len+.02); };
  const noise=(f,type,len,vol)=>{ const n=AC.createBufferSource(); n.buffer=noiseBuf(); const fl=AC.createBiquadFilter(); fl.type=type; fl.frequency.value=f; const g=AC.createGain(); g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.0001,t+len); n.connect(fl).connect(g).connect(o); n.start(t,Math.random()*.3); n.stop(t+len+.02); };
  if(p%4===0){ const k=AC.createOscillator(), g=AC.createGain(); k.frequency.setValueAtTime(160,t); k.frequency.exponentialRampToValueAtTime(42,t+.13); g.gain.setValueAtTime(1,t); g.gain.exponentialRampToValueAtTime(.0001,t+.3); k.connect(g).connect(o); k.start(t); k.stop(t+.32); }
  if(p===4||p===12) noise(1700,'bandpass',.14,.55);
  if(p%2===1) noise(8000,'highpass',.045,.22);
  const bn=DM_BASS[p]; if(bn!=null) tone(root*Math.pow(2,bn/12),'sawtooth',.13,.32,520);
  if(p===2||p===6||p===10||p===14){ const minor=bar%4!==2; for(const s of [0,minor?3:4,7]) tone(root*4*Math.pow(2,s/12),'square',.09,.045,2400); }
  if(bar%2===1 && (p===0||p===3||p===6||p===8)){ const mel=[7,5,3,0][(p===0?0:p===3?1:p===6?2:3)]; tone(root*8*Math.pow(2,mel/12)/2,'triangle',.16,.09); }
}


/* ---------- Musique de fond : composée par le jeu lui-même (aucun morceau existant, donc libre de droits) ----------
   Une ambiance par montagne + une pour la bagarre : accords, basse, petite mélodie qui varie à chaque tour */
const BGM={on:true,vol:.6,timer:0,next:0,step:0,out:null,style:-1,rs:1};
try{ const m=localStorage.getItem('grimpette_music'); if(m==='0') BGM.on=false; const v=parseFloat(localStorage.getItem('grimpette_mvol')); if(v>=0&&v<=1) BGM.vol=v; }catch(e){}
const MIDI=n=>440*Math.pow(2,(n-69)/12);
// tempo, accords (fondamentale MIDI + type), gamme de la mélodie, timbre
const BGM_STYLES=[
  {bpm:84, ch:[[57,'m'],[53,'M'],[48,'M'],[55,'M']], sc:[0,3,5,7,10], lead:'triangle', root:57, hat:.5, swing:0},   // La Montagne
  {bpm:96, ch:[[52,'m'],[48,'M'],[50,'M'],[47,'m']], sc:[0,3,5,7,10], lead:'square', root:52, hat:1, swing:.12},    // La Casse
  {bpm:76, ch:[[50,'M'],[47,'m'],[55,'M'],[57,'M']], sc:[0,2,4,7,9], lead:'sine', root:50, hat:.35, swing:0},       // La Forêt
  {bpm:102,ch:[[48,'m'],[44,'M'],[51,'M'],[46,'M']], sc:[0,3,5,7,10], lead:'sawtooth', root:48, hat:1, swing:0},    // L'Usine
  {bpm:70, ch:[[53,'M'],[55,'M'],[57,'m'],[48,'M']], sc:[0,2,4,7,9], lead:'sine', root:53, hat:.25, swing:0},       // Le Glacier
  {bpm:122,ch:[[55,'m'],[51,'M'],[53,'M'],[50,'M']], sc:[0,3,5,7,10], lead:'square', root:55, hat:1, swing:0}       // La Bagarre
];
function bgmStyle(){ return GAMEMODE==='arena'?5:Math.max(0,Math.min(4,MAP|0)); }
function bgmStart(){
  if(!AC||BGM.timer) return;
  BGM.style=bgmStyle(); BGM.step=0; BGM.rs=(Date.now()%100000)+7;
  BGM.out=AC.createGain(); BGM.out.gain.value=0;
  const lp=AC.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value=3200; BGM.out.connect(lp).connect(AC.destination); BGM.lp=lp;
  BGM.next=AC.currentTime+.15; BGM.timer=setInterval(bgmSched,50);
}
function bgmStop(){
  if(!BGM.timer) return; clearInterval(BGM.timer); BGM.timer=0;
  const o=BGM.out, l=BGM.lp; if(o){ try{ o.gain.setTargetAtTime(0,AC.currentTime,.25); }catch(e){} setTimeout(()=>{ try{o.disconnect(); l.disconnect();}catch(e){} },1500); }
  BGM.out=null;
}
// appelée à chaque image : démarre, coupe, baisse le son selon la situation
function bgmTick(){
  if(!AC) return;
  const want=BGM.on && !DMUS.on && !document.hidden;
  if(want && !BGM.timer) bgmStart();
  if(!want && BGM.timer) bgmStop();
  if(BGM.timer){
    if(BGM.style!==bgmStyle()){ bgmStop(); bgmStart(); return; }
    const level=BGM.vol*(state==='play'?.2:.11);
    if(Math.abs((BGM.lvl||0)-level)>.001){ BGM.lvl=level; try{ BGM.out.gain.setTargetAtTime(level,AC.currentTime,.4); }catch(e){} }
  }
}
function bgmRnd(){ BGM.rs=(BGM.rs*16807)%2147483647; return BGM.rs/2147483647; }
function bgmSched(){
  if(!BGM.timer||!AC) return; const S=BGM_STYLES[BGM.style], s16=60/S.bpm/4;
  while(BGM.next<AC.currentTime+.2){ bgmNote(S,BGM.step,BGM.next+(BGM.step%2?S.swing*s16:0)); BGM.next+=s16; BGM.step++; }
}
let BGM_MEL=[];
function bgmNote(S,i,t){
  const o=BGM.out; if(!o) return;
  const p=i%16, bar=Math.floor(i/16), ch=S.ch[bar%4], third=ch[1]==='m'?3:4;
  const env=(node,a,d,v)=>{ const g=AC.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(v,t+a); g.gain.exponentialRampToValueAtTime(.0001,t+a+d); node.connect(g); g.connect(o); return g; };
  const osc=(type,f,a,d,v,det)=>{ const x=AC.createOscillator(); x.type=type; x.frequency.value=f; if(det) x.detune.value=det; env(x,a,d,v); x.start(t); x.stop(t+a+d+.05); };
  // nappe d'accord au début de chaque mesure
  if(p===0) for(const n of [0,third,7]) for(const det of [-7,7]) osc('triangle',MIDI(ch[0]+12+n),.6,60/S.bpm*4,.035,det);
  // basse
  if(p===0||p===8||(p===11&&S.hat>.5)||(p===14&&bar%2)) osc(BGM.style===3?'square':'sine',MIDI(ch[0]-12+(p===11?7:0)),.01,.35,p===0?.28:.2);
  // petite batterie douce
  if(S.hat>.3&&(p===0||(p===8&&S.bpm>90))){ const k=AC.createOscillator(); k.frequency.setValueAtTime(110,t); k.frequency.exponentialRampToValueAtTime(40,t+.12); env(k,.005,.22,.32); k.start(t); k.stop(t+.3); }
  if(p%2===1&&bgmRnd()<S.hat){ const n=AC.createBufferSource(); n.buffer=noiseBuf(); const f=AC.createBiquadFilter(); f.type='highpass'; f.frequency.value=7500; n.connect(f); env(f,.002,.04,.07); n.start(t,Math.random()*.3); n.stop(t+.08); }
  if((p===4||p===12)&&S.bpm>90){ const n=AC.createBufferSource(); n.buffer=noiseBuf(); const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=1900; n.connect(f); env(f,.003,.12,.12); n.start(t,Math.random()*.3); n.stop(t+.16); }
  // mélodie : une phrase de 2 mesures inventée au hasard dans la gamme, rejouée puis renouvelée
  if(p===0&&bar%4===0){ BGM_MEL=[]; let deg=2; for(let k=0;k<32;k++){ if(bgmRnd()<(k%4===0?.75:.32)){ deg=Math.max(0,Math.min(9,deg+((bgmRnd()*5)|0)-2)); BGM_MEL.push([k,deg,bgmRnd()<.25?2:1]); } } }
  if(bar%4>=1){ const k=(bar%2)*16+p; for(const [kk,deg,len] of BGM_MEL) if(kk===k){ const oct=Math.floor(deg/5), n=S.root+12+oct*12+S.sc[deg%5]; osc(S.lead,MIDI(n),.012,60/S.bpm/4*len*1.8,S.lead==='square'||S.lead==='sawtooth'?.035:.08); } }
}
function setMusic(on){ BGM.on=on; try{ localStorage.setItem('grimpette_music',on?'1':'0'); }catch(e){} if(!on) bgmStop(); }
addEventListener('keydown',e=>{ if((e.key==='m'||e.key==='M')&&!e.repeat&&!(e.target&&e.target.tagName==='INPUT')){ setMusic(!BGM.on); const c=document.getElementById('qmus'); if(c) c.checked=BGM.on; } });

function boing(){ if(!AC) return; const t=AC.currentTime, o=AC.createOscillator(), g=AC.createGain(); o.type='sine'; o.frequency.setValueAtTime(180,t); o.frequency.exponentialRampToValueAtTime(520,t+.12); o.frequency.exponentialRampToValueAtTime(300,t+.28);
  g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.22,t+.02); g.gain.exponentialRampToValueAtTime(.0001,t+.32); o.connect(g).connect(AC.destination); o.start(t); o.stop(t+.34); }
function crackSound(){ if(!AC) return; const t=AC.currentTime; for(let i=0;i<3;i++){ const n=AC.createBufferSource(); n.buffer=noiseBuf(); const f=AC.createBiquadFilter(); f.type='bandpass'; f.frequency.value=900+i*500; f.Q.value=2; const g=AC.createGain();
  const tt=t+i*.07; g.gain.setValueAtTime(.25,tt); g.gain.exponentialRampToValueAtTime(.0001,tt+.06); n.connect(f).connect(g).connect(AC.destination); n.start(tt,Math.random()*.3); n.stop(tt+.07); } }
/* ---------- Entrées ---------- */
function clampOff(o){
  const l=Math.hypot(o.x,o.y);
  if(l<1e-3){o.x=MIN_L;o.y=0;return;}
  if(l>MAX_L){o.x*=MAX_L/l;o.y*=MAX_L/l;}
  else if(l<MIN_L){o.x*=MIN_L/l;o.y*=MIN_L/l;}
}
addEventListener('mousemove',e=>{
  mouse.x=e.clientX; mouse.y=e.clientY;
  if(state==='play' && locked){
    target.x+=e.movementX/S*SENS; target.y+=e.movementY/S*SENS; clampOff(target);
  }
});
function updateAbsTarget(){
  const ps=PIVS?PIVS():[W/2,H/2];
  const z=GAMEMODE==='arena'?cam.z:1;
  target.x=(mouse.x-ps[0])/S*SENS*z;
  target.y=(mouse.y-ps[1])/S*SENS*z;
  clampOff(target);
}
function onTouch(e){ const t=e.touches[0]; if(!t) return; mouse.x=t.clientX; mouse.y=t.clientY; absMode=true; if(state==='play') e.preventDefault(); }
cv.addEventListener('touchstart',onTouch,{passive:false});
cv.addEventListener('touchmove',onTouch,{passive:false});
document.addEventListener('pointerlockchange',()=>{
  locked = document.pointerLockElement===cv;
  if(locked){ absMode=false; }
  else if(state==='play' && !absMode){ state='pause'; save(); showOverlay(); }
});
document.addEventListener('pointerlockerror',()=>{ absMode=true; });
addEventListener('keydown',e=>{
  if(e.key==='+'||e.key==='='||e.key==='Add'){ FORCE=Math.min(1,Math.round((FORCE+0.1)*10)/10); saveForce(); showMsg('Force de la pioche : '+Math.round(FORCE*10)+'/10'); }
  if(e.key==='-'||e.key==='_'||e.key==='Subtract'){ FORCE=Math.max(0.1,Math.round((FORCE-0.1)*10)/10); saveForce(); showMsg('Force de la pioche : '+Math.round(FORCE*10)+'/10'); }
  if(e.key==='Escape' && state==='play' && absMode){ state='pause'; save(); showOverlay(); }
});
addEventListener('keydown',e=>{
  if(GAMEMODE!=='arena'||state!=='play') return; const k=e.key.toLowerCase();
  if(k==='q'||k==='a'||k==='arrowleft'){ AR.keys.l=1; e.preventDefault(); }
  if(k==='d'||k==='arrowright'){ AR.keys.r=1; e.preventDefault(); }
  if((k===' '||k==='z'||k==='w'||k==='arrowup')){ e.preventDefault(); if(!e.repeat) arenaJump(); }
  if((k==='e'||k==='f')&&!e.repeat) throwItem();
});
addEventListener('keyup',e=>{ const k=e.key.toLowerCase(); if(k==='q'||k==='a'||k==='arrowleft') AR.keys.l=0; if(k==='d'||k==='arrowright') AR.keys.r=0; });
cv.addEventListener('mousedown',e=>{ if(GAMEMODE!=='arena'||state!=='play') return; if(e.button===0) throwItem(); else if(e.button===2) arenaJump(); });
cv.addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('blur',()=>{ AR.keys.l=AR.keys.r=0; if(state==='play'){ save(); } });

/* ---------- Multijoueur : chacun voit les autres en direct et peut les bousculer ---------- */
const PEERS=new Map();      // pair -> état reçu (positions lissées à l'affichage)
const REMOTE=[];            // cercles des autres joueurs (et des mannequins) pour les collisions
let ROOM=null, MYPEER=null, hitSeq=0, lastHit=0, lastSend=0;
let NICK=(()=>{try{return localStorage.getItem('grimpette_nick')||'';}catch(e){return '';}})()||('Grimpeur'+Math.floor(Math.random()*90+10));
const MYCOL=Math.floor(Math.random()*8);
let multiStatus='solo';
const PLAYER_COLORS=[0xd63a2f,0x2f7fd6,0x2fae4e,0x9b4fd6,0xf08c1a,0x18b6b0,0xf2c81f,0xe75aa8];
const COLOR_NAMES=['rouge','bleu','vert','violet','orange','turquoise','jaune','rose'];
function colorIndexOf(id){ const ids=[MYPEER,...PEERS.keys()].filter(Boolean).sort(); const i=ids.indexOf(id); return (i<0?0:i)%PLAYER_COLORS.length; }
function setMultiStatus(s){multiStatus=s;const el=document.getElementById('mstat');if(el)el.textContent=s;}
let GAME=null, GAME_CODE='', gameUnsubs=[];
const CODE_CHARS='abcdefghjkmnpqrstuvwxyz23456789';
/* le code dit tout : un chiffre en premier = Bagarre, une lettre = Montée (et la montagne se déduit du code) */
function newCode(mode){ const first=mode==='arena'?'23456789':'abcdefghjkmnpqrstuvwxyz';
  let c=first[Math.floor(Math.random()*first.length)]; for(let i=0;i<4;i++) c+=CODE_CHARS[Math.floor(Math.random()*CODE_CHARS.length)]; return c; }
function cleanCode(c){return String(c||'').toLowerCase().replace(/[^a-z0-9]/g,'').slice(0,5);}
function codeInfo(code){ const c=cleanCode(code); if(c.length!==5) return null;
  if(/[0-9]/.test(c[0])) return {mode:'arena',map:0};
  let h=7; for(const ch of c) h=(h*31+ch.charCodeAt(0))%1000003; return {mode:'climb',map:h+11}; }
const myModeTag=()=>GAMEMODE==='arena'?'a':'c'+SEEDMAP;
const modeName=()=>GAMEMODE==='arena'?'Bagarre':'Montée · '+mapName();
function multiText(){
  if(!ROOM) return (window.claude&&window.claude.use)
    ? "Multijoueur réservé aux personnes connectées à Claude et invitées. Sans compte : joue avec le fichier grimpette.html."
    : "Multijoueur indisponible : pas de connexion internet.";
  if(!GAME) return (MODE==='room' ? "Parties « lien Claude » : tes amis doivent aussi passer par ce lien, connectés et invités. " : "Crée une partie ou entre le code d’un ami (tout le monde avec le fichier grimpette.html). ")
    + "Le code choisit tout seul le jeu et la montagne.";
  const n=[...PEERS.values()].filter(e=>e.mode===myModeTag()).length;
  return 'Partie '+GAME_CODE.toUpperCase()+' ('+modeName()+') · '+(n?(n+1)+' joueurs · ton pot est '+COLOR_NAMES[colorIndexOf(MYPEER)]:'en attente des autres joueurs (ils doivent entrer ce code)');
}
function refreshMultiUI(){
  setMultiStatus(multiText());
  const box=document.getElementById('mgame'); if(!box) return;
  const inGame=!!GAME;
  box.querySelector('.m-out').hidden=inGame; box.querySelector('.m-in').hidden=!inGame;
  const cd=box.querySelector('.m-code'); if(cd) cd.textContent=GAME_CODE.toUpperCase();

}
async function initMulti(){
  if(window.claude&&window.claude.use){
    let room=null; try{ room=await window.claude.use('room'); }catch(e){}
    if(room){ ROOM=room; MODE='room'; }
  } else if(await loadScript(['https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js','https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js'],()=>!!window.mqtt)){ ROOM={relay:true}; MODE='mqtt'; }
  refreshMultiUI();
  if(!ROOM) return;
  let last=''; try{last=localStorage.getItem('grimpette_code')||'';}catch(e){}
  if(last) joinGame(last,true);
}
async function joinGame(code,silent){
  code=cleanCode(code);
  if(code.length!==5){ if(!silent) setMultiStatus('Le code doit faire 5 caractères (lettres et chiffres).'); return; }
  if(!ROOM){ if(!silent) setMultiStatus(multiText()); return; }
  await leaveGame(true);
  // le code impose le jeu et la montagne
  const info=codeInfo(code);
  if(info.mode!==GAMEMODE || (info.mode==='climb' && info.map!==SEEDMAP)){ switchWorld(info.mode,info.map); if(state!=='play') showOverlay(); }
  setMultiStatus('Connexion à la partie '+code.toUpperCase()+'…');
  let g=null;
  if(MODE==='mqtt'){
    try{ g=await mqttJoin(code); }catch(e){ refreshMultiUI(); setMultiStatus('Connexion au relais impossible. Vérifie ta connexion internet.'); return; }
  } else {
    try{ g=await ROOM.join('g-'+code); }catch(e){ setMultiStatus('Impossible de rejoindre cette partie pour le moment. Réessaie.'); return; }
  }
  GAME=g; GAME_CODE=code;
  try{localStorage.setItem('grimpette_code',code);}catch(e){}
  if(MODE==='room'){
    gameUnsubs.push(g.onPeers(onPeersChange,()=>{GAME=null;PEERS.clear();refreshMultiUI();}));
    gameUnsubs.push(g.onConnection(c=>{ setMultiStatus(c?multiText():'Reconnexion…'); }));
  }
  refreshMultiUI(); sendPresence(performance.now(),true);
  if(state!=='play') showOverlay();
}
async function leaveGame(keepCode){
  for(const u of gameUnsubs){try{u();}catch(e){}} gameUnsubs=[];
  const g=GAME; GAME=null; GAME_CODE=''; PEERS.clear(); REMOTE.length=0; LOOKS.clear();
  if(g){ try{ await g.leave(); }catch(e){} }
  if(!keepCode){ try{localStorage.removeItem('grimpette_code');}catch(e){} }
  refreshMultiUI(); drawBoard();
}

/* ---- mode « fichier » : un relais en ligne public (MQTT) relie les joueurs, sans compte ni hôte ---- */
let MODE=null;
const BROKERS=['wss://broker.emqx.io:8084/mqtt','wss://broker.hivemq.com:8884/mqtt','wss://test.mosquitto.org:8081'];
async function loadScript(urls,test){
  if(test()) return true;
  for(const u of urls){ try{ await new Promise((res,rej)=>{const s=document.createElement('script');s.src=u;s.onload=res;s.onerror=rej;document.head.appendChild(s);}); if(test()) return true; }catch(e){} }
  return false;
}
function feedPlayers(players){
  const peers=Object.entries(players||{}).map(([id,p])=>({peer:id,sameTab:id===MYPEER,kind:'viewer',presence:(p&&typeof p==='object')?p:{}}));
  if(!peers.some(p=>p.sameTab)) peers.push({peer:MYPEER,sameTab:true,kind:'viewer',presence:{}});
  onPeersChange({peers,left:[],joined:[],updated:[]});
}
function connectBroker(i,topicBase,id){ return new Promise((res,rej)=>{
  if(i>=BROKERS.length){ rej({type:'network'}); return; }
  let settled=false;
  const cl=window.mqtt.connect(BROKERS[i],{clientId:'gp_'+id,clean:true,connectTimeout:6000,reconnectPeriod:2000,keepalive:20,
    will:{topic:topicBase+id,payload:'{"bye":1}',qos:0,retain:false}});
  const fail=()=>{ if(settled) return; settled=true; try{cl.end(true);}catch(e){} connectBroker(i+1,topicBase,id).then(res,rej); };
  const to=setTimeout(fail,7000);
  cl.on('connect',()=>{ if(settled) return; settled=true; clearTimeout(to); res(cl); });
  cl.on('error',()=>{ clearTimeout(to); fail(); });
}); }
async function mqttJoin(code){
  const id=Math.random().toString(36).slice(2,10); MYPEER=id;
  const base='grimpette/v3/'+code+'/';
  const cl=await connectBroker(0,base,id);
  const G={cl,states:new Map(),seenOthers:false,dirty:false};
  cl.subscribe(base+'+'); cl.subscribe(base+'+/look');
  cl.on('message',(topic,buf)=>{
    if(topic.endsWith('/look')){ const lp=topic.slice(base.length,-5); if(!lp||lp===id||lp.includes('/')) return;
      if(!buf||!buf.length){ LOOKS.delete(lp); return; }
      try{ onLook(lp,JSON.parse(new TextDecoder().decode(buf))); }catch(e){} return; }
    const pid=topic.slice(base.length); if(!pid||pid===id) return;
    let d=null; try{ d=JSON.parse(new TextDecoder().decode(buf)); }catch(e){ return; }
    if(!d||typeof d!=='object') return;
    if(d.bye){ G.states.delete(pid); G.dirty=true; return; }
    G.states.set(pid,{p:d,t:Date.now()}); G.seenOthers=true; G.dirty=true;
  });
  G.presence=async pr=>{ if(cl.connected){ try{ cl.publish(base+id,JSON.stringify(pr),{qos:0}); }catch(e){} } };
  // ton apparence (photo + pot) : message conservé par le relais pour ceux qui arrivent après
  G.look=w=>{ if(cl.connected){ try{ cl.publish(base+id+'/look',JSON.stringify(w),{qos:0,retain:true}); }catch(e){} } };
  G.look(lookWire());
  // les messages reçus sont traités à chaque image (pas d'attente)
  G.pump=()=>{ if(!G.dirty) return; G.dirty=false; const players={}; for(const [k,s] of G.states) players[k]=s.p; feedPlayers(players); };
  G.timer=setInterval(()=>{
    const now=Date.now(); for(const [k,s] of G.states) if(now-s.t>5000){ G.states.delete(k); G.dirty=true; }
    if(!cl.connected) setMultiStatus('Reconnexion au relais…');
  },500);
  G.leave=async()=>{ clearInterval(G.timer); try{ cl.publish(base+id+'/look','',{qos:0,retain:true}); cl.publish(base+id,'{"bye":1}'); cl.end(); }catch(e){} };
  return G;
}


/* ---------- Classement en ligne : les meilleurs temps de chaque montagne ----------
   sur claude.ai : la base partagée de la page ; ailleurs (PreviewShip…) : le relais MQTT public, messages conservés */
const LB={rows:[[],[],[],[],[]],src:null,cl:null,db:null,started:false,status:'Connexion au classement…',myId:null,view:0};
let LB_PID=null;
try{ LB_PID=localStorage.getItem('grimpette_pid'); if(!LB_PID){ LB_PID=Math.random().toString(36).slice(2,12); localStorage.setItem('grimpette_pid',LB_PID); } }catch(e){ LB_PID=Math.random().toString(36).slice(2,12); }
const LB_TOPIC='grimpette/lb1/';
const lbClean=n=>String(n||'').replace(/[^\p{L}\p{N} _\-'.!]/gu,'').slice(0,16)||'Grimpeur';
const fmtT=t=>{ const m=Math.floor(t/60), s=t-m*60; return m+':'+(s<10?'0':'')+s.toFixed(1); };
function lbAccept(m,id,d,quiet){
  if(!d||typeof d!=='object') return; const t=+d.t; if(!(t>=20&&t<360000)) return;
  const row={id:String(id).slice(0,64),n:lbClean(d.n),t,f:Math.max(0,+d.f|0),s:String(d.s||'').replace(/[^\p{L}\p{N} #’'\-]/gu,'').slice(0,24)};
  const R=LB.rows[m], i=R.findIndex(r=>r.id===row.id); if(i>=0) R[i]=row; else R.push(row);
  R.sort((a,b)=>a.t-b.t); if(R.length>300) R.length=300; if(!quiet) lbRender();
}
async function lbStart(){
  if(LB.started) return; LB.started=true;
  if(window.claude&&window.claude.use){
    try{ const db=await window.claude.use('db');
      if(db){ LB.db=db; LB.src='db'; LB.status='';
        try{ const u=await window.claude.use('user'); LB.myId=u?await u.id():null; }catch(e){}
        for(let m=0;m<5;m++){ try{ db.collection('lb'+m).orderBy('t','asc').limit(50).onSnapshot(qs=>{ LB.rows[m]=[]; for(const doc of qs.docs) lbAccept(m,doc.id,doc.data(),true); lbRender(); },()=>{}); }catch(e){} }
        lbRender(); return; } }catch(e){}
  }
  const ok=window.mqtt||await loadScript(['https://unpkg.com/mqtt@5.10.1/dist/mqtt.min.js','https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js'],()=>!!window.mqtt);
  if(!ok){ LB.status='Classement indisponible : pas de connexion internet.'; lbRender(); return; }
  try{
    const cl=await connectBroker(0,LB_TOPIC+'x/','lb'+LB_PID+Math.random().toString(36).slice(2,6)); LB.cl=cl; LB.src='mqtt'; LB.myId=LB_PID; LB.status='';
    cl.subscribe(LB_TOPIC+'+/+');
    cl.on('message',(topic,buf)=>{ const p=topic.slice(LB_TOPIC.length).split('/'), m=+p[0]; if(!(m>=0&&m<5)||!p[1]||!buf||!buf.length) return;
      try{ lbAccept(m,p[1],JSON.parse(new TextDecoder().decode(buf))); }catch(e){} });
    lbRender();
  }catch(e){ LB.status='Classement indisponible pour le moment.'; lbRender(); }
}
// envoie ton temps (seulement s'il bat ton record sur cette montagne)
async function lbSubmit(m,t,f){
  await lbStart();
  const row={n:lbClean(NICK),t:Math.round(t*10)/10,f:f|0,s:mapName()};
  const mine=LB.rows[m].find(r=>r.id===LB.myId); if(mine&&mine.t<=row.t&&mine.n===row.n){ lbRender(); return; }
  if(LB.src==='db'&&LB.myId){ try{ await LB.db.collection('lb'+m).doc(LB.myId).set(row); }catch(e){ LB.status='Ton temps n’a pas pu être envoyé (il faut pouvoir modifier la page).'; } }
  else if(LB.cl){ try{ LB.cl.publish(LB_TOPIC+m+'/'+LB_PID,JSON.stringify(row),{qos:1,retain:true}); }catch(e){} }
  if(LB.myId) lbAccept(m,LB.myId,row); lbRender();
}
function lbList(m,n){
  const R=LB.rows[m]; if(!R.length) return `<div class="lbempty">${LB.status||'Personne n’a encore atteint ce sommet. À toi de jouer !'}</div>`;
  const myI=R.findIndex(r=>r.id===LB.myId);
  let html=R.slice(0,n).map((r,i)=>lbRow(r,i)).join('');
  if(myI>=n) html+=`<div class="lbsep">…</div>`+lbRow(R[myI],myI);
  return html+(LB.status?`<div class="lbempty">${LB.status}</div>`:'');
}
function lbRow(r,i){ const me=r.id===LB.myId, med=['🥇','🥈','🥉'][i]||(i+1)+'.';
  return `<div class="lbrow${me?' me':''}"><span class="lbr">${med}</span><span class="lbn"></span><span class="lbf">💥 ${r.f}</span><span class="lbt">${fmtT(r.t)}</span></div>`.replace('<span class="lbn"></span>','<span class="lbn">'+r.n.replace(/[<>&"]/g,'')+(me?' (toi)':'')+(r.s?'<small class="lbs">'+r.s.replace(/[<>&"]/g,'')+'</small>':'')+'</span>'); }
function lbRender(){
  const p=document.getElementById('lbPanel');
  if(p){ for(const b of p.querySelectorAll('.lbtabs button')) b.classList.toggle('sel',+b.dataset.m===LB.view); const l=document.getElementById('lbList'); if(l) l.innerHTML=lbList(LB.view,10); }
  const w=document.getElementById('lbWin'); if(w) w.innerHTML='<div class="lbh">🏆 Classement général</div>'+lbList(0,5);

function openBoard(){

  boxEl.innerHTML=`<div class="settings lbpanel" id="lbPanel"><div class="st-h"><b style="font-family:Fredoka,sans-serif;font-size:24px;color:#ffd9a0">🏆 Classement en ligne</b><button type="button" id="lbBack">← Retour</button></div>

function onPeersChange(ch){
    for(const p of ch.peers){
      if(p.sameTab){MYPEER=p.peer;continue;}
      if(p.kind!=='viewer') continue;
      const pr=p.presence||{}; if(typeof pr.x!=='number'||typeof pr.y!=='number') continue;
      let e=PEERS.get(p.peer), fresh=false;
      if(!e){e={x:pr.x,y:pr.y,ox:+pr.ox||0,oy:+pr.oy||-60,hitK:(pr.hit&&+pr.hit.k)||0,kobK:(pr.kob&&+pr.kob.k)||0};PEERS.set(p.peer,e);fresh=true;}
      e.tx=pr.x; e.ty=pr.y; e.tox=+pr.ox||0; e.toy=+pr.oy||0; e.vx=+pr.vx||0;
      { const ts=+pr.ts||0, now=Date.now(); e.buf=e.buf||[];
        if(ts && (!e.buf.length || ts>e.buf[e.buf.length-1].ts)){
          if(e.buf.length){ const di=Math.min(400,ts-e.buf[e.buf.length-1].ts); e.ia=e.ia?e.ia*.9+di*.1:di; e.jt=e.jt!==undefined?e.jt*.9+Math.abs(di-e.ia)*.1:10; }
          e.buf.push({ts,x:pr.x,y:pr.y,ox:+pr.ox||0,oy:+pr.oy||0}); if(e.buf.length>40) e.buf.shift();
          const d=now-ts; e.offMin=(e.offMin===undefined||d<e.offMin)?d:e.offMin+0.02; } }
      e.n=String(pr.n||'Grimpeur').replace(/[^\p{L}\p{N} _\-'.!]/gu,'').slice(0,16)||'Grimpeur';
      e.c=(+pr.c|0); e.alt=+pr.a||0; e.st=pr.s==='play'; e.win=pr.s==='win'; e.mode=String(pr.mo||'c0');
      if(e.mode==='a'){
        e.d=Math.max(0,+pr.d||0); e.ko=+pr.ko||0; e.de=+pr.de||0; e.dd=!!pr.dd; e.iv=!!pr.iv; e.sh=!!pr.sh; e.su=!!pr.su; e.hi=ITEMS[pr.hi]?pr.hi:null;
        e.it=Array.isArray(pr.it)?pr.it:null;
        if(Array.isArray(pr.tk)) for(const id of pr.tk) AR.taken.add(String(id));
        if(GAMEMODE==='arena'){
          if(Array.isArray(pr.pj)) for(const q of pr.pj){ if(!Array.isArray(q)||PROJ.has(String(q[0]))) continue;
            const age=(Date.now()-(e.offMin||0))-(+q[6]||0); if(age<2600) registerProj({id:String(q[0]),k:q[1],x:+q[2],y:+q[3],vx:+q[4],vy:+q[5]},false,Math.max(0,Math.min(400,age)),p.peer); }
          if(Array.isArray(pr.ph)) for(const q of pr.ph){ const r=PROJ.get(String(q[0])); if(r&&!r.done){ r.done=true; r.doneT=performance.now(); if(r.k==='bomb') explode(r,+q[1],+q[2]); } }
          if(pr.kob && +pr.kob.k>e.kobK){ e.kobK=+pr.kob.k; if(!fresh && pr.kob.by===MYPEER){ AR.ko++; showMsg('💥 Tu as éjecté '+e.n+' !'); boomSound(.5); } }
        }
      }

    const c=(GAMEMODE==='arena'&&AR.stun>0)?NOC:collide(hx,hy,HEAD_R,false,lastHead.x,lastHead.y);
    if(c.sp&&c.sp.crumble&&!c.sp.tT){ c.sp.tT=SIMT; crackSound(); }
    if(REMOTE.length){ const hvx=(hx-lastHead.x)/h, hvy=(hy-lastHead.y)/h, hs=Math.hypot(hvx,hvy); if(hs>0) checkHit(hx,hy,hs,hvx/hs,hvy/hs); }
    if(c.hit){
      let cx=c.dx, cy=c.dy;
      if(headContact){
        const mx=hx+cx-lastHead.x, my=hy+cy-lastHead.y;
        const dn=mx*c.nx+my*c.ny, tx=mx-dn*c.nx, ty=my-dn*c.ny, tl=Math.hypot(tx,ty);
        if(tl>1e-6){ const cancel=Math.min(tl,c.mu*c.pen); cx-=tx/tl*cancel; cy-=ty/tl*cancel; }
      } else {
        const sp=c.pen/h; if(sp>120) clank(sp/4000);
      }
      P.x+=cx; P.y+=cy; hdx=cx; hdy=cy;
    }
    // Corps
    const b=collide(P.x,P.y,BODY_R);
    P.x+=b.dx; P.y+=b.dy;
    // le corps suit la pioche, mais seule une partie de la poussée devient de l'élan
    { let hvx=hdx*FORCE/h, hvy=hdy*FORCE/h; const hl=Math.hypot(hvx,hvy); if(GAMEMODE==='climb'&&hl>HVMAX){ hvx*=HVMAX/hl; hvy*=HVMAX/hl; }
      if(!headContact){ hvx=0; hvy=0; }
      const v0x=(P.x-px0-hdx-b.dx)/h, v0y=(P.y-py0-hdy-b.dy)/h, s0=Math.hypot(v0x,v0y);
      V.x=v0x+hvx; V.y=v0y+hvy;
      // l'élan donné par la pioche ne dépasse jamais PUSHMAX : on grimpe, on ne se fait plus catapulter
      if(GAMEMODE==='climb'&&(hvx||hvy)){ const s1=Math.hypot(V.x,V.y), lim=Math.max(s0,PUSHMAX); if(s1>lim){ V.x*=lim/s1; V.y*=lim/s1; } } }
    if(b.hit){
      bodyContact=true;
      const vn=V.x*b.nx+V.y*b.ny, tvx=V.x-vn*b.nx, tvy=V.y-vn*b.ny;
      const vnn=Math.max(vn,0);
      V.x=vnn*b.nx+tvx*BODY_FR; V.y=vnn*b.ny+tvy*BODY_FR;
    }
    if(b.sp){ const q=b.sp;
      if(q.bounce&&b.ny<-.45&&vy0>70){ V.y=-Math.min(1450,Math.max(q.bounce,vy0*.92)); if(SIMT-q.lastB>.15) boing(); q.lastB=SIMT; }
      if(q.belt&&b.ny<-.45) P.x+=q.belt*h;
      if(q.dyn){ CARRY=q; carryT=SIMT; if(q.crumble&&!q.tT){ q.tT=SIMT; crackSound(); } }
    }
    if(CARRY&&SIMT-carryT>.06) CARRY=null;
    const vl=Math.hypot(V.x,V.y); if(vl>VMAX){V.x*=VMAX/vl; V.y*=VMAX/vl;}
    lastHead.x=P.x+PIV.x+ox; lastHead.y=P.y+PIV.y+oy; headContact=c.hit;
  }
}

function checks(){
  const a=alt();
  if(a>best) best=a;
  if(a>peak) peak=a;
  if(bodyContact && Math.abs(V.y)<60){
    if(peak-a>25){
      falls++;
      let i; do{ i=Math.floor(Math.random()*QUOTES.length);}while(i===lastQuote && QUOTES.length>1);
      lastQuote=i; showMsg(QUOTES[i]);
    }
    peak=a;
  }
  if(Math.hypot(P.x-GOAL.x,P.y-GOAL.y)<48 && !won){
    won=true; state='win'; DANCE.t0=performance.now();
    if(bestTime==null||time<bestTime) bestTime=time;
    save(); if(document.exitPointerLock) document.exitPointerLock();
    startDanceMusic(.95); if(GAMEMODE==='climb') lbSubmit(0,time,falls);
    setTimeout(()=>{ if(state==='win') showOverlay(); },5200);
  }
}

  let bx=58*es, by=2+(10-2)*es+Math.sin(Math.PI*e)*72;
  const dancing=el>J+.05, tb=dancing?(el-J-.05)/B:0, beat=Math.floor(tb), ph=tb-beat, move=Math.floor(beat/8)%4;

  if(dancing){ bob=-5*Math.abs(Math.sin(Math.PI*tb)); sway=Math.sin(Math.PI*tb)*.07; }
  if(dancing&&move===1) bx+=Math.sin(Math.PI*tb/2)*14;          // pas chassés

      else if(move===1){ if((beat%2)===i) lift=Math.sin(Math.PI*ph)*8; fx+=side*3; }     // pas chassés
      else if(move===2){ if((beat%2)===i){ lift=Math.sin(Math.PI*ph)*20; fz=2+Math.sin(Math.PI*ph)*20; } } // coups de pied
      else { fx+=side*4; }

  else if(move===1){ const s=Math.sin(Math.PI*tb/2); T=[V(bx-26+s*10,shY-10+Math.abs(s)*14,12),V(bx+26+s*10,shY-10+Math.abs(s)*14,12)]; }

function rockGeo(pts2d,z0,z1,amp,keepTopY,seed,tint){
  const shape=new THREE.Shape(resample(pts2d,20).map(q=>new THREE.Vector2(q[0],-q[1])));
  const geo=new THREE.ExtrudeGeometry(shape,{depth:z1-z0,steps:Math.max(2,Math.round((z1-z0)/40)),bevelEnabled:false,curveSegments:1});geo.translate(0,0,z0);

  for(let i=0;i<pa.count;i++){let x=pa.getX(i),y=pa.getY(i),z=pa.getZ(i);
    const n1=fbm(x/80+seed,y/80+z/140),n2=fbm(y/80+seed*2,z/80+x/140),n3=fbm(z/80+seed*3,x/80+y/140);
    const isTop=keepTopY!==null && Math.abs(y-keepTopY)<2.5;
    // bord avant et arrière arrondis
    const ez=Math.min(z-z0,z1-z)/(z1-z0);
    x+=(n1-.5)*amp*(isTop?0.3:1.6); z+=(n3-.5)*amp*1.4;
    if(!isTop) y+=(n2-.5)*amp*1.6; else if(ez<.12) y-=(.12-ez)*amp*2.2;
    pa.setXYZ(i,x,y,z);}
  geo.computeVertexNormals();colorize(geo,seed,tint);return geo;}

function adaptQuality(t){
  if(QUAL.forced) return;
  if(!QUAL.lastT){QUAL.lastT=t;return;} const ft=t-QUAL.lastT; QUAL.lastT=t;
  if(ft>200) return; QUAL.acc+=ft; QUAL.frames++;
  if(QUAL.frames<90) return; const avg=QUAL.acc/QUAL.frames; QUAL.acc=0; QUAL.frames=0;
  if(avg>22 && QUAL.level<3){ QUAL.level++;
    if(QUAL.level===1){ QUAL.pr=0.8; }
    else if(QUAL.level===2){ if(window.__sun){window.__sun.castShadow=false;} }
    else { QUAL.pr=0.6; }
    resize(); }
}

// et l'image affiche une position interpolée entre les deux derniers pas : aucun à-coup.
let last=performance.now(), saveT=0, simAcc=0;
const FIXED=1/120, RP={px:0,py:0,ox:0,oy:0,ok:false};
function simSteps(dt,fn){
  simAcc+=dt; let n=0;
  while(simAcc>=FIXED&&n<12){ RP.px=P.x; RP.py=P.y; RP.ox=off.x; RP.oy=off.y; fn(FIXED); simAcc-=FIXED; n++; }
  if(n>=12) simAcc=0; if(n) RP.ok=true;
}
function loop(t){

  if(GAME&&GAME.pump) GAME.pump();
  buildRemoteCircles();
  if(state==='play'||state==='pause'||state==='win') sendPresence(t);
  if((t|0)%500<17) drawBoard();
  if(state!=='win'&&DANCE.t0){ DANCE.t0=0; stopDanceMusic(); }
  bgmTick();
  let interp=false;
  if(GAMEMODE==='arena'){
    if(state==='play'){ if(absMode) updateAbsTarget(); simSteps(dt,arenaUpdate); interp=true; } else { simAcc=0; RP.ok=false; }
    arenaTick(FRAME_DT);
  } else {
    if(state==='play'){
      if(absMode) updateAbsTarget();
      simSteps(dt,h=>{ if(state!=='play') return; step(h); time+=h; checks(); });
      saveT+=dt; if(saveT>2){saveT=0; save();}
      interp=state==='play';
    } else { simAcc=0; RP.ok=false; }
  }
  const sx=P.x, sy=P.y, sox=off.x, soy=off.y, Pref=P, Oref=off;
  if(interp&&RP.ok&&Math.abs(P.x-RP.px)+Math.abs(P.y-RP.py)<160){ const a=simAcc/FIXED;
    P.x=RP.px+(sx-RP.px)*a; P.y=RP.py+(sy-RP.py)*a; off.x=RP.ox+(sox-RP.ox)*a; off.y=RP.oy+(soy-RP.oy)*a; }
  if(GAMEMODE==='arena') arenaCam(FRAME_DT);
  else { const k=1-Math.exp(-FRAME_DT*3.2), ty=P.y-140, dy=ty-cam.y, dz=Math.sign(dy)*Math.max(0,Math.abs(dy)-18);
    cam.x+=(P.x-cam.x)*k; cam.y+=dz*k; }
  if(R3D){ R3D(t); adaptQuality(t); }
  Pref.x=sx; Pref.y=sy; Oref.x=sox; Oref.y=soy;
  drawHUD();
  requestAnimationFrame(loop);
}

window.addEventListener('error',e=>{ const d=document.getElementById('err'); if(d){ d.hidden=false; d.textContent='Erreur : '+e.message; } });
load();
showOverlay();
initMulti();
requestAnimationFrame(loop);
setTimeout(()=>{ const d=document.getElementById('err');
  try{ if(typeof THREE==='undefined') throw new Error("la bibliothèque 3D n'a pas pu se charger (connexion internet nécessaire)");
    const t0=performance.now(); init3D(); console.log('3D prête en',Math.round(performance.now()-t0),'ms');
    document.getElementById('loading').hidden=true;
  }catch(e){ d.hidden=false; d.textContent='Erreur 3D : '+e.message; console.error(e); }
},60);
</script>
